{"label":"Article (full)","text":"MONROE COUNTY IS NOT A SELLER'S MARKET EVERYWHERE. IT'S A PRICING TEST MARKET.\nThe Pocono Ledger · Week of July 26, 2026\n\nEXECUTIVE SUMMARY\nRates moved the wrong way this week and Monroe County kept moving anyway. The 30-year fixed ticked up to 6.58%, the county's median sale price sits at $349K (up 14.9% year over year), and well-priced homes are clearing in 22 days versus 30 a year ago. Read together, those numbers don't describe a runaway seller's market. They describe a market that is testing your price. Homes priced to today's financing reality sell fast. Homes priced to 2021 scarcity sit — and then cut.\n\nTHE WEEK'S NUMBERS\nRates. Freddie Mac's 30-year fixed averaged 6.58% for the week, up from 6.55% the prior week and down from 6.74% a year ago. VA pricing is running roughly 5.86% to 6.35% depending on lender — still a meaningful edge over conventional. The Fed is widely expected to hold at 3.5%–3.75% at its July 29 meeting, though markets have started pricing a higher chance of a hike later this year.\nMonroe County. Median sale price $349K, up 14.9% year over year. Average days on market: 22, down from 30 last year. The county's first-time homebuyer program still offers up to $20,000 in down payment and closing-cost assistance, which keeps demand alive in the lower-to-mid price bands.\n\nWHAT CHANGED THIS WEEK\nTwo things. First, the rate story got slightly worse — 6.55% to 6.58%. Small on paper, real in Monroe County, where most of the action lives between $250K and $600K. At that range, the payment gap between the low 6s and the high 6s changes who qualifies once taxes and insurance stack on top. Second, we're still operating fully under the post-settlement NAR rules: buyer-agent compensation is no longer displayed in the MLS, and written buyer agreements are required before showings. That's not new, but it keeps negotiation explicit on both sides — and it rewards buyers who come in represented and prepared.\n\nTOWNSHIP SPOTLIGHT — THE $250K–$600K BAND\nThis is where the pricing test is sharpest. Across Coolbaugh, Chestnuthill, and Stroud townships, the entry-to-mid band is doing the county's heavy lifting — first-time buyers, VA households, and STR investors all fishing the same water. The $20,000 county assistance program lands squarely in this range, which is why a correctly priced $300K–$400K home still draws multiple looks in a week. Go $40K over what the comps and the financing support, and you're not 'testing the market' — you're subsidizing the buyer's patience.\n\nOPERATOR OBSERVATION\nHere's my read after another week in it: the biggest disconnect in Monroe County isn't demand, it's expectation. Sellers keep quoting me the number their neighbor got in 2021. Buyers keep waiting for a crash that the 22-day DOM says isn't coming. Both are wrong. The market is active and selective at the same time. It will pay full freight for the right house at the right number and it will ignore the wrong number for 45 days. The problem was never demand. It's mispriced listings.\n\nWHAT BUYERS SHOULD DO\nTarget homes that have been on market 14 days or longer and push for credits over price. Use the slower summer pace as leverage, not as a reason to stall. If you're a VA or first-time buyer, rate-shop hard and pull the assistance program into the conversation early — the spread between conventional and VA pricing, plus up to $20,000 in county help, can move you a full price tier.\n\nWHAT SELLERS SHOULD DO\nPrice for the first 14 days, not the last 30. Monroe County's 22-day average rewards an accurate launch and punishes a stretch. If a cut is coming, make it early and make it decisive — the data says buyers are here, they're just not paying for optimism. July still captures late-summer family relocations and VA buyers before the fall slowdown, so a right-priced launch now beats a hopeful one that drifts into September.\n\nSOURCES\nFreddie Mac PMMS (30-yr fixed 6.58%); Bankrate & NerdWallet (VA rates); CBS News (July 29 FOMC hold expectation); Redfin Monroe County housing market (median $349K, +14.9% YoY, 22 DOM); Monroe County RDA First-Time Homebuyer Program (up to $20,000); NAR settlement facts; Monroe County Sheriff Real Estate Sales & Bid4Assets."}

{"label":"Post (no hashtags)","text":"Local Insight — Monroe County, Week of July 26, 2026\n\nMonroe County has sheriff real-estate sales on the calendar right now — the next one is July 30, followed by August 27, September 24, and October 29. Here's the part most buyers misread: these properties are sold sight unseen and subject to all liens. The auction price is the entry fee, not the total cost.\n\nThat matters in a record-price market. A distressed property that looks cheap at the gavel can carry back taxes, a second mortgage, and possession complications that erase the 'discount' entirely. The real edge is the pre-auction homework — title, liens, condition, and who's still living there — not the auction itself.\n\nIf you're weighing a distressed or foreclosure purchase in Stroudsburg, East Stroudsburg, Tobyhanna, or Mount Pocono, that first conversation is free — and it should start well before the sale date.\n\nAlexa Sanchez · Licensed Realtor · PA License #RS326383 · Smart Way America Realty\n(570) 688-8147 · Alexa@alexasanchez.net"}

{"label":"Script (longer, deeper mechanics)","text":"Buyer decision tree: (1) CASH — fastest close, most leverage, most common for U.S. buyers in Cap Cana/Punta Cana. (2) NON-RESIDENT BANK MORTGAGE — Scotiabank's non-resident vacation-home program up to 70% LTV, up to 25 years; broader market often 30–50% down, USD rates ~8–10%, heavier documentation. (3) DEVELOPER FINANCING — narrower, project-specific, useful on pre-construction. Then the hard rule: the VA loan is limited to the U.S. and its territories, so it does not finance a DR purchase — and CONFOTUR is a tax incentive, not a mortgage. Close on: pick your financing lane before you fall in love with a unit."},

{"label":"YouTube description","text":"Can you use a VA loan to buy in the Dominican Republic? No — the VA loan only applies to the U.S. and its territories, so Americans buying in Punta Cana or Cap Cana need a different plan. This video walks the three real financing paths: paying cash, a non-resident bank mortgage (Scotiabank advertises up to 70% financing / 25-year terms, while the broader market often means 30–50% down and USD rates around 8–10%), and developer financing on pre-construction. We also clear up a common myth: CONFOTUR is a tax incentive, not a mortgage program.\n\n0:00 The VA loan myth · 0:40 Path 1: cash · 1:20 Path 2: non-resident mortgage · 2:20 Path 3: developer financing · 3:10 CONFOTUR is not a loan\n\nAlexa Sanchez · Licensed Realtor · PA License #RS326383 · Smart Way America Realty\n(570) 688-8147 · Alexa@alexasanchez.net"},

{"id":"fri-li","day":"fri","time":"8:00 AM","title":"LinkedIn Veteran Post","account":"@alexa.realtor","platform":"LinkedIn","kind":"post","blocks":[
{"label":"Post","text":"'Can I use my VA loan to buy a place in the Dominican Republic?'\n\nI get this from veteran buyers constantly, and the answer matters before anyone wires money: no. The VA loan is limited to the United States and its territories, so it cannot finance a Dominican Republic purchase. And CONFOTUR — the incentive people confuse it with — is a tax benefit on approved projects (exemption from the 3% transfer tax and up to 15 years on the 1% annual property tax), not a mortgage program.\n\nFor veterans buying abroad, that means planning the financing from day one: cash, a non-resident bank mortgage, or developer financing. Different playbook entirely from a VA purchase back home in Pennsylvania. Educational only — happy to point you to the right people.\n\nAlexa Sanchez · PA License #RS326383 · Smart Way America Realty · (570) 688-8147\n\n#VeteranHomebuyer #VALoan #DominicanRepublicRealEstate #InternationalRealEstate"}
],"note":null,"flag":null},

{"label":"Tracker line","text":"2026-07-31 | Lifestyle | 'A Random Tuesday in the Poconos' | lakeside morning coffee scene | CTA: Placeholder (Pillar) | watercolor"}
],"note":null,"flag":null},

{"id":"gal-landmark","day":"gallery","time":"Standing","title":"Landmark Card — Bushkill Falls (real photo)","account":"Website","platform":"Local Life & Global Vibes","kind":"gallery","blocks":[
{"label":"Photo direction","text":"Bushkill Falls, main falls from the lower boardwalk viewpoint, mid-morning soft light, boardwalk leading into frame, full summer foliage. Real photo only — never illustrated. Use a different frame from the Friday IG post so a visitor who saw the Reel still gets something new. Canva manual crop, 4:5."},
{"label":"Short caption","text":"Bushkill Falls · Bushkill, PA — the 'Niagara of Pennsylvania,' open since 1904. Living-here nature, not vacation nature."},
{"label":"Alt text","text":"Real photograph of Bushkill Falls waterfall and boardwalk trail in Bushkill, Pennsylvania, in summer."},
{"label":"Tracker line","text":"2026-07-31 | Landmark | Bushkill Falls (Bushkill/Pike County) | real photo | CTA: n/a"}
],"note":"Listing card: SKIP this week — no new active inventory.","flag":null}

]};

const DAYS = [
  {id:"sun", label:"Sun", full:"Sunday",    date:"July 26"},
  {id:"mon", label:"Mon", full:"Monday",    date:"July 27"},
  {id:"tue", label:"Tue", full:"Tuesday",   date:"July 28"},
  {id:"wed", label:"Wed", full:"Wednesday", date:"July 29"},
  {id:"thu", label:"Thu", full:"Thursday",  date:"July 30"},
  {id:"fri", label:"Fri", full:"Friday",    date:"July 31"},
  {id:"sat", label:"Sat", full:"Saturday",  date:"August 1"},
  {id:"gallery", label:"Gallery", full:"Website Gallery Cards", date:"Any time this week"}
];

const state = {};           // itemId -> bool
let sb = null;
let persist = false;

const $ = s => document.querySelector(s);
const key = id => DATA.weekHash + ":" + id;
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- SYNC ---------- */
function setSync(cls, text){
  const el = $("#sync");
  el.className = "sync " + cls;
  $("#syncText").textContent = text;
}

async function initSync(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY){
    setSync("warn", "Not synced — add Supabase keys to save across devices");
    return;
  }
  try{
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const {data, error} = await sb.from("ops_checks")
      .select("key,done").like("key", DATA.weekHash + ":%");
    if(error) throw error;
    (data || []).forEach(r => { state[r.key.split(":").slice(1).join(":")] = !!r.done; });
    persist = true;
    setSync("ok", "Synced · " + DATA.weekHash);
    render();
  }catch(err){
    console.error(err);
    setSync("warn", "Sync failed — checks won't save. Check keys and RLS policy.");
  }
}

async function save(id, done){
  if(!persist) return;
  try{
    const {error} = await sb.from("ops_checks")
      .upsert({key:key(id), done, updated_at:new Date().toISOString()}, {onConflict:"key"});
    if(error) throw error;
    setSync("ok", "Saved " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}));
  }catch(err){
    console.error(err);
    setSync("warn", "Didn't save — check connection");
  }
}

/* ---------- RENDER ---------- */
let activeDay = DAYS[new Date().getDay()] ? DAYS[new Date().getDay()].id : "sun";
if(!DAYS.some(d => d.id === activeDay)) activeDay = "sun";

function itemsFor(day){ return DATA.items.filter(i => i.day === day); }
function doneCount(day){ return itemsFor(day).filter(i => state[i.id]).length; }

function renderTabs(){
  $("#tabs").innerHTML = DAYS.map(d => {
    const list = itemsFor(d.id), done = doneCount(d.id);
    const all = list.length > 0 && done === list.length;
    return `<button class="tab${all ? " all-done" : ""}" role="tab" data-day="${d.id}"
      aria-selected="${d.id === activeDay}">${d.label}
      <span class="count">${done}/${list.length}</span></button>`;
  }).join("");
}

function renderProgress(){
  const total = DATA.items.length;
  const done = DATA.items.filter(i => state[i.id]).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  $("#progressFill").style.width = pct + "%";
  $("#progressText").textContent = done + " of " + total + " posted";
  $("#progressPct").textContent = pct + "%";
}

function cardHTML(it){
  const done = state[it.id] ? "1" : "0";
  const blocks = it.blocks.map((b, i) => `
    <div class="block">
      <div class="block-head">
        <span class="block-label">${esc(b.label)}</span>
        <button class="copy-btn" data-copy="${it.id}|${i}">Copy</button>
      </div>
      <pre id="blk-${it.id}-${i}">${esc(b.text)}</pre>
    </div>`).join("");
  return `
  <article class="card" data-id="${it.id}" data-done="${done}" data-open="0"
           data-flagged="${it.flag ? 1 : 0}">
    <div class="card-top">
      <button class="check" data-check="${it.id}" aria-pressed="${done === "1"}"
        aria-label="Mark ${esc(it.title)} posted">
        <svg viewBox="0 0 24 24"><polyline points="4 12.5 9.5 18 20 6.5"/></svg>
      </button>
      <div class="card-main">
        <div class="card-time">${esc(it.time)}</div>
        <h3 class="card-title">${esc(it.title)}</h3>
        <div class="chips">
          <span class="chip acct">${esc(it.account)}</span>
          <span class="chip${it.kind === "gbp" ? " kind-gbp" : ""}">${esc(it.platform)}</span>
        </div>
      </div>
    </div>
    ${it.flag ? `<div class="flag">${esc(it.flag)}</div>` : ""}
    ${it.note ? `<div class="note">${esc(it.note)}</div>` : ""}
    <button class="toggle-blocks" data-toggle="${it.id}">
      <span>${it.blocks.length} copy block${it.blocks.length > 1 ? "s" : ""}</span>
      <span class="arrow">▼</span>
    </button>
    <div class="blocks">${blocks}</div>
  </article>`;
}

function renderDay(){
  const d = DAYS.find(x => x.id === activeDay);
  const list = itemsFor(activeDay);
  $("#main").innerHTML = `
    <div class="day-head">
      <h2>${esc(d.full)}</h2><span class="date">${esc(d.date)}</span>
    </div>
    ${list.length ? list.map(cardHTML).join("")
      : `<p class="empty">Nothing scheduled. Enjoy it.</p>`}`;
}

function render(){ renderTabs(); renderDay(); renderProgress(); }

/* ---------- EVENTS ---------- */
document.addEventListener("click", async e => {
  const tab = e.target.closest("[data-day]");
  if(tab){ activeDay = tab.dataset.day; render(); window.scrollTo({top:0}); return; }

  const chk = e.target.closest("[data-check]");
  if(chk){
    const id = chk.dataset.check;
    state[id] = !state[id];
    const card = chk.closest(".card");
    card.dataset.done = state[id] ? "1" : "0";
    chk.setAttribute("aria-pressed", state[id]);
    renderTabs(); renderProgress();
    save(id, state[id]);
    return;
  }

  const tog = e.target.closest("[data-toggle]");
  if(tog){
    const card = tog.closest(".card");
    card.dataset.open = card.dataset.open === "1" ? "0" : "1";
    return;
  }

  const cp = e.target.closest("[data-copy]");
  if(cp){
    const [id, i] = cp.dataset.copy.split("|");
    const text = document.getElementById("blk-" + id + "-" + i).textContent;
    try{
      await navigator.clipboard.writeText(text);
    }catch(_){
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
    }
    cp.textContent = "Copied"; cp.classList.add("copied");
    setTimeout(() => { cp.textContent = "Copy"; cp.classList.remove("copied"); }, 1400);
  }
});

$("#resetBtn").addEventListener("click", async () => {
  if(!confirm("Clear every check for " + DATA.week + "? This can't be undone.")) return;
  const ids = DATA.items.map(i => i.id);
  ids.forEach(id => state[id] = false);
  render();
  if(persist){
    try{
      await sb.from("ops_checks").delete().like("key", DATA.weekHash + ":%");
      setSync("ok", "Week cleared");
    }catch(err){ console.error(err); setSync("warn", "Reset didn't save"); }
  }
});

/* ---------- BOOT ---------- */
$("#weekLabel").textContent = DATA.week;
render();
initSync();
</script>
</body>
</html>

html,body{margin:0;padding:0}

.progress-track{height:6px;background:#2A2C24;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--brass);transition:width .35s ease}

  font-size:10.5px;color:#9C9C90;margin-top:6px;letter-spacing:.06em}

.card[data-open="1"] .blocks{display:block}

.block-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
.copy-btn{background:var(--ink);color:var(--paper);border:0;border-radius:var(--radius);
  padding:4px 10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  flex:0 0 auto}
.copy-btn.copied{background:var(--brass);color:#FFF}
pre{margin:0;background:#FAFAF6;border:1px solid var(--line);border-left:2px solid var(--ink);

.sync.warn .dot{background:#F4C542}

  padding:4px 9px;font-family:inherit;font-size:10px;letter-spacing:.06em;text-transform:uppercase}

const DATA = {"week": "Aug 9–15, 2026", "weekHash": "2026-08-09", "items": [{"id": "sun-ledger", "day": "sun", "time": "Written first", "title": "The Pocono Ledger (blog)", "account": "@alexa.realtor", "platform": "alexa.realtor blog", "kind": "article", "blocks": [{"label": "SEO title", "text": "Monroe County Real Estate: The August Auction Window & Where Buyers Actually Have Leverage (Week of Aug 9, 2026)"}, {"label": "Meta description", "text": "Monroe County's repository and Sheriff auctions open in August. Rates, the 18-day pending window, and where Pocono buyers really hold negotiating power. From licensed PA Realtor Alexa Sanchez."}, {"label": "Slug + internal link", "text": "Slug: /blog/pocono-ledger-monroe-county-august-auctions-2026-08-09\n\nLink UP to the Pillar: 'New to the area? Start with our complete 2026 guide to living in the Pocono Mountains & Lehigh Valley.'"}, {"label": "Article (full)", "text": "THE POCONO LEDGER — MONROE COUNTY'S AUGUST AUCTION WINDOW OPENS\nWeek of August 9, 2026\n\nNew to the Pocono Mountains? Start with our complete 2026 guide to living here. (Pillar link)\n\nEXECUTIVE SUMMARY\nAugust puts a calendar on distress in Monroe County. The Tax Claim Bureau's repository sale runs August 12, the Sheriff's real-estate auction follows August 27 through Bid4Assets, and the annual Upset Sale, which targets parcels two years delinquent, arrives in September. That sequence creates a narrow pre-deadline window where owners can still sell on their own terms and preserve equity instead of losing it to the gavel. Underneath the auction story, the resale market keeps splitting in two: 56.6% of county sales closed below list price in May, yet well-priced turnkey homes still went to pending in a median of 18 days in June. This is not a blanket buyer's market. It is a market that rewards negotiation discipline against the right property and punishes hesitation on the right one.\n\nTHE WEEK'S NUMBERS\n- 30-year fixed: 6.69% (Freddie Mac, week ending August 6), up 3 basis points from 6.66%.\n- 30-year VA purchase: 5.875% quoted August 7 (Veterans United), APR 6.318% with 1.688 points. Roughly $130/month less per $100,000 borrowed than the conventional benchmark. Shop at least two lenders.\n- Fed: Held the target range at 3.50%–3.75% in late July on a divided vote. Near-term rate relief is not a planning assumption.\n- Monroe County: Median value roughly $318,500–$319,442 (Zillow); Redfin reports a $349,000 median sale price, up 14.9% YoY for the three months ending May. Median days to pending 18 (June). Earlier 2026 reporting: 38 days on market, 98.1% list-to-sale ratio.\n- Price cuts: An April report found 22% of listings had reductions, averaging $12,500 or 4.1% of list.\n- Lodging-tax load (STR underwriting): a combined 9% — 6% PA hotel occupancy tax plus 3% county hotel room rental tax — before any municipal permit fee.\n\nWHAT CHANGED THIS WEEK\nConventional financing worsened modestly, up 3 basis points to 6.69%, while one VA lender survey moved the other way, widening the gap veterans capture by shopping. The next national demand read, NAR's June pending-home-sales release, lands August 18, so this week's interpretation stays anchored to rates and active-listing behavior rather than a fresh national print. On the regulatory side, the brokerage-rule environment is now structural, not new: written buyer agreements precede MLS-facilitated tours, compensation must be stated clearly, and offers of compensation cannot appear on the MLS.\n\nNEIGHBORHOOD / TOWNSHIP SPOTLIGHT — THE AUGUST DISTRESS LADDER\nMonroe County's distress tiers are not interchangeable. The repository sale (August 12) is the deepest tier: parcels that already failed prior tax sales, useful as an investor and title-risk screen, not a seller-conversion lane. The Sheriff sale (August 27) is the active-foreclosure tier, and the pre-sale window is where equity is still savable. The September Upset Sale captures owners two years delinquent, which makes August the month to reach those owners with a conventional-sale or cash option before fees compound. One mechanic almost no one explains: after a tax sale, former owners and other eligible parties may have unclaimed excess proceeds — overbids — that the county holds for three years before they revert to taxing authorities. That is real money owed to real people who often do not know it exists. Estate contacts run through the Register of Wills, Kate Best, One Quaker Plaza, Stroudsburg, (570) 517-3347.\n\nOPERATOR OBSERVATION\nHere is what I tell sellers in August: the auction calendar is not your enemy, the deadline is. If your taxes are behind, you have more options right now than you will have in September, and every one of them beats the courthouse steps. And for buyers chasing 'deals' — the best Pocono value this month is rarely the foreclosure everyone is watching. It is the tired listing with bad first photos, a stale 2021 price, and unpackaged rental potential that the whole feed scrolled past. Underwrite the payment at 6.69% today and treat a future refinance as upside, never as the reason you bought.\n\nWHAT BUYERS SHOULD DO\n- Buy the property, not the forecast. Underwrite at today's rate.\n- Veterans: pull at least two VA loan estimates on identical terms. The spread is real qualifying power.\n- Target stale inventory — 30+ days of exposure, prior reductions, weak STR attributes — and negotiate credits or a buydown over chasing the newest 'Instagram-ready' listing.\n- For any STR play, verify township eligibility in writing and model the 9% lodging load before you fall in love with a pro forma.\n\nWHAT SELLERS SHOULD DO\n- Price for the first 14 days. With an 18-day median to pending, early silence is feedback, not bad luck.\n- Do not anchor to a 2021–22 price. A strategic launch protects leverage better than visible reductions.\n- Make the use case obvious: permit/HOA status, rental history, seasonal carrying costs, amenity distance, bedroom count, guest functionality.\n- If taxes are behind, talk to a Realtor before the September Upset Sale, not after.\n\nSOURCES\nFreddie Mac PMMS; Veterans United VA rates (Aug 7, 2026); Charles Schwab/FOMC (late-July hold); Zillow & Redfin Monroe County data; Monroe County Tax Claim Bureau (repository, upset, overbids); Monroe County Sheriff / Bid4Assets; Register of Wills; NAR pending home sales (Aug 18) & settlement rules. Alexa Sanchez, Licensed PA Realtor #RS326383, Smart Way America Realty. Educational only; rates not guaranteed."}], "note": "Source of truth. Everything market-side derives from this — no re-reporting. Auction urgency leads this week. County median/YoY still a May print; June county figure not out yet.", "flag": null}, {"id": "sun-hub", "day": "sun", "time": "Record + upload", "title": "Hub Video EN — the spoken Ledger", "account": "@alexa.realtor", "platform": "YouTube", "kind": "video", "blocks": [{"label": "Script", "text": "HOOK (0:00–0:08)\nMonroe County's August auction window is open. If your taxes are behind, you have more options this week than you will in September. Watch.\n\nOPEN (0:08–0:25)\nI'm Alexa Sanchez, Smart Way America Realty, PA License RS326383. This is the Pocono Ledger for the week of August 9th. Three things move this week: the auction calendar, mortgage rates, and where buyers actually have leverage.\n\nSECTION 1 — THE AUCTION LADDER (0:25–1:10)\nRepository sale August 12th. Sheriff's sale August 27th on Bid4Assets. Upset Sale in September for anyone two years delinquent. Here's the part nobody explains: after a tax sale, former owners can be owed excess proceeds, overbids, and Monroe County holds that money for three years. If you're behind, selling before the deadline protects your equity. The gavel doesn't.\n\nSECTION 2 — RATES (1:10–2:00)\nThirty-year fixed sits at 6.69%, up three basis points. VA purchase quoted at 5.875%. That's about $130 a month less per hundred thousand borrowed. Veterans, that spread is why you pull two estimates, not one. The Fed held in July. Don't buy on a rate-cut rumor.\n\nSECTION 3 — WHERE LEVERAGE LIVES (2:00–2:45)\nFifty-six percent of May sales closed under list, but good homes still went pending in eighteen days. That's a split market. Your leverage isn't a low-ball on a fresh listing. It's the tired listing with bad photos and a 2021 price everyone scrolled past.\n\nCTA (2:45–3:00)\nNew to the Poconos? Start with my complete 2026 guide to living here, linked below. Behind on taxes or thinking about selling? Call me, 570-688-8147. That's the Ledger."}, {"label": "YouTube title", "text": "Monroe County PA Real Estate Update: August Auctions, Mortgage Rates & Where Buyers Have Leverage (Aug 2026)"}, {"label": "YouTube description", "text": "Monroe County's August tax-sale and Sheriff-auction calendar is open, and it changes what sellers behind on taxes should do right now. In this week's Pocono Ledger, Alexa Sanchez breaks down the repository sale, the Sheriff's sale, the September Upset Sale, and the overbid rule almost no one explains.\n\nQ: When are the Monroe County property auctions in 2026? Repository sale August 12, Sheriff's real-estate sale August 27 (Bid4Assets), Upset Sale in September for parcels two years delinquent.\nQ: What are mortgage rates in the Poconos right now? 30-year fixed 6.69%; VA purchase around 5.875%.\nQ: Is it a buyer's market in Monroe County? It's a split market — leverage against stale, mispriced listings; competition on turnkey homes still pending in ~18 days.\n\n0:00 The August auction window\n0:25 The distress ladder + overbids\n1:10 Mortgage rates & VA\n2:00 Where buyer leverage really is\n2:45 Start-here guide + contact\n\nAlexa Sanchez · REALTOR · PA License #RS326383 · Smart Way America Realty · (570) 688-8147 · Alexa@alexasanchez.net"}, {"label": "Tags", "text": "monroe county real estate, pocono mountains homes, pa tax sale, sheriff sale poconos, mortgage rates 2026, va loan pa, pocono str, sell house behind g": null}, {"id": "sun-pir", "day": "sun", "time": "Record + upload", "title": "PIR Ep. 01 — Tax-sale overbids (Pocono data)", "account": "@alexa.realtor", "platform": "YouTube playlist + IG lane", "kind": "video", "blocks": [{"label": "Reusable card template (build once)", "text": "Card 1 — Title: episode title + 'The Property Intelligence Report' lockup\nCard 2 — The Fear (hook): a STATEMENT of the fear (no question)\nCard 3 — The Fact: the verifiable rule/number, cited\nCard 4 — The Mechanic: how it works, plainly\nCard 5 — What To Do: the concrete step\nCard 6 — CTA: Ep.01 CTA-free; later PA = Smart Way block; DR = Urban Group (gated). All point at the Pillar."}, {"label": "Episode 01 script (voice over cards)", "text": "Card 2 (fear): If a Monroe County property was lost to a tax sale, the family may be owed money they'll never know exists.\n\nCard 3 (fact): When a property sells at a tax sale for more than the debt owed, the extra is called an overbid. In Monroe County, the county holds those excess proceeds for three years before they revert to taxing authorities.\n\nCard 4 (mechanic): Here's how it works. Debt is $40,000. The property sells for $95,000. That $55,000 gap doesn't just vanish into the county. Former owners and other legally eligible parties can claim it. But the clock is three years, and after that, it's gone.\n\nCard 5 (what to do): If you or a family member lost a Monroe County property in the last three years, contact the Tax Claim Bureau and ask about overbids or excess proceeds. Bring the parcel and the sale date. Don't leave your own money on the county's shelf.\n\nCard 6: [CTA-FREE — Episode 01 sets the informational identity.]"}, {"label": "YouTube description", "text": "Title: Tax Sale Overbids in Monroe County PA: The Money Former Owners Don't Know They're Owed | Property Intelligence Report Ep. 01\n\nWhen a Pennsylvania property sells at a tax sale for more than the debt, the surplus (overbid) can belong to the former owner. Monroe County holds these excess proceeds for three years. Episode 01 explains the mechanic and the deadline.\n\nQ: What is a tax-sale overbid? The surplus when a property sells for more than the taxes and costs owed.\nQ: How long does Monroe County hold overbids? Up to three years before they revert to taxing authorities.\nQ: Who can claim it? The former owner and other legally eligible parties.\n\n0:00 The fear\n0:12 What an overbid is\n0:35 The mechanic, with numbers\n1:05 How to check\n\nEducational only; not legal advice. The Property Intelligence Report. Alexa Sanchez, REALTOR, PA License #RS326383, Smart Way America Realty.\n\nTags: tax sale overbid, excess proceeds pennsylvania, monroe county tax claim, surplus funds tax sale, pa tax sale, foreclosure surplus, property intelligence report, pocono real estate"}, {"label": "IG lane caption", "text": "If your family lost a Monroe County property to a tax sale, you may be owed money the county is holding right now. The overbid rule, explained. Property Intelligence Report, Ep. 01.\n\n#PoconoRealEstate #STRInvesting #MonroeCounty #PropertyIntelligence #LifeByAlexa"}], "note": "PIR WEEKLY CHECK = YES. Segment: Pocono data / consumer-protection. Source: research layer (02A), NOT the Ledger. CTA-FREE (identity-setting). Establishes the reusable card template. NOT counted in the 16.", "flag": null}, {"id": "mon-li", "day": "mon", "time": "8:00 AM", "title": "LinkedIn Market Signal", "account": "@alexa.realtor", "platform": "LinkedIn", "kind": "post", "blocks": [{"label": "Post", "text": "The Monroe County calendar tells sellers more than the rate sheet does this week.\n\nRepository sale Aug 12. Sheriff's sale Aug 27. Upset Sale in September for anyone two years delinquent. The mechanic professionals should be flagging to distressed owners: after a tax sale, excess proceeds (overbids) can be owed back to the former owner, and the county holds them for three years.\n\nMeanwhile the resale market stays split: 56.6% of May sales under list, yet an 18-day median to pending on well-prepared homes. That is not a buyer's market. It is a discipline market.\n\nThe value this month is not the foreclosure everyone is watching. It is the stale, mispriced, poorly-photographed listing the feed ignored.\n\n#PoconoRealEstate #MonroeCounty #RealEstateInvesting #STRInvesting"}], "note": null, "flag": null}, {"id": "mon-gbp1", "day": "mon", "time": "9:00 AM", "title": "GBP Market Update", "account": "@alexa.realtor", "platform": "Google Business Profile", "kind": "gbp", "blocks": [{"label": "Post (no hashtags)", "text": "Monroe County's August auction calendar is now set. The Tax Claim Bureau repository sale is August 12, the Sheriff's real-estate sale is August 27, and the September Upset Sale targets properties two years delinquent. If you are behind on taxes, the pre-deadline window is when you can still sell on your terms and protect your equity. Mortgage context this week: 30-year fixed 6.69%, VA purchase near 5.875%. Well-priced Pocono homes are still going to pending in about 18 days even as more than half of May sales closed below list. Questions about a sale before September? Reach out.\n\nAlexa Sanchez · Local Pocono Mountains Realtor · PA License #RS326383 · Smart Way America Realty · (570) 688-8147 · Alexa@alexasanchez.net"}], "note": "No hashtags. No addresses. No client names. Highest AEO weight.", "flag": null}, {"id": "mon-fb", "day": "mon", "time": "10:00 AM", "title": "Personal FB — English", "account": "Personal", "platform": "Facebook", "kind": "post", "blocks": [{"label": "Post", "text": "If someone you know in the Poconos is behind on their property taxes, send them this. Monroe County's repository sale is August 12, the Sheriff's sale is August 27, and the September Upset Sale hits anyone two years delinquent. There are real options before those dates that keep your equity in your pocket, including one most people don't know: after a tax sale the county can owe the former owner money it holds for three years. August is the month to act, not September. Happy to talk it through, no pressure. — Alexa"}], "note": null, "flag": null}, {"id": "mon-gbp2", "day": "mon", "time": "11:00 AM", "title": "GBP Local Insight — the overbid mechanic", "account": "@alexa.realtor", "platform": "Google Business Profile", "kind": "gbp", "blocks": [{"label": "Post (no hashtags)", "text": "A Monroe County fact most homeowners never hear: when a property sells at a tax sale for more than what is owed, the extra money (the overbid) can belong to the former owner, and the county holds it for up to three years before it reverts to taxing authorities. If you or a family member lost a Monroe County property to a tax sale in the last three years, it is worth checking. Questions about tax-distress real estate options? I'm glad to point you in the right direction.\n\nAlexa Sanchez · REALTOR · PA License #RS326383 · Smart Way America Realty · (570) 688-8147 · Alexa@alexasanchez.net"}], "note": "Second GBP angle, distinct from the Market Update. The differentiated overbid angle other agents don't cover.", "flag": null}, {"id": "mon-carousel", "day": "mon", "time": "Market rollout", "title": "IG Market Carousel", "account": "@alexa.realtor", "platform": "Instagram", "kind": "post", "blocks": [{"label": "Slides", "text": "Slide 1 (cover): 'MONROE COUNTY'S AUGUST AUCTION WINDOW IS OPEN' — red/white bold\nSlide 2: The ladder — Repository Aug 12 / Sheriff Aug 27 / Upset Sale September\nSlide 3: The overbid rule — former owners can be owed excess proceeds; county holds 3 years\nSlide 4: Rates — 6.69% fixed / 5.875% VA / ~$130 less per $100K\nSlide 5: Split market — 56.6% under list, but 18-day median to pending\nSlide 6: The real deal — stale, mispriced, bad-photo listings, not the obvious foreclosure\nSlide 7 (CTA): Behind on taxes or selling before September? Call 570-688-8147. Entity block."}, {"label": "Caption", "text": "August is a deadline, not a disaster. If you're behind on Monroe County taxes, this window is when you still control the outcome. Swipe for the auction ladder + the overbid rule nobody explains.\n\n#PoconoRealEstate #MonroeCounty #PoconoMountains #STRInvesting #PARealEstate #LifeByAlexa"}], "note": null, "flag": null}, {"id": "tue-cc", "day": "tue", "time": "3:00 PM", "title": "Car Confession EN — the launch failed", "account": "@alexa.realtor", "platform": "IG + YouTube Shorts", "kind": "video", "blocks": [{"label": "Script (20 sec)", "text": "Your house didn't fail because it sat thirty days. Your launch failed. Wrong price the first week. A dark lead photo. Repairs you skipped. No showings after five. And no story for the buyer. Fix the launch, not the price. Eighteen days is the Monroe County median. If you're past it, we need to talk.\n\n[Flat delivery. No smile. Hard cut on 'talk.']"}, {"label": "IG caption", "text": "Thirty days on market isn't the problem. A bad launch is. Five things that stall a Monroe County listing 👇 price band, lead photo, deferred repairs, showing access, no buyer story.\n\n#PoconoRealEstate #MonroeCounty #PoconoMountains #PARealEstate #LifeByAlexa"}, {"label": "Cover text", "text": "RED/WHITE: YOUR LAUNCH FAILED. NOT YOUR HOUSE."}, {"label": "YT Shorts description", "text": "Why do Pocono homes sit on the market? Usually not the reason sellers think. Alexa Sanchez, REALTOR, PA License #RS326383, Smart Way America Realty, on the five launch errors that stall a Monroe County listing. (570) 688-8147.\n\nTags: pocono real estate, monroe county homes, why isn't my house selling, home listing mistakes, sell home poconos, pa realtor"}], "note": "Source: 02A. Car Confession angle this week = the launch, not the 30 days. (Misconception is a SEPARATE piece this week — see below.)", "flag": null}, {"id": "tue-misc", "day": "tue", "time": "Post (flex slot)", "title": "Misconception Reel — split market", "account": "@alexa.realtor", "platform": "IG + YouTube Short", "kind": "video", "blocks": [{"label": "Chosen misconception + truth", "text": "MISCONCEPTION: 'If homes are going under list, it's a buyer's market.'\nTRUTH: Monroe County is a split market. Buyers have leverage against mispriced or compromised listings, but well-prepared homes still go pending in a median of 18 days. The edge is selection and negotiation discipline, not indiscriminate low offers.\nFORMAT: IG Reel over Car Confession — needs one data beat (56.6% vs 18 days) to land, which a 20-sec confession can't carry cleanly."}, {"label": "Script (30–60 sec)", "text": "'Homes are selling under list, so it's a buyer's market.' Wrong. It's a split market, and confusing the two costs you the house. Yes, 56.6% of Monroe County sales closed below list in May. But good homes still went pending in eighteen days. So a low-ball on a fresh, well-priced listing just loses you the deal. Your real leverage is the stale listing, the one with the bad photos and the 2021 price the whole feed scrolled past. Discipline beats desperation. That's the market."}, {"label": "Cover text", "text": "RED/WHITE: IT'S NOT A BUYER'S MARKET. IT'S A SPLIT MARKET.\nNEON GREEN: 56.6% vs 18 DAYS"}, {"label": "YouTube Short description", "text": "Title: Is It a Buyer's Market in the Poconos? Why Monroe County Is a 'Split Market' in 2026\nHomes going under list doesn't mean a buyer's market. Where Monroe County buyers actually have leverage, and where they don't.\nAlexa Sanchez, REALTOR, PA License #RS326383, Smart Way America Realty. (570) 688-8147.\n\nTags: buyers market poconos, monroe county real estate, is it a buyers market 2026, pocono home prices, pa real estate, homes under asking price"}, {"label": "Caption", "text": "'Under list = buyer's market.' That mistake costs people the house. It's a split market 👇\n\n#PoconoRealEstate #MonroeCounty #PoconoMountains #STRInvesting #LifeByAlexa"}], "note": "Output 12. Source: 01A. Separate from the Car Confession this week (per your split). Timing flexible — placed Tue; move to Sat if the Tue slot feels heavy.", "flag": null}, {"id": "tue-nd", "day": "tue", "time": "9:00 AM", "title": "Nextdoor — Neighborly Post", "account": "@alexa.realtor", "platform": "Nextdoor", "kind": "post", "blocks": [{"label": "Post", "text": "Friendly heads-up for neighbors: the county's summer tax-sale and Sheriff-sale dates are in August and September this year. If you or someone on your street is dealing with back taxes, there are more options earlier than later, and the county Tax Claim Bureau can walk you through the basics. Just trying to make sure nobody gets caught off guard. — Alexa Sanchez"}], "note": "No selling language. No CTA. Identity via signature only.", "flag": null}, {"id": "wed-aldia", "day": "wed", "time": "Record + post", "title": "Pocono al Día — market (Spanish)", "account": "@alexa.realtor", "platform": "IG + YouTube", "kind": "video", "blocks": [{"label": "Guión (cadencia dominicana · <3 min · un tema)", "text": "Óyeme bien. En el condado de Monroe, agosto tiene fecha límite. Si tú estás atrasado con los taxes de tu propiedad, escucha esto antes de que llegue septiembre.\n\nMira: la venta de repositorio es el 12 de agosto. La venta del Sheriff es el 27 de agosto. Y en septiembre viene la Upset Sale para todo el que deba dos años. Eso no es para asustarte, mi amor. Es para que sepas que ahora mismo tú tienes opciones que en septiembre ya no vas a tener.\n\nY aquí va algo que casi nadie te dice: después de una venta por impuestos, el dueño anterior puede tener dinero a su favor, un sobrante, y el condado lo guarda hasta tres años. Dinero que es tuyo y no lo sabes.\n\nSi estás atrasado, vender antes de la fecha protege tu equity. El martillo del remate no. Llámame, con calma, sin compromiso. Soy Alexa Sanchez, Smart Way America Realty."}, {"label": "YouTube title (ES)", "text": "Remates de Propiedades en el Condado de Monroe PA: Fechas de Agosto 2026 y el Dinero que No Sabes que Tienes"}, {"label": "YouTube description (ES)", "text": "Las fechas de las ventas por impuestos y del Sheriff en el condado de Monroe, y por qué agosto es el mes para actuar si estás atrasado con los taxes.\n\nP: ¿Cuándo son los remates en Monroe County? Repositorio 12 de agosto, Sheriff 27 de agosto, Upset Sale en septiembre.\nP: ¿Qué es un sobrante (overbid)? Dinero que puede quedar a favor del dueño anterior tras una venta por impuestos; el condado lo guarda hasta 3 años.\n\nAlexa Sanchez · REALTOR · Licencia PA #RS326383 · Smart Way America Realty · (570) 688-8147.\n\nTags: bienes raices poconos, condado de monroe, remates pa, venta de impuestos, sheriff sale monroe, realtor en espanol poconos, inversiones en poconos"}, {"label": "IG / YouTube caption (ES)", "text": "Agosto tiene fecha límite en Monroe County. Si estás atrasado con los taxes, tienes opciones ahora que en septiembre no vas a tener. Y hay un dinero (el sobrante) que casi nadie te explica.\n\n#BienesRaices #InversionesEnPoconos #MonroeCounty #LifeByAlexa"}, {"label": "Cover text", "text": "RED/WHITE: AGOSTO TIENE FECHA LÍMITE"}], "note": "Under 3 min · one topic · written fresh in Spanish — NOT a translation. Market week = Ledger top signal (auction) told fresh.", "flag": null}, {"id": "wed-tt", "day": "wed", "time": "Record + post", "title": "Talking Head — the lounge is the product", "account": "@its.myash", "platform": "TikTok", "kind": "video", "blocks": [{"label": "Script", "text": "The next great cigar brand won't sell you tobacco. It'll sell you a room. Walk into a real lounge and the cigar is maybe a third of it. The greeting is the product. The recommendation is the product. The pour next to it, the conversation, the story on the band. That's why at Nell's Social I don't stock a humidor and hope. I program a night. One cigar, one Dominican story, one pairing, one reason to come back. Anybody can sell a stick. The room is the moat."}, {"label": "TikTok caption", "text": "The humidor isn't the business. The room is. How we think about Nell's Social 👇\n\n#CigarLife #NellsSocial #OperatorLife #CigarAuthority #LifeByAlexa"}, {"label": "Visual", "text": "Shot at Nell's Social, warm interior light, no overhead fluorescents. Seated, cigar or coffee in hand, one take. Caption seeds Wednesday's @its.myash IG post."}], "note": null, "flag": null}, {"id": "wed-ig", "day": "wed", "time": "Post", "title": "Talking Head — IG post", "account": "@its.myash", "platform": "Instagram", "kind": "post", "blocks": [{"label": "IG caption", "text": "The humidor isn't the business. The room is. At Nell's Social we program the night, not just the shelf.\n\n#CigarLife #NellsSocial #OperatorLife #LifeByAlexa"}], "note": "Same video as TikTok.", "flag": null}, {"id": "wed-fb", "day": "wed", "time": "Post", "title": "FB Business — cigar repurpose", "account": "@its.myash", "platform": "Facebook Business", "kind": "post", "blocks": [{"label": "Post", "text": "Dominican cigars have a reputation for being mild. That reputation is a decade out of date. This week at Nell's Social we're running a two-cigar taste test: a classic Dominican-forward smoke against a modern DR blend with San Andrés and Broadleaf. Same country, two very different experiences. Come find out which one is you. 🇩🇴"}], "note": null, "flag": null}, {"id": "wed-gbp-listing", "day": "wed", "time": "Post", "title": "GBP Listing Feature — 1108 Colt Lane", "account": "@alexa.realtor", "platform": "Google Business Profile", "kind": "gbp", "blocks": [{"label": "Post template (no hashtags, fill specs)", "text": "New Listing — [Town/Township], Monroe County\n\n[Beds]BD / [Baths]BA in [Town], offered at $[Price]. [Feature 1], [Feature 2], [Feature 3]. [STR / second-home / primary-residence angle, e.g. verified township STR status, amenity access, commuter appeal]. Showings by appointment.\n\nAlexa Sanchez · Local Pocono Mountains Realtor · PA License #RS326383 · Smart Way America Realty · (570) 688-8147 · Alexa@alexasanchez.net"}], "note": "GBP rules: town + property type only, no full street address in the public post, no client names.", "flag": "PENDING — need 1108 Colt Lane specs: town/township, price, beds/baths, sqft, lot, 3–4 features, MLS/share link, photo. Do not post until filled."}, {"id": "thu-vet", "day": "thu", "time": "11:00 AM", "title": "Veteran Reel (PA) — DVRETX + HB 1257", "account": "@alexa.realtor", "platform": "Instagram", "kind": "video", "blocks": [{"label": "Script (30–60 sec)", "text": "Pennsylvania veterans: two tax programs, and most people mix them up. First, DVRETX. If the VA rates you 100% permanent and total, your principal residence can be fully exempt from property tax, subject to residency, discharge, and a financial-need test. The presumptive need level is $114,637. Above it, you can still qualify by documenting expenses. Second, HB 1257 would widen that eligibility beyond wartime service. It passed the PA House in March 2026. It is not law yet. Apply through your county Director of Veterans Affairs. Don't leave this on the table."}, {"label": "IG caption", "text": "PA veterans leave real money on the table because DVRETX and HB 1257 get confused. Here's the clean version 👇 Educational only.\nAlexa Sanchez · REALTOR · PA License #RS326383 · Smart Way America Realty · (570) 688-8147.\n\n#VeteranHomebuyer #VALoan #VeteranRealEstate #PARealEstate #LifeByAlexa"}, {"label": "Cover text", "text": "RED/WHITE: PA VETS — DON'T MIX THESE UP\nNEON GREEN: $114,637"}, {"label": "YouTube description", "text": "Title: Pennsylvania Disabled Veteran Property Tax Exemption (DVRETX) + HB 1257 Explained — 2026\n\nHow Pennsylvania's Disabled Veterans' Real Estate Tax Exemption works, the $114,637 presumptive-need level, and where HB 1257 stands.\nQ: Who qualifies for DVRETX? PA veterans with a VA 100% permanent-and-total service-connected rating, meeting residency, discharge, and financial-need standards.\nQ: Is HB 1257 law? No. It passed the PA House March 2026 and is advancing; treat current DVRETX rules as controlling.\nQ: How do I apply? Through your county Director of Veterans Affairs.\n\nEducational only; not VA-endorsed; rates and eligibility not guaranteed. Alexa Sanchez, REALTOR, PA License #RS326383, Smart Way America Realty. (570) 688-8147.\n\nTags: pa disabled veteran property tax, dvretx, va loan pennsylvania, hb 1257, veteran homebuyer pa, monroe county veterans, pocono va loan, veteran real estate"}], "note": "Educational only — no personal narrative, no VA endorsement, no rate guarantee.", "flag": null}, {"id": "thu-yt", "day": "thu", "time": "11:00 AM", "title": "Veteran Upload (PA) — YouTube", "account": "@alexa.realtor", "platform": "YouTube", "kind": "video", "blocks": [{"label": "Script (adapted, longer)", "text": "Same three beats as the Reel, expanded ~30 sec to add: VA up-to-100% financing for eligible owner-occupants, residual-income underwriting, the 2026 VA loan limit of $832,750 in most counties, and the reminder that a VA loan can finance a PA home but cannot buy property in the Dominican Republic. Close on 'educational only — I connect you to the right lender and your county veteran affairs office.'"}, {"label": "YouTube title", "text": "PA Veterans: The Disabled Veteran Property Tax Exemption (DVRETX) + What HB 1257 Would Change"}, {"label": "YouTube description", "text": "Pennsylvania's DVRETX can exempt a disabled veteran's primary residence from property tax. Who qualifies today, how HB 1257 would expand it, and how the VA benefit stacks in PA.\n\n0:00 The break most vets don't claim · 0:15 DVRETX today · 0:35 HB 1257 explained · 0:55 Where it stands · 1:10 VA financing in PA · 1:40 Apply through the county\n\nAlexa Sanchez · REALTOR · PA License #RS326383 · Smart Way America Realty · (570) 688-8147. Educational only; not affiliated with or endorsed by the VA. Rates not guaranteed.\n\nTags: pa veteran property tax exemption, DVRETX, HB 1257 pennsylvania, VA loan pennsylvania, veteran home buyer, disabled veteran benefits pa, monroe county veterans"}], "note": null, "flag": null}, {"id": "thu-gbp-en", "day": "thu", "time": "9:00 AM", "title": "GBP Veteran Post — English", "account": "@alexa.realtor", "platform": "Google Business Profile", "kind": "gbp", "blocks": [{"label": "Post (no hashtags)", "text": "Pennsylvania veterans: the Disabled Veterans' Real Estate Tax Exemption can fully exempt your principal residence from property tax with a VA 100% permanent-and-total rating, subject to residency, discharge, and financial need. The presumptive-need level is $114,637; above it, you may still qualify by documenting expenses. Apply through your county Director of Veterans Affairs. Questions about VA-financed homes in Monroe County? Reach out.\n\nAlexa Sanchez · PA License #RS326383 · Smart Way America Realty · (570) 688-8147 · Alexa@alexasanchez.net"}], "note": null, "flag": null}, {"id": "thu-gbp-es", "day": "thu", "time": "9:00 AM", "title": "GBP Veteran Post — Spanish", "account": "@alexa.realtor", "platform": "Google Business Profile", "kind": "gbp", "blocks": [{"label": "Post (no hashtags)", "text": "Veteranos de Pensilvania: la exención de impuestos a la propiedad para veteranos discapacitados puede eximir su residencia principal si el VA lo califica con 100% de discapacidad permanente y total, sujeto a residencia, baja honorable y necesidad económica. El nivel de referencia es $114,637; por encima, aún puede calificar documentando gastos. Solicite a través del Director de Asuntos de Veteranos de su condado.\n\nAlexa Sanchez · Licencia PA #RS326383 · Smart Way America Realty · (570) 688-8147 · Alexa@alexasanchez.net"}], "note": null, "flag": null}, {"id": "thu-li", "day": "thu", "time": "8:00 AM", "title": "LinkedIn Operator Post — own the room", "account": "@alexa.realtor", "platform": "LinkedIn", "kind": "post", "blocks": [{"label": "Post", "text": "Most people build a business around a product. The stronger move is building it around a room.\n\nAt my cigar lounge, the humidor is maybe a third of the value. The greeting, the recommendation, the pairing, the reason someone drives back on a Thursday: that is the actual business. Product is copyable. A programmed experience and the operator behind it are not.\n\nSame principle carries across everything I run, from the lounge to the network build at KSM TV. Own the room, not just the shelf.\n\n#OperatorLife #DominicanEntrepreneur #LifeByAlexa"}], "note": "Operator voice lives here while alexasanchez.com is paused.", "flag": null}, {"id": "thu-nd", "day": "thu", "time": "Repost", "title": "Nextdoor — Landmark repost", "account": "@alexa.realtor", "platform": "Nextdoor", "kind": "post", "blocks": [{"label": "Post", "text": "If you haven't driven up to Big Pocono State Park in Tannersville lately, early August is the time. The summit road off Camelback opens sunrise to sunset, and the view across three states near golden hour is hard to beat. Bring water, the top is exposed. — Alexa Sanchez"}], "note": "No selling language. Same landmark as Friday's Spotlight.", "flag": null}, {"id": "thu-fb", "day": "thu", "time": "Repost", "title": "FB Business — veteran repurpose", "account": "@alexa.realtor", "platform": "Facebook Business", "kind": "post", "blocks": [{"label": "Post", "text": "Pennsylvania veterans: two property-tax programs get mixed up constantly. DVRETX can fully exempt your primary residence with a VA 100% permanent-and-total rating (subject to residency, discharge, and financial need; presumptive level $114,637). HB 1257 would widen eligibility beyond wartime service — it passed the PA House in March 2026 but isn't law yet. Apply through your county Director of Veterans Affairs. Educational only. Questions? (570) 688-8147."}], "note": null, "flag": null}, {"id": "thu-cigar", "day": "thu", "time": "Post", "title": "Cigar/Lounge Video — taste Dominican origin", "account": "@its.myash", "platform": "IG + TikTok", "kind": "video", "blocks": [{"label": "Script", "text": "Can you actually taste Dominican origin? Let's test it. Here's a Dominican-forward cigar. Here's a blend made in the DR with San Andrés and Broadleaf mixed in. Same country, two completely different conversations on your palate. The first one is classic, cedar and cream. The second one is pepper and depth. Dominican doesn't mean mild anymore. The country produced over 196 million handmade cigars last year for a reason. Come taste the difference at Nell's Social."}, {"label": "Caption (IG + TikTok)", "text": "'Dominican cigars are mild.' Not anymore. A 2-cigar test at Nell's Social 👇\n\n#DominicanCigars #CigarAuthority #NellsSocial #PremiumCigars #LifeByAlexa"}, {"label": "Visual", "text": "Two-cigar B-roll over voiceover, warm lamp light. IG + TikTok only — does NOT go to YouTube."}], "note": "IG + TikTok only — does NOT go to YouTube.", "flag": null}, {"id": "fri-landmark", "day": "fri", "time": "Post", "title": "Landmark Spotlight — Big Pocono State Park", "account": "@alexa.realtor", "platform": "Instagram", "kind": "post", "blocks": [{"label": "Photo direction", "text": "Big Pocono State Park summit, Camelback Mountain, Tannersville. Frame the sweeping mountain-and-valley view (three-state vista), shot near golden hour for warm early-August greenery. Wide landscape orientation, horizon low-third, no resort branding in frame. Real photo only — never watercolor."}, {"label": "IG caption", "text": "Big Pocono State Park, Tannersville. 1,306 acres on the summit and slopes of Camelback Mountain, open sunrise to sunset, with views across three states from the top. This is the Pocono lifestyle in one frame: an elevated outdoor reset ten minutes from resort amenities and everyday convenience, which is exactly what second-home buyers are really buying up here. Access via Camelback Road, Tannersville, PA 18372.\n\n#PoconoMountains #MonroeCounty #PoconoLiving #BigPoconoStatePark #LifeByAlexa"}], "note": "Cross-posts: GBP Saturday + Nextdoor Thursday — same photo, no reshoot.", "flag": null}, {"id": "fri-yt-landmark", "day": "fri", "time": "Post", "title": "Landmark — YouTube post/Short", "account": "@alexa.realtor", "platform": "YouTube", "kind": "post", "blocks": [{"label": "Community post copy", "text": "Big Pocono State Park — Camelback Mountain summit, Tannersville. 1,306 acres, open sunrise to sunset, with views across three states from the top. This is the everyday-access lifestyle that draws buyers relocating from New York and New Jersey. — Alexa Sanchez, PA License #RS326383, Smart Way America Realty, (570) 688-8147"}, {"label": "If uploaded as a Short — title", "text": "Big Pocono State Park, Tannersville PA — Three-State Views on Camelback Mountain #shorts"}, {"label": "If uploaded as a Short — description", "text": "Big Pocono State Park sits on Camelback Mountain in Tannersville, Monroe County, PA — 1,306 acres, open sunrise to sunset, tri-state views from the summit.\n\n0:00 The view · 0:10 Why it matters for living here\n\nAlexa Sanchez · PA License #RS326383 · Smart Way America Realty · (570) 688-8147\n\nTags: big pocono state park, camelback mountain, tannersville pa, pocono mountains, things to do poconos, pocono real estate, monroe county pa"}], "note": null, "flag": null}, {"id": "fri-dren-reel", "day": "fri", "time": "Post", "title": "DR English — IG Reel (CONFOTUR)", "account": "@alexa.realtor", "platform": "Instagram", "kind": "video", "blocks": [{"label": "Script (under 60 sec)", "text": "A Punta Cana developer says 'CONFOTUR' and you assume you just saved 3% at closing. Stop. CONFOTUR is not a condo feature. It's a project approval. Before you wire a deposit, get four documents. One: the project's CONFOTUR resolution. Two: proof your exact unit is inside the approved scope. Three: the completion date, because the 15-year clock starts there. Four: the exemption language written into your Contrato de Venta. A brochure is not an exemption. On a $400,000 buy, the ordinary 3% transfer tax is $12,000. Verify before you save it."}, {"label": "Caption", "text": "Americans buying in Punta Cana or Cap Cana: 'CONFOTUR' on a brochure does not mean you skip the 3% transfer tax. It's a project-level approval you verify with four documents before wiring a deposit. Save this before you shop.\n\n#DominicanRepublicRealEstate #PuntaCana #CapCana #DRInvestment #InternationalRealEstate #LifeByAlexa"}, {"label": "Cover text", "text": "RED/WHITE: 'CONFOTUR' ISN'T A FEATURE. IT'S A DOCUMENT."}], "note": "Franchise: no written parent, no other derivatives. Feeds YouTube and stops. CTA-FREE this cycle (DR brokerage gated).", "flag": "Figures move — confirm the current 3% transfer-tax and IPI numbers before recording. Keep it to the mechanic, not a live rate promise."}, {"id": "fri-dren-yt", "day": "fri", "time": "Post", "title": "DR English — YouTube (longer cut)", "account": "@alexa.realtor", "platform": "YouTube", "kind": "video", "blocks": [{"label": "Script (longer, deeper mechanics)", "text": "HOOK: If you're an American buying new construction in the Dominican Republic, this one word decides whether you save thousands or lose them: CONFOTUR. And most buyers get it wrong.\n\nWHAT IT IS: CONFOTUR comes from Law 158-01, passed October 9, 2001, to develop tourism zones. For a qualifying new-construction project, it can exempt you from the 3% real-estate transfer tax and from annual IPI property tax for up to 15 years from completion of construction. The developer has up to three years to begin sustained operations. Notice the language: qualifying project. Not qualifying area. Not qualifying buyer.\n\nTHE NUMBERS: Without CONFOTUR, on a $400,000 purchase the transfer-tax baseline under Law 288-04 as amended by Law 173-07 is 3%, roughly $12,000, assessed on the higher of your declared price or the DGII value, and the transfer must complete within six months to avoid surcharges. Separately, annual IPI runs 1% on value above RD$10,695,494 for individuals, paid in two installments due March 11 and September 11.\n\nTHE FOUR-DOCUMENT CHECKLIST: Before you wire a deposit — one, the project's actual CONFOTUR resolution. Two, written proof your specific unit and building are within the approved scope. Three, the construction-completion date that starts the 15-year clock. Four, the exemption promise written into your Contrato de Venta, plus your attorney's plan for the DGII and Registro de Títulos filings.\n\nTHE LESSON: CONFOTUR can create genuine value. But only a verifiable, project-level approval plus correct transaction paperwork turns a headline benefit into an actual closing-cost saving. A sales agent's word is not documentation."}, {"label": "YouTube title", "text": "CONFOTUR Explained for American Buyers: Verify a Dominican Republic Tax Exemption Before You Wire (2026)"}, {"label": "YouTube description", "text": "Buying in Punta Cana or Cap Cana as an American? 'CONFOTUR eligible' on a brochure is not the same as a legal exemption. This walks a $400,000 purchase through the transfer tax, IPI, and the four documents to verify first.\n\nQ: Does CONFOTUR remove the 3% transfer tax? Only for a properly approved project where your specific unit is in scope, documented and filed correctly.\nQ: How long does CONFOTUR last? Up to 15 years from completion of construction for qualifying new-construction projects.\nQ: What is IPI? Dominican annual property tax, 1% on individual value above RD$10,695,494, due March 11 and September 11.\n\n0:00 The word that costs Americans thousands\n0:35 What CONFOTUR actually is\n1:20 The transfer tax + IPI numbers\n2:20 The four-document verification checklist\n3:10 Marketing claim vs. legal exemption\n\nEducational only; not legal or tax advice. Work with a Dominican real-estate attorney. Alexa Sanchez — Dominican Republic real estate. Alexa@alexasanchez.net\n\nTags: confotur, dominican republic real estate, punta cana property, cap cana condos, buying property dominican republic, dr transfer tax, ipi dominican republic, american buying in dr, caribbean real estate, confotur explained"}], "note": null, "flag": null}, {"id": "fri-li", "day": "fri", "time": "8:00 AM", "title": "LinkedIn Veteran Post", "account": "@alexa.realtor", "platform": "LinkedIn", "kind": "post", "blocks": [{"label": "Post", "text": "'Can I use my VA loan to buy a place in the Dominican Republic?'\n\nI get this from veteran clients often, and the answer matters: no. A VA-guaranteed purchase loan can finance an eligible primary residence in Pennsylvania, but it cannot buy property outside the United States. A DR purchase means local, cash, or private financing and a Dominican real-estate attorney for title and contract diligence.\n\nWhat a VA loan does do well in Pennsylvania: up to 100% financing for eligible owner-occupants, with 2026 VA loan limits at $832,750 in most counties. Get two lender estimates on identical terms before you judge your rate.\n\nEducational only, not VA-endorsed, rates not guaranteed. Alexa Sanchez · REALTOR · PA License #RS326383 · Smart Way America Realty · (570) 688-8147.\n\n#VeteranHomebuyer #VALoan #VeteranRealEstate #PARealEstate"}], "note": "Core point phrased as a real veteran-buyer question, per Output 11 rule.", "flag": null}, {"id": "fri-smoke", "day": "fri", "time": "6:00 PM", "title": "Weekend Smoke Reel", "account": "@its.myash", "platform": "Instagram", "kind": "video", "blocks": [{"label": "Script (~30 sec)", "text": "Weekend plan, handled. Nell's Social, Bartonsville. Saturday's the dance party, Friday's spades, Thursday's movie night, and there's always a good pour and a better crowd. You don't need a reason to light one up. But if you want one: it's the weekend. Pull up."}, {"label": "Caption", "text": "Your weekend has a home. Nell's Social, Bartonsville, PA. Named nights, good smoke, better company.\n\n#NellsSocial #CigarLife #WeekendVibes #LifeByAlexa"}, {"label": "Cover text", "text": "NEON GREEN: WEEKEND SMOKE (chunky, tilted)"}], "note": null, "flag": null}, {"id": "fri-fb", "day": "fri", "time": "7:00 PM", "title": "Personal FB — Spanish" ccount": "Website", "platform": "Local Life & Global Vibes", "kind": "gallery", "blocks": [{"label": "Watercolor prompt", "text": "soft realistic Watercolor illustration of a Latina woman with medium skin tone, voluminous curly dark brown hair, gold watch, gold jewelry. Warm earthy tones — cream, tan, soft brown, muted greens. Soft natural lighting. Soft smooth watercolor washes, clean paper texture, fluid brushstrokes, delicate linework, luminous and airy. Editorial lifestyle illustration style. no text, no logos. Scene this week: standing at a mountain overlook at golden hour, light jacket, coffee in hand, valley and ridgelines behind her, calm and grounded."}, {"label": "Headline (overlay)", "text": "THE RESET YOU CAN OWN"}, {"label": "Body — English", "text": "The Pocono Mountains sell one thing better than anywhere within two hours of New York: the reset. Big Pocono State Park, three-state views, sunrise-to-sunset trails, and resort amenities ten minutes from a quiet street. It's the reason relocation buyers from NY and NJ keep landing in Monroe County. Not the biggest house. The best morning. If you're thinking about a move up here, start with the lay of the land, then the listings."}, {"label": "Body — Spanish", "text": "Las Montañas Pocono venden algo único: la calma, con vistas de tres estados y amenidades a diez minutos. Si piensas mudarte a Monroe County, empieza por conocer la zona."}, {"label": "CTA", "text": "'Living in the Pocono Mountains & Lehigh Valley: The Complete 2026 Guide' → the Pillar. LINKED this week (Pillar publishes) — swap placeholder to the live URL."}, {"label": "Alt text", "text": "Watercolor illustration of a Latina woman with curly dark brown hair and gold jewelry standing at a Pocono Mountains overlook at golden hour, coffee in hand."}, {"label": "Tracker line", "text": "2026-08-15 | Lifestyle | 'The Reset You Can Own' | Big Pocono overlook scene | CTA: LINKED (Pillar live) | watercolor"}], "note": "CTA resolves to the Pillar, whic baths, sqft, lot, 3–4 features, MLS/share link, photo. Template ready to fill."}, {"id": "mo-dr-spanish", "day": "monthly", "time": "Record + post", "title": "DR Spanish Video — buy a life, not a view", "account": "@alexa.realtor", "platform": "IG + YouTube", "kind": "video", "blocks": [{"label": "Guión (cadencia dominicana · <3 min · un tema)", "text": "Óyeme bien: no compres solo una vista. Compra una vida que funcione.\n\nMucha gente me dice 'quiero algo en la playa en República Dominicana.' Bien. Pero la pregunta correcta no es dónde está la arena. Es para qué la quieres. Porque cada zona resuelve una vida distinta.\n\n¿Quieres patrimonio, algo que se quede en la familia? Cap Cana. ¿Quieres que la propiedad te genere renta con turistas? Punta Cana y Bávaro, que en julio movieron el 58% de las llegadas por avión. ¿Estabilidad, ciudad, hospitales, negocios? Piantini, en Santo Domingo. ¿Estilo de vida, caminar a la playa, tranquilo? Las Terrenas. ¿Libertad, deportes de agua, comunidad? Cabarete.\n\nUna propiedad buena en RD no es la que tiene la mejor foto. Es la que llega sin problemas: aeropuerto cerca, seguridad, planta eléctrica, agua, buen internet. Eso es lo que hace que un huésped vuelva y que tu inversión trabaje.\n\nPiensa primero en la vida. La vista viene después. Soy Alexa Sanchez."}, {"label": "YouTube title (ES)", "text": "Comprar en República Dominicana: Qué Zona Elegir Según tu Vida (Cap Cana, Punta Cana, Piantini, Las Terrenas, Cabarete) 2026"}, {"label": "YouTube description (ES)", "text": "Cómo elegir zona en RD según tu meta: patrimonio, renta, estabilidad, estilo de vida o libertad.\nP: ¿Cuál zona da más renta? Punta Cana/Bávaro, motor turístico (58% de llegadas aéreas en julio).\nP: ¿Cuál para patrimonio de lujo? Cap Cana.\nEducativo. Trabaja con un abogado inmobiliario dominicano. Alexa Sanchez — bienes raíces en República Dominicana.\n\nTags: bienes raices republica dominicana, comprar en punta cana, cap cana, invertir en rd, propiedades dominicana, las terrenas, cabarete, santo domingo piantini"}, {"label": "IG caption (ES)", "text": "No compres solo una vista. Compra una vida que funcione. Cada zona de RD resuelve una meta distinta 👇\n\n#BienesRaices #RepublicaDominicana #PuntaCana #InversionRD #LifeByAlexa"}, {"label": "Cover text", "text": "RED/WHITE: NO COMPRES UNA VISTA. COMPRA UNA VIDA."}], "note": "Monthly lane (first-week). Latino-audience use-case angle from 03M — distinct from DR English's CONFOTUR/foreign-buyer angle. CTA-free.", "flag": null}, {"id": "mo-dr-veteran", "day": "monthly", "time": "Record + post", "title": "DR Veteran Reel — Law 171-07 + FMP", "account": "@alexa.realtor", "platform": "IG + YouTube", "kind": "video", "blocks": [{"label": "Script", "text": "Veterans thinking about the Dominican Republic: two things nobody explains clearly. One, residency. Law 171-07 gives foreign retirees a path with a recurring pension of at least $1,500 a month, plus $250 per dependent. It is not automatic, and it is not the same as an investor visa. Two, your VA health coverage. The Foreign Medical Program covers care abroad only for your service-connected conditions. It is not general overseas insurance. So before you relocate, plan private coverage and cash reserves for everything else, and pick a home near quality private hospitals. Do this right and the DR works. Do it on assumptions and it doesn't."}, {"label": "YouTube description", "text": "Title: Veterans Moving to the Dominican Republic: Law 171-07 Residency + VA Foreign Medical Program (2026)\n\nWhat the Foreign Medical Program actually covers abroad, and how Law 171-07 residency works for retirees.\nQ: Does the VA Foreign Medical Program cover all care in the DR? No — only VA-rated service-connected conditions.\nQ: What does Law 171-07 require? A recurring foreign pension of at least $1,500/month, plus $250 per dependent, among other requirements.\n\nEducational only; not VA-endorsed. Alexa Sanchez, REALTOR, PA License #RS326383, Smart Way America Realty — Dominican Republic real estate. (570) 688-8147.\n\nTags: veterans dominican republic, va foreign medical program, fmp, law 171-07, retire in dominican republic, veteran expat, dr residency, veteran real estate"}, {"label": "IG caption", "text": "Veterans eyeing the DR: your VA Foreign Medical Program only covers service-connected care abroad. Plan the rest. Plus how Law 171-07 residency works 👇 Educational only.\n\n#VeteranRealEstate #DominicanRepublicRealEstate #VABenefits #DRInvestment #LifeByAlexa"}, {"label": "Cover text", "text": "RED/WHITE: VETS + THE DR — WHAT NOBODY EXPLAINS"}], "note": "Monthly lane. Law 171-07 + FMP ONLY — no CONFOTUR (isolated to DR English). CTA-free. License/contact block included.", "flag": "FMP covers service-connected conditions only — do not imply general overseas coverage. Confirm any residency figures before recording."}, {"id": "mo-queue", "day": "monthly", "time": "First Thursday", "title": "Monthly Content Queue — Weeks 2–4 (Output 15)", "account": "@alexa.realtor", "platform": "Planning", "kind": "post", "blocks": [{"label": "01B — PA / regulatory", "text": "Wk2 — PIR (Pocono data): 'Your Pocono STR may already be illegal.' HB 2303 statewide framework vs. township rules. Hook = fear statement.\nWk3 — LinkedIn Market Signal: PHFA K-DAT (up to 8% assistance) quietly expanding the starter-home buyer pool — inventory pressure for STR investors.\nWk4 — GBP Local Insight: HB 1257 veteran-exemption status update; what changes if the amendment advances."}, {"label": "03M — DR", "text": "Wk2 — DR English Reel + YT: 'Net yield vs. the developer's gross ROI slide.' Underwrite occupancy, HOA, reserves, management — not the brochure number.\nWk3 — DR English: 'Reliable luxury beats generic luxury.' Airport transfer, backup power, water, Wi-Fi as the real premium (Punta Cana 80% occupancy).\nWk4 — DR English: 'Amber Highway re-rates the North Coast.' Santiago–Puerto Plata travel time and Sosúa/Cabarete access."}, {" const DAYS = [{"id": "sun", "label": "Sun", "full": "Sunday", "date": "August 9"}, {"id": "mon", "label": "Mon", "full": "Monday", "date": "August 10"}, {"id": "tue", "label": "Tue", "full": "Tuesday", "date": "August 11"}, {"id": "wed", "label": "Wed", "full": "Wednesday", "date": "August 12"}, {"id": "thu", "label": "Thu", "full": "Thursday", "date": "August 13"}, {"id": "fri", "label": "Fri", "full": "Friday", "date": "August 14"}, {"id": "sat", "label": "Sat", "full": "Saturday", "date": "August 15"}, {"id": "gallery", "label": "Gallery", "full": "Website Gallery Cards", "date": "Any time this week"}, {"id": "monthly", "label": "Monthly", "full": "Monthly Adds — First Week", "date": "DR Spanish + DR Veteran + Queue"}];

const state = {};           // itemId -> bool
let sb = null;
let persist = false;

const $ = s => document.querySelector(s);
const key = id => DATA.weekHash + ":" + id;
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- SYNC ---------- */
function setSync(cls, text){
  const el = $("#sync");
  el.className = "sync " + cls;
  $("#syncText").textContent = text;
}

async function initSync(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY){
    setSync("warn", "Not synced — add Supabase keys to save across devices");
    return;
  }
  try{
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const {data, error} = await sb.from("ops_checks")
      .select("key,done").like("key", DATA.weekHash + ":%");
    if(error) throw error;
    (data || []).forEach(r => { state[r.key.split(":").slice(1).join(":")] = !!r.done; });
    persist = true;
    setSync("ok", "Synced · " + DATA.weekHash);
    render();
  }catch(err){
    console.error(err);
    setSync("warn", "Sync failed — checks won't save. Check keys and RLS policy.");
  }
}

async function save(id, done){
  if(!persist) return;
  try{
    const {error} = await sb.from("ops_checks")
      .upsert({key:key(id), done, updated_at:new Date().toISOString()}, {onConflict:"key"});
    if(error) throw error;
    setSync("ok", "Saved " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}));
  }catch(err){
    console.error(err);
    setSync("warn", "Didn't save — check connection");
  }
}

/* ---------- RENDER ---------- */
let activeDay = DAYS[new Date().getDay()] ? DAYS[new Date().getDay()].id : "sun";
if(!DAYS.some(d => d.id === activeDay)) activeDay = "sun";

function itemsFor(day){ return DATA.items.filter(i => i.day === day); }
function doneCount(day){ return itemsFor(day).filter(i => state[i.id]).length; }

function renderTabs(){
  $("#tabs").innerHTML = DAYS.map(d => {
    const list = itemsFor(d.id), done = doneCount(d.id);
    const all = list.length > 0 && done === list.length;
    return `<button class="tab${all ? " all-done" : ""}" role="tab" data-day="${d.id}"
      aria-selected="${d.id === activeDay}">${d.label}
      <span class="count">${done}/${list.length}</span></button>`;
  }).join("");
}

function renderProgress(){
  const total = DATA.items.length;
  const done = DATA.items.filter(i => state[i.id]).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  $("#progressFill").style.width = pct + "%";
  $("#progressText").textContent = done + " of " + total + " posted";
  $("#progressPct").textContent = pct + "%";
}

function cardHTML(it){
  const done = state[it.id] ? "1" : "0";
  const blocks = it.blocks.map((b, i) => `
    <div class="block">
      <div class="block-head">
        <span class="block-label">${esc(b.label)}</span>
        <button class="copy-btn" data-copy="${it.id}|${i}">Copy</button>
      </div>
      <pre id="blk-${it.id}-${i}">${esc(b.text)}</pre>
    </div>`).join("");
  return `
  <article class="card" data-id="${it.id}" data-done="${done}" data-open="0"
           data-flagged="${it.flag ? 1 : 0}">
    <div class="card-top">
      <button class="check" data-check="${it.id}" aria-pressed="${done === "1"}"
        aria-label="Mark ${esc(it.title)} posted">
        <svg viewBox="0 0 24 24"><polyline points="4 12.5 9.5 18 20 6.5"/></svg>
      </button>
      <div class="card-main">
        <div class="card-time">${esc(it.time)}</div>
        <h3 class="card-title">${esc(it.title)}</h3>
        <div class="chips">
          <span class="chip acct">${esc(it.account)}</span>
          <span class="chip${it.kind === "gbp" ? " kind-gbp" : ""}">${esc(it.platform)}</span>
        </div>
      </div>
    </div>
    ${it.flag ? `<div class="flag">${esc(it.flag)}</div>` : ""}
    ${it.note ? `<div class="note">${esc(it.note)}</div>` : ""}
    <button class="toggle-blocks" data-toggle="${it.id}">
      <span>${it.blocks.length} copy block${it.blocks.length > 1 ? "s" : ""}</span>
      <span class="arrow">▼</span>
    </button>
    <div class="blocks">${blocks}</div>
  </article>`;
}

function renderDay(){
  const d = DAYS.find(x => x.id === activeDay);
  const list = itemsFor(activeDay);
  $("#main").innerHTML = `
    <div class="day-head">
      <h2>${esc(d.full)}</h2><span class="date">${esc(d.date)}</span>
    </div>
    ${list.length ? list.map(cardHTML).join("")
      : `<p class="empty">Nothing scheduled. Enjoy it.</p>`}`;
}

function render(){ renderTabs(); renderDay(); renderProgress(); }

/* ---------- EVENTS ---------- */
document.addEventListener("click", async e => {
  const tab = e.target.closest("[data-day]");
  if(tab){ activeDay = tab.dataset.day; render(); window.scrollTo({top:0}); return; }

  const chk = e.target.closest("[data-check]");
  if(chk){
    const id = chk.dataset.check;
    state[id] = !state[id];
    const card = chk.closest(".card");
    card.dataset.done = state[id] ? "1" : "0";
    chk.setAttribute("aria-pressed", state[id]);
    renderTabs(); renderProgress();
    save(id, state[id]);
    return;
  }

  const tog = e.target.closest("[data-toggle]");
  if(tog){
    const card = tog.closest(".card");
    card.dataset.open = card.dataset.open === "1" ? "0" : "1";
    return;
  }

  const cp = e.target.closest("[data-copy]");
  if(cp){
    const [id, i] = cp.dataset.copy.split("|");
    const text = document.getElementById("blk-" + id + "-" + i).textContent;
    try{
      await navigator.clipboard.writeText(text);
    }catch(_){
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
    }
    cp.textContent = "Copied"; cp.classList.add("copied");
    setTimeout(() => { cp.textContent = "Copy"; cp.classList.remove("copied"); }, 1400);
  }
});

$("#resetBtn").addEventListener("click", async () => {
  if(!confirm("Clear every check for " + DATA.week + "? This can't be undone.")) return;
  const ids = DATA.items.map(i => i.id);
  ids.forEach(id => state[id] = false);
  render();
  if(persist){
    try{
      await sb.from("ops_checks").delete().like("key", DATA.weekHash + ":%");
      setSync("ok", "Week cleared");
    }catch(err){ console.error(err); setSync("warn", "Reset didn't save"); }
  }
});

/* ---------- BOOT ---------- */
$("#weekLabel").textContent = DATA.week;
render();
initSync();
</script>
</body>
</html>

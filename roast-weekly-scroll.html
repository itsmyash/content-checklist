<style>
:root{
  --ink:#12130F;
  --paper:#F7F6F1;
  --card:#FFFFFF;
  --line:#DDDCD4;
  --muted:#6E6E64;
  --brass:#B98436;       /* accent — gold/warm earth, from the lounge + watercolor palette */
  --brass-deep:#8A5F1F;
  --alarm:#B03A2E;       /* flags */
  --radius:4px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Archivo',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.5;

  padding-bottom:80px;
}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brass-deep);outline-offset:2px}

/* ---------- HEADER ---------- */
header{background:var(--ink);color:var(--paper);padding:18px 16px 14px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--brass);margin:0 0 6px}
h1{font-family:'Archivo Black',sans-serif;font-size:26px;line-height:.98;
  letter-spacing:-.02em;margin:0;text-transform:uppercase}
h1 span{display:block;color:var(--brass)}
.meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#9C9C90;margin-top:8px}

/* progress spine */
.progress-wrap{margin-top:14px}
.progress-track{height:6px;background:#2A2C24;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--brass);transition:width .35s ease}
.progress-label{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;color:#9C9C90;margin-top:6px;letter-spacing:.06em}
.progress-label b{color:var(--brass);font-weight:500}

/* ---------- DAY TABS ---------- */
nav{position:sticky;top:0;z-index:20;background:var(--ink);
  border-bottom:1px solid #2A2C24;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:0;padding:0 8px;min-width:max-content}
.tab{background:none;border:0;padding:11px 12px 10px;color:#8A8A7E;

  border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--brass)}
.tab .count{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;
  background:#2A2C24;color:#9C9C90;padding:1px 5px;border-radius:99px}
.tab[aria-selected="true"] .count{background:var(--brass);color:#FFF}
.tab.all-done .count{background:var(--brass-deep);color:#FFF}

/* ---------- DAY BODY ---------- */
main{padding:16px 12px 0;max-width:760px;margin:0 auto}
.day-head{display:flex;align-items:baseline;gap:10px;margin:4px 2px 14px}
.day-head h2{font-family:'Archivo Black',sans-serif;font-size:19px;margin:0;
  text-transform:uppercase;letter-spacing:-.01em}
.day-head .date{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}

/* ---------- CARD ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:10px;overflow:hidden;position:relative}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.card[data-done="1"]{opacity:.5}
.card[data-done="1"]::before{background:var(--brass-deep)}
.card[data-flagged="1"]::before{background:var(--alarm)}

.card-top{display:flex;gap:11px;padding:12px 13px 12px 15px;align-items:flex-start}
.check{flex:0 0 auto;width:26px;height:26px;border:2px solid var(--ink);border-radius:var(--radius);

  transition:background .12s ease}
.check svg{width:15px;height:15px;stroke:var(--ink);stroke-width:3.2;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .12s ease}
.card[data-done="1"] .check{background:var(--brass);border-color:var(--brass-deep)}
.card[data-done="1"] .check svg{opacity:1;stroke:#FFF}
.card[data-done="1"] .card-title{text-decoration:line-through;text-decoration-thickness:2px}

.card-main{flex:1;min-width:0}
.card-time{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;
  color:var(--muted);text-transform:uppercase}
.card-title{font-size:15.5px;font-weight:700;line-height:1.25;margin:2px 0 5px;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:5px}

.chip.acct{border-color:var(--ink);color:var(--ink);font-weight:500}
.chip.kind-gbp{background:var(--brass);border-color:var(--brass);color:#FFF;font-weight:500}

.note,.flag{font-size:12.5px;line-height:1.4;padding:7px 13px 7px 15px;border-top:1px dashed var(--line)}
.note{color:var(--muted)}
.flag{background:#FDEDEB;color:#8E1C13;font-weight:600}
.flag::before{content:"⚑ ";}

/* ---------- BLOCKS ---------- */
.toggle-blocks{width:100%;background:#F2F1EB;border:0;border-top:1px solid var(--line);
  padding:9px 13px;text-align:left;font-size:12px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.toggle-blocks .arrow{transition:transform .2s ease;font-size:10px}
.card[data-open="1"] .toggle-blocks .arrow{transform:rotate(180deg)}
.blocks{display:none;padding:0 13px 13px 15px}
.card[data-open="1"] .blocks{display:block}
.block{margin-top:11px}
.block-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.block-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
.copy-btn{background:var(--ink);color:var(--paper);border:0;border-radius:var(--radius);
  padding:4px 10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  flex:0 0 auto}
.copy-btn.copied{background:var(--brass);color:#FFF}
pre{margin:0;background:#FAFAF6;border:1px solid var(--line);border-left:2px solid var(--ink);
  border-radius:var(--radius);padding:10px 11px;font-family:'IBM Plex Mono',monospace;
  font-size:12px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;
  max-height:260px;overflow-y:auto}

/* ---------- FOOTER / STATUS ---------- */
.sync{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#9C9C90;
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;
  padding:9px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:30}
.sync .dot{display:inline-block;width:7px;height:7px;border-radius:99px;background:var(--muted);
  margin-right:6px;vertical-align:middle}
.sync.ok .dot{background:var(--brass)}
.sync.warn{color:#F4C542}
.sync.warn .dot{background:#F4C542}
.sync button{background:none;border:1px solid #3A3C33;color:#9C9C90;border-radius:var(--radius);
  padding:4px 9px;font-family:inherit;font-size:10px;letter-spacing:.06em;text-transform:uppercase}

.empty{text-align:center;color:var(--muted);padding:38px 20px;font-size:13.5px}

@media (min-width:700px){
  h1{font-size:34px}
  body{font-size:15.5px}
  .card-title{font-size:16.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const DATA = {"week": "Aug 16–22, 2026", "weekHash": "2026-08-16", "items": [{"id": "sun-ledger", "day": "sun", "time": "Written first", "title": "The Pocono Ledger (blog)", "account": "@alexa.realtor", "platform": "alexa.realtor blog", "kind": "article", "blocks": [{"label": "SEO title", "text": "Monroe County Real Estate Market Update — Balanced Not Soft (Week of Aug 17, 2026) | Pocono Ledger"}, {"label": "Meta description", "text": "Monroe County's June median sold price hit $335,000, up 13.29% YoY, with ~1,949 active listings and homes closing near 98% of list. What buyers and sellers should actually do this week."}, {"label": "Slug + internal link", "text": "Slug: /blog/pocono-ledger-monroe-county-market-update-aug-17-2026\n\nLink UP to the Pillar: 'New to the area? Start with our complete 2026 guide to living in the Pocono Mountains & Lehigh Valley.' (placeholder until Pillar confirmed live)"}, {"label": "Article (full)", "text": "THE POCONO LEDGER — BALANCED, NOT SOFT: MONROE COUNTY, WEEK OF AUGUST 17, 2026\n\nNew to the Pocono Mountains? Start with our complete 2026 guide to living here. (Pillar link — pending publication)\n\nEXECUTIVE SUMMARY\nMonroe County is balanced — not soft. Inventory has improved, but price and pace held resilient through the latest complete data. June's countywide median sold price was $335,000, up 13.29% year over year, while the median listing price reached $375,000. Rates eased modestly this week: the 30-year fixed conventional average slipped to 6.632%, and the VA average to 6.098%. The practical translation: buyers have more choice and real negotiating room on stale or mispriced listings, but correctly priced, well-presented homes are still moving in about seven weeks at roughly full ask. This is not a market that rewards waiting, and it is not a market that rewards test-pricing.\n\nTHE WEEK'S NUMBERS\nRate snapshot. 30-year fixed conventional: 6.632%, down 6 basis points week over week from 6.688%. 30-year VA: 6.098%, down 5 basis points from 6.146% — roughly 53 bps below conventional. The Fed held its target range at 3.50%–3.75% on July 29, citing inflation still above 2%; three voting members preferred a hike. Next FOMC meeting: September 15–16. Rates don't move one-for-one with the Fed — watch bond-market volatility, don't wait automatically for a cut.\n\nPayment impact (P&I only, 30-yr fixed at 6.632%): $250K ≈ $1,599/mo (−$9 vs last week); $400K ≈ $2,558/mo (−$15); $600K ≈ $3,837/mo (−$22).\n\nMonroe County pulse (June): 1,949 active listings (+~4% YoY); 51 median days on market (12% faster YoY); median sold $335,000 (+13.29% YoY); median list $375,000 (+5.69% YoY); average sale-to-list ~98%.\n\nWHAT CHANGED THIS WEEK\nTwo things moved, one didn't. Rates eased — conventional down 6 bps, VA down 5 bps — improving affordability slightly without changing the high-6% environment. Locally, the latest complete county data still show more listings and quicker market times, not a seller-market surge and not a collapse. On policy: NAR highlighted the proposed 21st Century ROAD to Housing Act (framed around local supply reform) and reported an appeals-court win in the Homie antitrust matter. Both are industry-level developments, not changes to any single Monroe County transaction.\n\nNEIGHBORHOOD / TOWNSHIP SPOTLIGHT\nThe county median hides the real story: submarkets are behaving differently. June median LISTING prices ranged from ~$299,000 in Tobyhanna to ~$499,900 in Pocono Pines, with East Stroudsburg near $399,450 and Stroudsburg around $488,250. Pace diverged too: Stroudsburg's 31-day market time outpaced Effort's 44 days. A Tobyhanna comp doesn't set a Pocono Pines number, and a Stroudsburg timeline doesn't predict an Effort one. Anyone pricing to \"the Poconos\" as one market is pricing to a number that doesn't exist.\n\nOPERATOR OBSERVATION\nThere's no countywide weekly price-reduction count worth quoting, so ignore anyone waving one around. The defensible signal is more choice PLUS a 98% sale-to-list outcome. Reductions are hitting listings that missed on price, condition, or community/STR restrictions — not homes that entered near value and showed well. That's a positioning problem, not a demand problem. Buyers reading \"balanced\" as \"desperate\" will keep losing the turnkey houses to buyers who read it correctly.\n\nWHAT BUYERS SHOULD DO\n- Get fully underwritten or strongly preapproved now. A 5–6 bp weekly move is useful, but competition for well-priced homes is real.\n- Compare lenders, including a VA-specialist lender if eligible — the VA average runs ~53 bps under conventional.\n- Negotiate selectively: inspect, evaluate taxes and HOA, lean on days-on-market and comps over broad \"Poconos\" headlines.\n- For vacation-home or STR purchases, verify township rules and HOA/association restrictions BEFORE removing contingencies.\n\nWHAT SELLERS SHOULD DO\n- Price to your immediate neighborhood and competing active inventory, not the county median.\n- Do the condition work before launch — photos, access, repairs, a clean inspection narrative. It matters more with ~2,000 alternatives on the market.\n- Avoid test-pricing. A ~98% sale-to-list ratio and 51-day median favor homes that enter near market value.\n- If timing is flexible, use a hyperlocal CMA. Stroudsburg, Tobyhanna, East Stroudsburg, and Pocono Pines aren't moving in lockstep.\n\nSOURCES\nMonroe County figures: Forever Homes & Land (June). Rates & Fed: Fortune / Federal Reserve. Policy: NAR. STR/regulation: local township & association rules. Alexa Sanchez, Licensed PA Realtor #RS326383, Smart Way America Realty. Educational only; rates not guaranteed."}], "note": "Source of truth. Everything market-side derives from this — no re-reporting. This week = 'balanced, not soft'. Pillar NOT part of this week's cycle (staged pending EDGE/blog confirmation).", "flag": null}, {"id": "sun-hub", "day": "sun", "time": "Record + upload", "title": "Hub Video EN — the spoken Ledger", "account": "@alexa.realtor", "platform": "YouTube", "kind": "video", "blocks": [{"label": "Script", "text": "HOOK (0:00–0:08)\nMonroe County is balanced. It is not soft. And if you're waiting for soft, you're going to watch the good houses close without you.\n\nOPEN (0:08–0:20)\nI'm Alexa Sanchez, licensed Realtor with Smart Way America Realty. This is the Pocono Ledger for the week of August 17th. Three numbers, then what you do about them.\n\nSECTION 1 — THE NUMBERS (0:20–0:55)\nJune median sold price: three thirty-five. Up over thirteen percent year over year. Almost nineteen hundred fifty active listings — up about four percent. Fifty-one days on market, twelve percent faster than last year. Homes closing near ninety-eight cents on the dollar. More choice. Not a fire sale.\n\nSECTION 2 — RATES (0:55–1:30)\nThirty-year conventional eased to six point six three. VA average, six point one. The Fed held at three and a half to three seventy-five on July twenty-ninth. Next meeting, September fifteenth. Rates don't move one-for-one with the Fed. Watch the bond market, not the headline.\n\nSECTION 3 — THE REAL READ (1:30–2:05)\nThe county median is a lie of averages. Tobyhanna near two ninety-nine. Pocono Pines near five hundred. Stroudsburg moving in thirty-one days, Effort in forty-four. Price to your street, not to \"the Poconos.\" Test-pricing loses in a ninety-eight-percent market.\n\nCTA (2:05–2:20)\nFull breakdown is in this week's Ledger on alexa.realtor. Buying, selling, or just watching — call me: 570-688-8147. Alexa Sanchez, Smart Way America Realty."}, {"label": "YouTube title", "text": "Monroe County PA Real Estate Update: Balanced Market, Aug 2026 (Prices, Rates & What Buyers Should Do)"}, {"label": "YouTube description", "text": "Is the Monroe County housing market slowing down in 2026? Not the way people think. In this week's Pocono Ledger, licensed Realtor Alexa Sanchez breaks down the latest Monroe County numbers and what they mean for Pocono Mountains buyers and sellers.\n\nWhat you'll learn: Why Monroe County is \"balanced, not soft.\" The June median sold price ($335,000, +13.29% YoY) and what ~1,949 active listings and a 51-day median actually signal. Current 30-year conventional (6.632%) and VA (6.098%) averages and the September 15–16 Fed meeting. Why submarkets like Tobyhanna, East Stroudsburg, Stroudsburg, and Pocono Pines are moving at different speeds. What buyers and sellers should do right now.\n\n0:00 Balanced not soft\n0:20 The county numbers\n0:55 Rates & the Fed\n1:30 Submarket read\n2:05 What to do\n\nQuestions about a specific Pocono Mountains town or property? Call (570) 688-8147 or email Alexa@alexasanchez.net. Alexa Sanchez, PA License #RS326383, Smart Way America Realty."}, {"label": "Tags", "text": "monroe county real estate, pocono mountains homes, poconos housing market 2026, pocono real estate agent, str investing poconos, mortgage rates 2026, va loan pennsylvania, stroudsburg homes, east stroudsburg real estate, tobyhanna, pocono pines, alexa sanchez realtor, buying a home poconos, selling a home monroe county"}, {"label": "Caption + hashtags", "text": "Balanced ≠ soft. More choice, faster sales, and homes still closing near 98% of ask. The full Monroe County read is live in this week's Ledger. 📈\n\n#PoconoRealEstate #PoconoMountains #MonroeCounty #STRInvesting #LifeByAlexa"}, {"label": "Thumbnail direction", "text": "Cartoon headshot, left third. Right two-thirds dark. Chunky slightly tilted text.\nRED/WHITE: BALANCED, NOT SOFT\nNEON GREEN tag, corner: +13.29% YoY\nNo stock house photo. No graph."}], "note": null, "flag": null}, {"id": "sun-pir", "day": "sun", "time": "Record + upload", "title": "PIR Ep. 02 — PA Upset Tax Sale (Pocono data)", "account": "@alexa.realtor", "platform": "YouTube playlist + IG lane", "kind": "video", "blocks": [{"label": "Reusable card template (reuse Ep.01 spine)", "text": "Card 1 — Title: episode title + 'The Property Intelligence Report' lockup\nCard 2 — The Fear (hook): a STATEMENT of the fear (no question)\nCard 3 — The Fact: the verifiable rule, cited\nCard 4 — The Mechanic: how it works, plainly\nCard 5 — What To Do: the concrete step\nCard 6 — CTA: PA episode = Smart Way America block. Points at the Pillar."}, {"label": "Episode 02 script (voice over cards)", "text": "Card 2 (fear): You could buy a house at a Monroe County tax sale next month and still not own it free and clear. Most bidders don't find that out until it's too late.\n\nCard 3 (fact): Monroe County's Tax Claim Bureau has an upset sale reportedly scheduled for September 14. An upset sale is the first-tier tax sale — and the one people misread the most. Always confirm the date and property list directly with the Bureau; unofficial dates are often stale.\n\nCard 4 (mechanic): At an upset sale, the property generally transfers SUBJECT TO existing liens — often including the mortgage. You're not always wiping the slate clean. You may be buying someone else's debt attached to the deed. And dates move: a scheduled sale can be postponed, a property pulled through reinstatement, or a bankruptcy filing can trigger a stay.\n\nCard 5 (what to do): Before you ever raise a hand — confirm the sale and property list with the Monroe County Tax Claim Bureau directly, not a third-party site. Understand exactly which liens survive. And know the difference between an upset sale and a later judicial sale, because they don't carry the same risk.\n\nCard 6 (CTA — PA / Smart Way America): Thinking about a distressed or tax-sale property in the Pocono Mountains? I can help you understand what you'd actually be buying. Alexa Sanchez, Smart Way America Realty, (570) 688-8147. Full relocation guide → the Pillar."}, {"label": "YouTube description", "text": "Title: Pennsylvania Upset Tax Sale Explained: What You Really Buy at a Monroe County Tax Sale (2026) | Property Intelligence Report Ep. 02\n\nThinking about bidding at a Monroe County, PA tax sale? Before you do, understand what an \"upset sale\" actually transfers. This Property Intelligence Report breaks down how Pennsylvania upset tax sales work, why properties often transfer subject to existing liens (sometimes including the mortgage), how sale dates get postponed or stayed, and the steps to protect yourself before you bid.\n\nQ: What is a PA upset tax sale? The first-tier tax sale; property generally transfers subject to existing liens.\nQ: Do liens survive an upset sale? Often yes — including the mortgage. Confirm before bidding.\nQ: How do I verify the sale date? Contact the Monroe County Tax Claim Bureau directly; unofficial dates are often stale.\n\n0:00 The risk stated\n0:20 What the upset sale is\n0:45 Which debts survive\n1:15 Why dates move\n1:45 How to protect yourself\n\nEducational only — not legal advice. Always verify with the Monroe County Tax Claim Bureau and qualified counsel. Alexa Sanchez, REALTOR, PA License #RS326383, Smart Way America Realty. (570) 688-8147.\n\nTags: pennsylvania tax sale, upset sale explained, monroe county tax claim bureau, buying tax sale property pa, tax lien vs tax deed, distressed property poconos, real estate investing pennsylvania, pocono real estate, property intelligence report, alexa sanchez"}, {"label": "IG lane caption", "text": "You can win a house at a Pennsylvania tax sale and still inherit the debt attached to it. Here's what an \"upset sale\" actually transfers — and how to protect yourself before you bid. Property Intelligence Report, Ep. 02.\n\n#PoconoRealEstate #STRInvesting #MonroeCounty #PropertyIntelligence #LifeByAlexa"}], "note": "PIR WEEKLY CHECK = YES. Segment: Pocono data / consumer-protection. Source: 02A research layer, NOT the Ledger. Ep. 02 → PA Smart Way America CTA (Ep. 01 overbids ran last week CTA-free). Reuses the Ep.01 card template. NOT counted in the 16.", "flag": "Confirm the Sept 14 upset-sale date against the Monroe County Tax Claim Bureau's OFFICIAL notice before publishing — treat the date as reported, not verified."}, {"id": "mon-li", "day": "mon", "time": "8:00 AM", "title": "LinkedIn Market Signal", "account": "@alexa.realtor", "platform": "LinkedIn", "kind": "post", "blocks": [{"label": "Post", "text": "\"Balanced\" is the most misread word in this market.\n\nMonroe County's June median sold price came in at $335,000 — up 13.29% year over year — with inventory near 1,949 and homes closing at roughly 98% of list. That is not a soft market. That is a market where buyers finally have choice and sellers no longer get to test-price.\n\nThe mistake I'm watching in real time: buyers reading \"more inventory\" as \"name your number,\" and sellers reading \"still appreciating\" as \"list high and wait.\" Both lose. Price reductions this week are landing on listings that missed on price, condition, or STR restrictions — not on homes that entered near value.\n\nBalanced rewards precision. It punishes assumptions.\n\nFull breakdown in this week's Pocono Ledger.\n\n#PoconoRealEstate #MonroeCounty #STRInvesting #PARealEstate"}], "note": "Derived from the Ledger — operator read, not a new market piece.", "flag": null}, {"id": "mon-gbp1", "day": "mon", "time": "9:00 AM", "title": "GBP Market Update", "account": "@alexa.realtor", "platform": "Google Business Profile", "kind": "gbp", "blocks": [{"label": "Post (no hashtags)", "text": "Monroe County Market Update — Week of August 17, 2026\n\nMonroe County is a balanced market right now, not a slow one. June's countywide median sold price was $335,000, up 13.29% year over year, with about 1,949 active listings and a 51-day median time on market — roughly 12% faster than a year ago. Homes are closing near 98% of list price, so buyers have more choice while well-priced homes still move quickly.\n\nThinking about buying or selling a single-family home, townhome, or short-term-rental property in the Pocono Mountains? I can run a hyperlocal analysis for your specific town — Stroudsburg, East Stroudsburg, Tobyhanna, Pocono Pines, and surrounding communities are all pricing differently.\n\nAlexa Sanchez · Local Pocono Mountains Realtor · PA License #RS326383 · Smart Way America Realty · (570) 688-8147 · Alexa@alexasanchez.net"}], "note": "No hashtags. No addresses. No client names. Highest AEO weight.", "flag": null}, {"id": "mon-fb", "day": "mon", "time": "10:00 AM", "title": "Personal FB — English", "account": "Personal", "platform": "Facebook", "kind": "post", "blocks": [{"label": "Post", "text": "Real talk on the Pocono market this week: people keep asking me if now is the time to wait for a crash. Here's the honest answer — the numbers don't support waiting. Homes in Monroe County are still selling near full asking price, just with more options on the table and a little more room to negotiate on the ones that have been sitting. If a house is priced right and shows well, it's still gone fast. If you've been on the fence, let's at least run your actual numbers so you're deciding on facts, not headlines. (570) 688-8147. — Alexa"}], "note": null, "flag": null}, {"id": "mon-gbp2", "day": "mon", "time": "11:00 AM", "title": "GBP Local Insight — tax-sale rules", "account": "@alexa.realtor", "platform": "Google Business Profile", "kind": "gbp", "blocks": [{"label": "Post (no hashtags)", "text": "Buying at a Monroe County Tax Sale? Know the Rules First\n\nMonroe County's Tax Claim Bureau has an upset sale reportedly scheduled for September 14. Upset sales can look like a bargain, but the property usually transfers subject to existing mortgages and many liens — and sale dates can be postponed, reinstated, or stayed. Always confirm timing and the official property list directly with the county Tax Claim Bureau before you rely on any date.\n\nIf you're considering a distressed or tax-sale purchase in the Pocono Mountains, I can help you understand what you'd actually be buying before you bid on a single-family home or land parcel.\n\nAlexa Sanchez · REALTOR · PA License #RS326383 · Smart Way America Realty · (570) 688-8147 · Alexa@alexasanchez.net"}], "note": "Second GBP angle, distinct from the Market Update. Pairs with this week's PIR episode topic.", "flag": null}, {"id": "mon-carousel", "day": "mon", "time": "Market rollout", "title": "IG Market Carousel", "account": "@alexa.realtor", "platform": "Instagram", "kind": "post", "blocks": [{"label": "Slides", "text": "Slide 1 (cover): \"BALANCED, NOT SOFT\" — red/white chunky tilted. Subhead: Monroe County, Aug 2026.\nSlide 2: neon-green \"$335,000\" / \"median sold, +13.29% YoY\"\nSlide 3: \"1,949 active · 51 days on market · ~98% of list\" — more choice, not a fire sale\nSlide 4: Rate card — \"Conventional 6.632% · VA 6.098% · Fed holds, next meeting Sept 15\"\nSlide 5: Submarket bar — Tobyhanna ~$299K → Pocono Pines ~$499.9K. \"The county median is an average of very different towns.\"\nSlide 6: \"Buyers: negotiate on stale, not turnkey. Sellers: don't test-price a 98% market.\"\nSlide 7 (CTA): \"Full Ledger → alexa.realtor · (570) 688-8147 · Alexa Sanchez, Smart Way America Realty\" "}, {"label": "Caption", "text": "Everybody wants to know if the Poconos are \"crashing.\" Here's the actual data. Balanced market: more inventory, faster sales, homes still closing near full ask. Swipe for the numbers, then read the full Ledger on alexa.realtor. 📊\n\n#PoconoRealEstate #PoconoMountains #MonroeCounty #STRInvesting #PARealEstate #LifeByAlexa"}], "note": null, "flag": null}, {"id": "tue-cc", "day": "tue", "time": "3:00 PM", "title": "Car Confession EN — stop waiting", "account": "@alexa.realtor", "platform": "IG + YouTube Shorts", "kind": "video", "blocks": [{"label": "Script (20 sec)", "text": "Confession: everybody's sitting around waiting for rates to drop before they buy. Meanwhile the buyers I closed this month didn't wait. They bought the right house at ninety-eight cents on the dollar and they'll refinance later. You can't refinance a house somebody else bought. Stop waiting for a headline. Call me.\n\n[Flat delivery. Hard cut on \"Call me.\"]"}, {"label": "IG caption", "text": "You can't refinance a house someone else already bought. 🔑 The buyers winning in Monroe County right now aren't waiting for a perfect rate — they're buying the right house at the right price. (570) 688-8147.\n\n#PoconoRealEstate #MonroeCounty #PoconoMountains #STRInvesting #LifeByAlexa"}, {"label": "Cover text", "text": "RED/WHITE: STOP WAITING FOR THE CRASH"}, {"label": "YT Shorts description", "text": "Title: Should You Wait for Rates to Drop to Buy in the Poconos? (2026 Reality Check) #shorts\n\nWaiting for mortgage rates to fall before buying in Monroe County? Here's why the buyers closing right now aren't waiting — and why \"marry the house, date the rate\" is playing out in the Pocono Mountains market. Alexa Sanchez, PA License #RS326383, Smart Way America Realty. Call (570) 688-8147.\n\nTags: pocono real estate, monroe county homes, should i wait to buy a house 2026, mortgage rates, refinance strategy, first time home buyer pennsylvania, pocono mountains, alexa sanchez realtor, str investing"}], "note": "Source: 01A rate/timing angle. Distinct from the Misconception piece (lowball myth).", "flag": null}, {"id": "tue-misc", "day": "tue", "time": "Post (flex slot)", "title": "Misconception Reel — lowball myth", "account": "@alexa.realtor", "platform": "IG + YouTube Short", "kind": "video", "blocks": [{"label": "Chosen misconception + truth", "text": "MISCONCEPTION: \"More inventory means buyers can offer whatever they want.\"\nTRUTH: Monroe County is balanced, not a discount market — homes are still closing near 98% of list in ~51 days. Lowball leverage exists on stale/mispriced listings, not on turnkey ones.\nFORMAT: IG Reel over Car Confession — the myth needs one data beat (98% / 51 days) to land cleanly, which a 20-sec confession can't carry. Kept distinct from Tuesday's Car Confession (timing angle)."}, {"label": "Script (30–60 sec)", "text": "Here's a myth costing buyers real houses: \"there's more inventory now, so I can offer whatever I want.\" No. Monroe County has almost nineteen hundred fifty listings — more choice, true. But homes are still closing at about ninety-eight percent of asking, in fifty-one days. So where's your leverage? On the listings that sat too long, priced wrong, or have STR restrictions nobody flagged. That's where you negotiate hard. On the turnkey house priced right? Lowball it and you'll lose it to the buyer who read the market correctly. More options is not the same as more power on every house. Know the difference."}, {"label": "Cover text", "text": "RED/WHITE: LOWBALL AND LOSE IT\nNEON GREEN: 98% of list"}, {"label": "YouTube Short description", "text": "Title: Does More Inventory Mean You Can Lowball in the Poconos? (Monroe County 2026) #shorts\n\nMore homes for sale in Monroe County doesn't mean every seller takes a lowball. With homes closing near 98% of list in about 51 days, here's where buyers actually have leverage — and where a lowball just loses you the house. Alexa Sanchez, PA License #RS326383, Smart Way America Realty. (570) 688-8147.\n\nTags: pocono real estate, monroe county, lowball offer, buyer negotiation, balanced housing market 2026, pocono mountains homes, str investing, alexa sanchez realtor, pennsylvania real estate"}, {"label": "Caption", "text": "\"More inventory means I can lowball anything.\" That's how you lose the house you actually wanted. Here's where your negotiating power really is in a balanced Monroe County market. 🎯 (570) 688-8147.\n\n#PoconoRealEstate #MonroeCounty #PoconoMountains #STRInvesting #LifeByAlexa"}], "note": "Output 12. Source: 01A misconception. Flex slot — placed Tue to balance load; move to Wed/Sat if the Tue slot feels heavy.", "flag": null}, {"id": "tue-nd", "day": "tue", "time": "9:00 AM", "title": "Nextdoor — Neighborly Post", "account": "@alexa.realtor", "platform": "Nextdoor", "kind": "post", "blocks": [{"label": "Post", "text": "Neighbor tip for tax-sale season: if you've ever seen a \"tax sale\" list floating around and wondered how it works — Monroe County's Tax Claim Bureau posts official notices, and the dates and property lists on unofficial sites are often out of date. If you're curious (or worried about your own escrow/tax bill), the Bureau is the source of truth and worth a quick call. Sharing because I get asked about this every fall. — Alexa Sanchez"}], "note": "No selling language. No CTA. Identity via signature only.", "flag": null}, {"id": "wed-aldia", "day": "wed", "time": "Record + post", "title": "Pocono al Día — market (Spanish)", "account": "@alexa.realtor", "platform": "IG + YouTube", "kind": "video", "blocks": [{"label": "Guión (cadencia dominicana · <3 min · un tema)", "text": "Óyeme bien: te tienen creyendo que el mercado de los Poconos se está cayendo. Mentira.\n\nAquí en el condado de Monroe el precio de venta llegó a trescientos treinta y cinco mil en junio. Eso subió más de trece por ciento en un año. No bajó — subió.\n\nLo que cambió es que ahora hay más casas disponibles. Casi mil novecientas cincuenta. Antes tenías tres opciones, ahora tienes diez. Eso es bueno para ti si vas a comprar.\n\nPero óyeme, mi amor: las casas buenas — las que están bien cuidadas y con el precio correcto — se siguen vendiendo rápido. En cincuenta y un días. Y se venden casi al precio completo, como el noventa y ocho por ciento.\n\nEntonces, ¿qué significa esto para ti? Que tú tienes poder para negociar en las casas que llevan tiempo paradas. Pero si encuentras la casa perfecta, no juegues, porque otro la compra.\n\nY una cosa más: no mires el precio de todo el condado. Tobyhanna no es Pocono Pines. Cada pueblo tiene su propio número. Yo te saco el análisis de tu pueblo específico.\n\nSi tú estás pensando en comprar o vender aquí en los Poconos, llámame. Cinco-siete-cero, seis-ocho-ocho, ocho-uno-cuatro-siete. Alexa Sanchez, Smart Way America Realty."}, {"label": "YouTube title (ES)", "text": "Mercado de Bienes Raíces en los Poconos (Condado de Monroe) 2026 — ¿Está Bajando? | Pocono al Día"}, {"label": "YouTube description (ES)", "text": "¿Se está cayendo el mercado de casas en los Poconos? En este episodio de Pocono al Día, la agente de bienes raíces Alexa Sanchez explica en español los números reales del condado de Monroe: precio medio de venta de $335,000 (subió 13.29% en un año), casi 1,949 casas disponibles, y por qué las casas bien cuidadas se siguen vendiendo cerca del 98% del precio de lista.\n\nP: ¿Está bajando el mercado en Monroe County? No — está equilibrado. Más casas para escoger, pero las buenas se venden rápido.\nP: ¿Cuánto subió el precio? El precio medio de venta subió 13.29% en un año, a $335,000.\n\nPreguntas sobre tu pueblo específico? Llama al (570) 688-8147. Alexa Sanchez, Licencia PA #RS326383, Smart Way America Realty.\n\nTags: bienes raices poconos, condado de monroe, comprar casa en pennsylvania, mercado inmobiliario 2026, casas en los poconos, agente hispana bienes raices, stroudsburg, inversiones airbnb poconos, alexa sanchez, vender casa monroe county"}, {"label": "IG / YouTube caption (ES)", "text": "El mercado de los Poconos no se está cayendo, mi amor — se está equilibrando. Más casas para escoger, pero las buenas se siguen vendiendo rápido. Te explico qué hacer. 📲 (570) 688-8147.\n\n#BienesRaices #InversionesEnPoconos #MonroeCounty #LifeByAlexa"}, {"label": "Cover text", "text": "RED/WHITE: NO SE ESTÁ CAYENDO  //  NEON GREEN: +13.29%"}], "note": "Under 3 min · one topic · written fresh in Spanish — NOT a translation. Market week = Ledger top signal (balanced, not soft) told fresh.", "flag": null}, {"id": "wed-tt", "day": "wed", "time": "Record + post", "title": "Talking Head — what makes a cigar Dominican", "account": "@its.myash", "platform": "TikTok", "kind": "video", "blocks": [{"label": "Script", "text": "People think \"Dominican cigar\" means Dominican tobacco. Wrong. There are three different things and most people can't tell them apart.\n\nOne: Dominican-grown leaf — the tobacco actually came out of Dominican soil. Two: Dominican blending — the recipe, the balance, the decision-making happens there. Three: Dominican factory production — the hands that rolled it are in the DR.\n\nTake the new Nestor Miranda Private Reserve Lancero. Dominican Corojo wrapper. But the filler? Dominican, Nicaraguan, and Brazilian. And it's built at La Aurora in the Dominican Republic. So is it \"Dominican\"? Yes — because the factory identity and the blending authority are the hero, not one single leaf.\n\nOrigin isn't one ingredient. It's the hand that brings the ingredients together. Remember that next time somebody tries to sell you \"100% Dominican\" like it's the only thing that matters."}, {"label": "TikTok caption", "text": "\"Dominican cigar\" doesn't mean what you think it means. Three things, and the wrapper is only one of them. 🇩🇴\n\n#CigarLife #DominicanCigars #CigarAuthority #LifeByAlexa"}, {"label": "Visual", "text": "Shot at Nell's Social, warm interior light. Seated, cigar or coffee in hand, one take. Caption seeds Wednesday's @its.myash IG post."}], "note": null, "flag": null}, {"id": "wed-ig", "day": "wed", "time": "Post", "title": "Talking Head — IG post", "account": "@its.myash", "platform": "Instagram", "kind": "post", "blocks": [{"label": "IG caption", "text": "There are three ways a cigar earns the word \"Dominican,\" and the wrapper is only one of them. Grown leaf vs. blending vs. factory — here's how to actually tell them apart (and why \"100% Dominican\" isn't the flex people think it is). 🇩🇴 What's in your rotation right now?\n\n#CigarLife #DominicanCigars #CigarAuthority #PremiumCigars #LifeByAlexa"}], "note": "Same video as TikTok.", "flag": null}, {"id": "wed-fb", "day": "wed", "time": "Post", "title": "FB Business — cigar repurpose", "account": "@its.myash", "platform": "Facebook Business", "kind": "post", "blocks": [{"label": "Post", "text": "Quick education for the cigar crowd: \"Dominican\" isn't one thing. It can mean the leaf was grown here, the blend was built here, or the cigar was rolled here — and the best Dominican houses win on blending and factory craft, not just soil. The new Nestor Miranda Private Reserve Lancero is a perfect example: Dominican Corojo wrapper, multinational filler, made at La Aurora. Come talk cigars with us at Nell's Social in Bartonsville."}], "note": null, "flag": null}, {"id": "wed-gbp-listing", "day": "wed", "time": "Post", "title": "GBP Listing Feature — 1108 Colt Lane", "account": "@alexa.realtor", "platform": "Google Business Profile", "kind": "gbp", "blocks": [{"label": "Post template (no hashtags, fill specs)", "text": "New Listing — [Town/Township], Monroe County\n\n[Beds]BD / [Baths]BA in [Town], offered at $[Price]. [Feature 1], [Feature 2], [Feature 3]. [STR / second-home / primary-residence angle, e.g. verified township STR status, amenity access, commuter appeal]. Showings by appointment.\n\nAlexa Sanchez · Local Pocono Mountains Realtor · PA License #RS326383 · Smart Way America Realty · (570) 688-8147 · Alexa@alexasanchez.net"}], "note": "GBP rules: town + property type only, no full street address in the public post, no client names. (Packet marked the Listing lane SKIP this week — carried forward as PENDING so it stays on radar.)", "flag": "PENDING — 1108 Colt Lane still needs town/township, price, beds/baths, sqft, lot, 3–4 features, MLS/share link, photo. Do not post until filled. Skip the Wednesday Listing slot if no specs."}, {"id": "thu-vet", "day": "thu", "time": "11:00 AM", "title": "Veteran Reel (PA) — VA + K-FIT stacking", "account": "@alexa.realtor", "platform": "Instagram", "kind": "video", "blocks": [{"label": "Script (30–60 sec)", "text": "Veterans in Pennsylvania: your VA loan can already get you in with zero down. But most people don't know you may be able to stack state help on top of it.\n\nPHFA's K-FIT program can provide up to five percent of the purchase price or appraised value — whichever is lower — as a zero-percent second mortgage. It's forgiven ten percent a year over ten years if you keep meeting the terms.\n\nThat's down payment or closing-cost help layered on a loan that already asks for zero down. Whether the two can stack on your file is a lender-and-PHFA eligibility question — not automatic — so get it confirmed in writing before you write an offer.\n\nThis is education, not a rate quote and not a VA endorsement. Want to know if your file qualifies? Call me."}, {"label": "IG caption", "text": "PA veterans: your VA loan gets you 0% down — and PHFA K-FIT may stack up to 5% more in forgivable help on top. Educational only, not a rate quote. Here's how it works. 🇺🇸\nAlexa Sanchez · REALTOR · PA License #RS326383 · Smart Way America Realty · (570) 688-8147.\n\n#VeteranHomebuyer #VALoan #VeteranRealEstate #PARealEstate #LifeByAlexa"}, {"label": "Cover text", "text": "RED/WHITE: 0% DOWN + 5% HELP?\nNEON GREEN: PHFA K-FIT"}, {"label": "YouTube description", "text": "Title: Can PA Veterans Stack PHFA K-FIT Help on a VA Loan? (2026 Down Payment & Closing Cost Guide)\n\nCan a Pennsylvania veteran combine PHFA down-payment assistance with a VA loan? This educational breakdown explains how PHFA's K-FIT (Keystone Forgivable in Ten Years) works — up to 5% of the lesser of purchase price or appraised value, structured as a 0% second mortgage forgiven at 10% per year over ten years — and how it may layer with a VA first mortgage that already offers 0% down. Stacking depends on lender and PHFA eligibility and must be confirmed in writing.\n\nQ: Can you use PHFA assistance with a VA loan? Sometimes — K-FIT may layer with a VA first mortgage, subject to lender/PHFA eligibility, confirmed in writing.\nQ: How much is K-FIT? Up to 5% of the lesser of purchase price or appraised value.\nQ: How is K-FIT forgiven? 10% per year over ten years, subject to program terms.\n\nEducational only. Not a rate quote, not a guarantee of eligibility, not a VA or PHFA endorsement.\n\n0:00 VA loan 0% down · 0:15 What K-FIT is · 0:35 How forgiveness works · 0:50 Why stacking isn't automatic\n\nCall (570) 688-8147. Alexa Sanchez, PA License #RS326383, Smart Way America Realty.\n\nTags: va loan pennsylvania, phfa k-fit, veteran home buyer pa, down payment assistance 2026, pocono real estate veteran, monroe county va loan, forgivable second mortgage, first time home buyer veteran, alexa sanchez realtor"}], "note": "Educational only — no personal narrative, no VA endorsement, no rate guarantee. License/contact in caption.", "flag": null}, {"id": "thu-yt", "day": "thu", "time": "11:00 AM", "title": "Veteran Upload (PA) — YouTube", "account": "@alexa.realtor", "platform": "YouTube", "kind": "video", "blocks": [{"label": "Script (adapted, longer)", "text": "Same three beats as the Reel, expanded ~30 sec to add the HOMEstead comparison — up to $10,000 as a 0% second mortgage, forgiven 20% per year over 5 years, location- and allocation-dependent — plus the step to get a written loan estimate and program-layer approval before contract. Same educational framing and disclaimers. Close on \"educational only — I connect you to the right VA-experienced lender.\" "}, {"label": "YouTube title", "text": "PA Veterans: Stacking PHFA Down-Payment Help (K-FIT & HOMEstead) on a VA Loan — 2026"}, {"label": "YouTube description", "text": "How eligible Pennsylvania veterans may layer PHFA down-payment and closing-cost assistance on top of a 0%-down VA loan. Covers K-FIT (up to 5%, forgiven 10%/yr over 10 yrs) and HOMEstead (up to $10,000, forgiven 20%/yr over 5 yrs), and why stacking is a lender/PHFA eligibility question confirmed in writing.\n\n0:00 VA 0% down · 0:15 K-FIT · 0:40 HOMEstead · 1:05 Why stacking isn't automatic · 1:30 Get it in writing before contract\n\nEducational only; not affiliated with or endorsed by the VA or PHFA. Rates and eligibility not guaranteed. Alexa Sanchez · REALTOR · PA License #RS326383 · Smart Way America Realty · (570) 688-8147.\n\nTags: va loan pennsylvania, phfa k-fit, phfa homestead, veteran home buyer pa, down payment assistance, forgivable second mortgage, monroe county veterans, pocono va loan, veteran real estate"}], "note": null, "flag": null}, {"id": "thu-gbp-en", "day": "thu", "time": "9:00 AM", "title": "GBP Veteran Post — English", "account": "@alexa.realtor", "platform": "Google Business Profile", "kind": "gbp", "blocks": [{"label": "Post (no hashtags)", "text": "Veterans: You May Be Able to Stack Down-Payment Help on a VA Loan\n\nA VA loan can offer eligible Pennsylvania veterans 0% down. PHFA's K-FIT program may add up to 5% of the lesser of purchase price or appraised value as a 0% second mortgage, forgiven 10% per year over ten years. Whether the two can layer on your file depends on lender and PHFA eligibility and must be confirmed in writing. This is educational information only, not a rate quote or a VA/PHFA endorsement.\n\nAlexa Sanchez · REALTOR · PA License #RS326383 · Smart Way America Realty · (570) 688-8147 · Alexa@alexasanchez.net"}], "note": null, "flag": null}, {"id": "thu-gbp-es", "day": "thu", "time": "9:00 AM", "title": "GBP Veteran Post — Spanish", "account": "@alexa.realtor", "platform": "Google Business Profile", "kind": "gbp", "blocks": [{"label": "Post (no hashtags)", "text": "Veteranos: Podrían Combinar Ayuda para el Pago Inicial con un Préstamo VA\n\nEl préstamo VA puede ofrecer 0% de pago inicial a veteranos elegibles en Pensilvania. El programa K-FIT de PHFA puede añadir hasta 5% del precio o del avalúo (el menor) como segunda hipoteca al 0%, perdonada 10% cada año durante diez años. Si los dos se pueden combinar depende de la elegibilidad del prestamista y de PHFA, y debe confirmarse por escrito. Esto es información educativa, no una cotización de tasa ni un respaldo de VA/PHFA.\n\nAlexa Sanchez · REALTOR · Licencia PA #RS326383 · Smart Way America Realty · (570) 688-8147 · Alexa@alexasanchez.net"}], "note": null, "flag": null}, {"id": "thu-li", "day": "thu", "time": "8:00 AM", "title": "LinkedIn Operator Post — earned access", "account": "@alexa.realtor", "platform": "LinkedIn", "kind": "post", "blocks": [{"label": "Post", "text": "Running a real estate practice, a cigar lounge, and a television network at the same time teaches you one thing fast: systems beat effort.\n\nThis week I'm thinking about \"earned access\" — a concept I keep seeing in the premium-cigar world, where the win isn't just the product, it's the limited release, the private event, the reason to show up. A 500-box run means nothing on its own. Attach it to a specific occasion, a maker, a room full of the right people, and it becomes something people plan their month around.\n\nThat's not a cigar lesson. That's an operator lesson. Scarcity without a story is just being out of stock. Scarcity with a story is a brand.\n\nI build every one of my businesses on that idea — the lounge, the network, even how I run listings. Give people a reason to show up that they can't get anywhere else.\n\n#OperatorLife #DominicanEntrepreneur #LifeByAlexa"}], "note": "Operator voice lives here while alexasanchez.com is paused.", "flag": null}, {"id": "thu-nd", "day": "thu", "time": "Repost", "title": "Nextdoor — Landmark repost", "account": "@alexa.realtor", "platform": "Nextdoor", "kind": "post", "blocks": [{"label": "Post", "text": "If you've got out-of-town family visiting before the summer ends, put Big Pocono State Park on the list. The summit of Camelback gives you a clear three-state view — Pennsylvania, New Jersey, and New York — and mid-August evening light is about as good as it gets up there before the fall crowds arrive. Open sunrise to sunset in season. One of the best free views in the county. — Alexa Sanchez"}], "note": "No selling language. Same landmark as Friday's Spotlight.", "flag": null}, {"id": "thu-fb", "day": "thu", "time": "Repost", "title": "FB Business — misconception repurpose", "account": "@alexa.realtor", "platform": "Facebook Business", "kind": "post", "blocks": [{"label": "Post", "text": "Myth of the week: \"more inventory means I can offer whatever I want.\" Not in Monroe County. We have more homes to choose from, yes — but the good ones are still closing near 98% of asking in about 51 days. Your leverage is on the listings that sat too long or priced wrong, not on the turnkey house priced right. Know the difference before you write an offer. (570) 688-8147 · Alexa Sanchez, Smart Way America Realty."}], "note": null, "flag": null}, {"id": "thu-cigar", "day": "thu", "time": "Post", "title": "Cigar/Lounge Video — The Dominican Table", "account": "@its.myash", "platform": "IG + TikTok", "kind": "video", "blocks": [{"label": "Script", "text": "Most cigar lounges sell you a chair and an ashtray. That's it.\n\nAt Nell's Social I'm building something different. We're calling it The Dominican Table. One cigar. One pour. One origin story. One lesson about the family or the factory or the craft behind what's in your hand.\n\nBecause a cigar isn't just something you smoke — it's something you understand. And when you understand it, you taste more.\n\nBartonsville. Twenty-five Route six-eleven. Come sit at the table. This isn't smoke-and-scroll. This is smoke-and-learn."}, {"label": "Caption (IG + TikTok)", "text": "New at Nell's Social: The Dominican Table. One cigar, one pour, one origin story, one lesson. Because you taste more when you actually understand what's in your hand. 🇩🇴 Bartonsville, 25 Route 611.\n\n#CigarLife #NellsSocial #DominicanCigars #CigarAuthority #LifeByAlexa"}, {"label": "Visual", "text": "Two-shot lounge B-roll over voiceover, warm lamp light. IG + TikTok only — does NOT go to YouTube."}], "note": "IG + TikTok only — does NOT go to YouTube.", "flag": null}, {"id": "fri-landmark", "day": "fri", "time": "Post", "title": "Landmark Spotlight — Big Pocono State Park", "account": "@alexa.realtor", "platform": "Instagram", "kind": "post", "blocks": [{"label": "Photo direction", "text": "Big Pocono State Park, Camelback Mountain summit, Tannersville. Shoot late-afternoon/golden hour, mid-August. Frame the wide three-state ridgeline panorama with deep-green late-summer ridges filling the lower two-thirds and long evening light. Plain real photo — no overlay text, no designed card (GBP/AEO can't crawl baked-in text). Landscape for GBP/YouTube; vertical crop of the same frame for IG. Real photo only — never watercolor."}, {"label": "IG caption", "text": "Big Pocono State Park sits on the summit and slopes of Camelback Mountain in Tannersville — 1,306 acres with views across Pennsylvania, New Jersey, and New York. This is the Pocono relocation promise in one frame: a quiet mountaintop panorama with trail access minutes from Tannersville's resorts, dining, and I-80. As a local Pocono Mountains Realtor, this is the lifestyle I help people buy into. 🏔️ Access via Camelback Road, Tannersville, PA 18372.\n\n#PoconoMountains #MonroeCounty #PoconoLiving #BigPoconoStatePark #LifeByAlexa"}], "note": "Landmark holds Ride With Me's Friday slot (no camera yet). Cross-posts: GBP Saturday + Nextdoor Thursday — same photo, no reshoot.", "flag": null}, {"id": "fri-yt-landmark", "day": "fri", "time": "Post", "title": "Landmark — YouTube post/Short", "account": "@alexa.realtor", "platform": "YouTube", "kind": "post", "blocks": [{"label": "Community post copy", "text": "Big Pocono State Park — Camelback Mountain summit, Tannersville. 1,306 acres, open sunrise to sunset, with views across three states from the top. This is the everyday-access lifestyle that draws buyers relocating from New York and New Jersey. — Alexa Sanchez, PA License #RS326383, Smart Way America Realty, (570) 688-8147"}, {"label": "If uploaded as a Short — title", "text": "Big Pocono State Park, Tannersville PA — Three-State Views on Camelback Mountain #shorts"}, {"label": "If uploaded as a Short — description", "text": "Big Pocono State Park sits on Camelback Mountain in Tannersville, Monroe County, PA — 1,306 acres, open sunrise to sunset, tri-state views from the summit.\n\n0:00 The view · 0:10 Why it matters for living here\n\nAlexa Sanchez · PA License #RS326383 · Smart Way America Realty · (570) 688-8147\n\nTags: big pocono state park, camelback mountain, tannersville pa, pocono mountains, things to do poconos, pocono real estate, monroe county pa"}], "note": null, "flag": null}, {"id": "fri-dren-reel", "day": "fri", "time": "Post", "title": "DR English — IG Reel (transfer tax / CONFOTUR)", "account": "@alexa.realtor", "platform": "Instagram", "kind": "video", "blocks": [{"label": "Script (under 60 sec)", "text": "Buying a three-hundred-thousand-dollar condo in the Dominican Republic? A viral post is about to cost you nine thousand dollars.\n\nPeople are saying the DR transfer tax got eliminated. It didn't. There's a new law — Law 30-26 — but it phases out a different levy. The standard three percent real-estate transfer tax is still there.\n\nOn a three-fifty purchase, that's over ten thousand dollars you still owe at closing. Before your title transfers.\n\nThe one exception is CONFOTUR — but that only applies if that exact project is certified, and you have to see the paperwork. Not the brochure. The paperwork.\n\nDon't underwrite a deal on a word. Underwrite it on a document."}, {"label": "Caption", "text": "The \"DR transfer tax is gone\" post going around? Wrong — and believing it can cost you $9K+ at closing. Here's what U.S. buyers still owe, and the one document that proves a real CONFOTUR exemption. 🇩🇴\n\n#DominicanRepublicRealEstate #PuntaCana #CapCana #DRInvestment #InternationalRealEstate #LifeByAlexa"}, {"label": "Cover text", "text": "RED/WHITE: THE TAX ISN'T GONE\nNEON GREEN: 3% = $10,500"}], "note": "Franchise: no written parent, no other derivatives. Feeds YouTube and stops.", "flag": "Figures move — confirm the current DR 3% transfer-tax and CONFOTUR mechanics before recording. Keep it to the mechanic, not a live rate promise."}, {"id": "fri-dren-yt", "day": "fri", "time": "Post", "title": "DR English — YouTube (longer cut)", "account": "@alexa.realtor", "platform": "YouTube", "kind": "video", "blocks": [{"label": "Script (longer, deeper mechanics)", "text": "HOOK: There's a post going around telling American buyers the Dominican Republic eliminated its closing tax. If you believe it, you could under-budget your deal by thousands and walk into closing unprepared. Let me show you exactly what's true.\n\nTHE CLAIM: The confusion comes from Law 30-26. It's real. But it phases out a separate 2% unified ad valorem levy — not the ordinary buyer's transfer tax. The 3% real-estate transfer tax that U.S. buyers pay still exists.\n\nTHE NUMBERS: That transfer tax — the Impuesto de Transferencia Inmobiliaria — is 3% of the sale price or the DGII fiscal appraisal, whichever is higher. It's typically a buyer cost, generally due within six months. On a $350,000 purchase with a $350,000 taxable value, that's a $10,500 line item before legal, notary, and registry costs. And here's the part people miss: you don't truly own the property on paper just because you signed a purchase agreement. Under Law 108-05, the ownership transfer has to be registered with the Title Registry — and that doesn't happen until the tax and registry requirements are satisfied.\n\nFILE A — standard purchase: Resale, or a new unit with no exemption. You sign the contract, DGII sets the tax base, you calculate 3%, you pay it, and title transfers under Law 108-05. Straightforward — as long as you budgeted for the 3%.\n\nFILE B — the CONFOTUR claim: A development marketed as \"CONFOTUR included.\" CONFOTUR — Law 158-01, expanded through Law 195-13 — can give a properly classified tourism project a 15-year incentive window that includes the buyer's 3% transfer tax and the annual IPI property tax. But \"can\" is doing a lot of work. You have to verify: the exact project's approval, the certificate or resolution number, the exemption duration, whether your specific unit is inside the approved project, and whether your transaction qualifies. A broker's marketing label is not proof.\n\nTHE SAFEGUARD: Never underwrite your deal using the word CONFOTUR. Underwrite it using the project's written approval, the tax treatment in writing, and your Dominican attorney's title-and-closing review. New, in Punta Cana, or \"touristic\" does not equal exempt.\n\nCLOSE: I help American buyers understand Dominican transactions before they wire a deposit. If you're looking at the DR, get the document, not the brochure. I'm Alexa Sanchez."}, {"label": "YouTube title", "text": "DR Closing Costs 2026: Why the 3% Transfer Tax Still Exists & How to Verify a Real CONFOTUR Exemption"}, {"label": "YouTube description", "text": "Did the Dominican Republic eliminate its real estate transfer tax? No — and a viral claim about Law 30-26 is causing American buyers to under-budget by thousands. In this episode of \"Understanding Dominican Transactions as an American,\" Alexa Sanchez explains what U.S. buyers actually owe at closing and how to verify a genuine CONFOTUR exemption.\n\nQ: Did Law 30-26 remove the DR transfer tax? No — it phases out a separate 2% levy, not the 3% buyer transfer tax.\nQ: How much is the DR transfer tax? 3% of the higher of sale price or DGII appraisal; on $350K that's ~$10,500.\nQ: Does CONFOTUR remove it? Only for a properly approved tourism project where your specific unit is in scope, verified in writing.\n\n0:00 The viral claim · 0:45 What Law 30-26 really did · 1:30 The 3% math on a $350K condo · 2:30 File A: standard purchase · 3:15 File B: verifying CONFOTUR · 4:15 The investor safeguard\n\nEducational information only — not legal or tax advice. Always work with a licensed Dominican attorney for title and closing review. Alexa Sanchez, PA License #RS326383, Smart Way America Realty · (570) 688-8147 · Alexa@alexasanchez.net\n\nTags: dominican republic real estate, dr closing costs 2026, confotur explained, punta cana condo, cap cana real estate, transfer tax dominican republic, law 30-26, buying property in dr as american, dr property taxes, international real estate, ipi dominican republic, alexa sanchez"}], "note": null, "flag": null}, {"id": "fri-li", "day": "fri", "time": "8:00 AM", "title": "LinkedIn Veteran Post — PTRR question", "account": "@alexa.realtor", "platform": "LinkedIn", "kind": "post", "blocks": [{"label": "Post", "text": "\"Can I still claim the Pennsylvania property tax rebate for last year if I'm a disabled veteran?\"\n\nI get versions of this constantly, so here's the educational answer. Pennsylvania's Property Tax/Rent Rebate program for 2025 taxes is open to eligible residents including people age 65+, qualifying widows and widowers 50+, and people with disabilities 18+, with a household income limit of $48,110. The standard maximum rebate is $1,000, and certain lower-income owner-occupants can reach $1,500 with the supplement. The filing deadline for 2025 is December 31, 2026.\n\nSeparately, Pennsylvania's Disabled Veterans' Real Estate Tax Exemption can provide a full real-estate-tax exemption on a primary residence for eligible disabled veterans who meet the disability, service, residency, ownership, and financial-need standards — applied for through the county/DMVA process.\n\nEducational only, not tax advice and not a determination of your eligibility. If you're a veteran homeowner in the Poconos and no one's walked you through these, start with your county.\n\nAlexa Sanchez · PA License #RS326383 · Smart Way America Realty · (570) 688-8147\n\n#VeteranHomebuyer #VeteranRealEstate #PARealEstate #VALoan"}], "note": "Core point phrased as a real veteran-buyer question, per Output 11 rule. Distinct from Thursday's VA + K-FIT angle.", "flag": null}, {"id": "fri-smoke", "day": "fri", "time": "6:00 PM", "title": "Weekend Smoke Reel", "account": "@its.myash", "platform": "Instagram", "kind": "video", "blocks": [{"label": "Script (~30 sec)", "text": "It's Friday. Here's your weekend assignment.\n\nFind yourself twenty uninterrupted minutes. Not ninety — twenty. A short, refined smoke: a petit format, a good pour, the right music, and nothing on your calendar.\n\nThe industry's finally catching up to this — Davidoff just built a whole travel line around the twenty-minute moment. But you don't need their permission. You need a chair, a light, and the discipline to actually sit down.\n\nThat's the flex this weekend. Not the biggest cigar. The most present twenty minutes."}, {"label": "Caption", "text": "Weekend Smoke: the flex isn't the biggest cigar — it's the most present 20 minutes. Short format, good pour, no calendar. That's the ritual. 🥃 What are you burning this weekend?\n\n#CigarLife #PremiumCigars #NellsSocial #LifeByAlexa"}, {"label": "Cover text", "text": "NEON GREEN: THE 20-MINUTE FLEX (chunky, tilted)"}], "note": null, "flag": null}, {"id": "fri-fb", "day": "fri", "time": "7:00 PM", "title": "Personal FB — Spanish", "account": "Personal", "platform": "Facebook", "kind": "post", "blocks": [{"label": "Post", "text": "Termina la semana y les cuento algo personal: la gente me pregunta si el mercado de casas aquí en los Poconos se está cayendo. Y les digo lo mismo que le digo a mi familia — no, mi amor, se está equilibrando. Hay más casas para escoger, pero las buenas se venden rápido igual. Entre el real estate, el lounge y todo lo demás, esta semana fue larga, pero de las que valen la pena. Buen fin de semana a todos. 🇩🇴 — Alexa"}], "note": "Fresh Spanish — not a translation of an EN post.", "flag": null}, {"id": "sat-gbp", "day": "sat", "time": "10:00 AM", "title": "GBP Community/Lifestyle — Big Pocono", "account": "@alexa.realtor", "platform": "Google Business Profile", "kind": "gbp", "blocks": [{"label": "Post (no hashtags)", "text": "A Late-Summer View Worth the Drive: Big Pocono State Park\n\nOne of the best free experiences in the Pocono Mountains is the summit of Camelback Mountain at Big P olden hour with a coffee, deep-green Pocono ridgelines behind her, calm and settled."}, {"label": "Headline (overlay)", "text": "MORE CHOICE DOESN'T MEAN LESS CERTAINTY"}, {"label": "Body — English", "text": "The Pocono Mountains market shifted into balance this summer — more homes to choose from, a little more room to negotiate, and the good ones still closing near full asking price. For buyers, that means options without panic. For anyone relocating from New York or New Jersey, it means you can take a breath, compare towns, and actually choose the life you want up here instead of chasing whatever's left. Balanced markets reward people who know what they're looking for."}, {"label": "Body — Spanish", "text": "El mercado de los Poconos está equilibrado: más opciones para escoger, pero las casas buenas se siguen vendiendo rápido. Es el momento de comparar con calma y elegir bien."}, {"label": "CTA", "text": "'Living in the Pocono Mountains & Lehigh Valley: The Complete 2026 Guide' → the Pillar. Placeholder ('Full guide coming soon') until the Pillar is confirmed live. IF the Pillar published last week per plan, swap this to the live URL and flip the tracker line to LINKED."}, {"label": "Alt text", "text": "Watercolor illustration of a Latina woman with curly dark brown hair and gold jewelry seated on a porch overlooking green Pocono Mountain ridgelines at golden hour, coffee in hand."}, {"label": "Tracker line", "text": "2026-08-22 | Lifestyle | 'More Choice Doesn't Mean Less Certainty' | porch/mountain-view scene | CTA: placeholder (Pillar pending confirm) | watercolor | EN+ES"}], "note": "Watercolor lane only — never for listings/testimonials/bio.", "flag": "Confirm Pillar live status. If live → swap CTA to real URL + mark tracker LINKED. If still staged → keep placeholder."}, {"id": "gal-landmark", "day": "gallery", "time": "Standing", "title": "Landmark Card — Big Pocono (real photo)", "account": "Website", "platform": "Local Life & Global Vibes", "kind": "gallery", "blocks": [{"label": "Photo direction", "text": "Big Pocono State Park summit, Camelback, Tannersville — real three-state vista, golden hour (different frame from Friday's Landmark so gallery visitors get something new). Real photo only, never illustrated. Canva manual crop, 4:5."}, {"label": "Short caption", "text": "Big Pocono State Park, Tannersville — 1,306 acres and three-state views on the summit of Camelback Mountain. The Pocono lifestyle in one frame."}, {"label": "Alt text", "text": "Real photograph of the three-state view from the summit of Big Pocono State Park, Tannersville, PA at golden hour."}, {"label": "Tracker line", "text": "2026-08-22 | Landmark | Big Pocono State Park (Camelback summit) | real photo | CTA: n/a"}], "note": null, "flag": null}, {"id": "gal-listing", "day": "gallery", "time": "Conditional", "title": "Listing Card — 1108 Colt Lane", "account": "Website", "platform": "Local Life & Global Vibes", "kind": "gallery", "blocks": [{"label": "Blurb template (fill specs)", "text": "[Beds]BD / [Baths]BA in [Town/Township], Monroe County. [Feature 1], [Feature 2], [Feature 3]. Offered at $[Price]. [STR / second-home / primary angle]."}, {"label": "ES line", "text": "[Beds] habitaciones / [Baths] baños en [Town], Monroe County. $[Price]."}, {"label": "CBC / offer line", "text": "Cooperating broker compensation per listing agreement; contact for details."}, {"label": "Alt text", "text": "Real photo of the home at 1108 Colt Lane, [Town], PA."}, {"label": "Tracker line", "text": "2026-08-22 | Listing | 1108 Colt Lane [Town] | real photo | PENDING SPECS"}], "note": "Packet marked the Listing lane SKIP this week (no confirmed inventory). Carried forward as PENDING so 1108 stays on radar.", "flag": "PENDING — need town/township, price, beds/baths, sqft, lot, 3–4 features, MLS/share link, photo. Template ready to fill. If no specs, the listing lane skips this week."}]};

const DAYS = [{"id": "sun", "label": "Sun", "full": "Sunday", "date": "August 16"}, {"id": "mon", "label": "Mon", "full": "Monday", "date": "August 17"}, {"id": "tue", "label": "Tue", "full": "Tuesday", "date": "August 18"}, {"id": "wed", "label": "Wed", "full": "Wednesday", "date": "August 19"}, {"id": "thu", "label": "Thu", "full": "Thursday", "date": "August 20"}, {"id": "fri", "label": "Fri", "full": "Friday", "date": "August 21"}, {"id": "sat", "label": "Sat", "full": "Saturday", "date": "August 22"}, {"id": "gallery", "label": "Gallery", "full": "Website Gallery Cards", "date": "Any time this week"}];

const state = {};           // itemId -> bool
let sb = null;
let persist = false;

const $ = s => document.querySelector(s);
const key = id => DATA.weekHash + ":" + id;
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- SYNC ---------- */
function setSync(cls, text){
  const el = $("#sync");
  el.className = "sync " + cls;
  $("#syncText").textContent = text;
}

async function initSync(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY){
    setSync("warn", "Not synced — add Supabase keys to save across devices");
    return;
  }
  try{
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const {data, error} = await sb.from("ops_checks")
      .select("key,done").like("key", DATA.weekHash + ":%");
    if(error) throw error;
    (data || []).forEach(r => { state[r.key.split(":").slice(1).join(":")] = !!r.done; });
    persist = true;
    setSync("ok", "Synced · " + DATA.weekHash);
    render();
  }catch(err){
    console.error(err);
    setSync("warn", "Sync failed — checks won't save. Check keys and RLS policy.");
  }
}

async function save(id, done){
  if(!persist) return;
  try{
    const {error} = await sb.from("ops_checks")
      .upsert({key:key(id), done, updated_at:new Date().toISOString()}, {onConflict:"key"});
    if(error) throw error;
    setSync("ok", "Saved " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}));
  }catch(err){
    console.error(err);
    setSync("warn", "Didn't save — check connection");
  }
}

/* ---------- RENDER ---------- */
let activeDay = DAYS[new Date().getDay()] ? DAYS[new Date().getDay()].id : "sun";
if(!DAYS.some(d => d.id === activeDay)) activeDay = "sun";

function itemsFor(day){ return DATA.items.filter(i => i.day === day); }
function doneCount(day){ return itemsFor(day).filter(i => state[i.id]).length; }

function renderTabs(){
  $("#tabs").innerHTML = DAYS.map(d => {
    const list = itemsFor(d.id), done = doneCount(d.id);
    const all = list.length > 0 && done === list.length;
    return `<button class="tab${all ? " all-done" : ""}" role="tab" data-day="${d.id}"
      aria-selected="${d.id === activeDay}">${d.label}
      <span class="count">${done}/${list.length}</span></button>`;
  }).join("");
}

function renderProgress(){
  const total = DATA.items.length;
  const done = DATA.items.filter(i => state[i.id]).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  $("#progressFill").style.width = pct + "%";
  $("#progressText").textContent = done + " of " + total + " posted";
  $("#progressPct").textContent = pct + "%";
}

function cardHTML(it){
  const done = state[it.id] ? "1" : "0";
  const blocks = it.blocks.map((b, i) => `
    <div class="block">
      <div class="block-head">
        <span class="block-label">${esc(b.label)}</span>
        <button class="copy-btn" data-copy="${it.id}|${i}">Copy</button>
      </div>
      <pre id="blk-${it.id}-${i}">${esc(b.text)}</pre>
    </div>`).join("");
  return `
  <article class="card" data-id="${it.id}" data-done="${done}" data-open="0"
           data-flagged="${it.flag ? 1 : 0}">
    <div class="card-top">
      <button class="check" data-check="${it.id}" aria-pressed="${done === "1"}"
        aria-label="Mark ${esc(it.title)} posted">
        <svg viewBox="0 0 24 24"><polyline points="4 12.5 9.5 18 20 6.5"/></svg>
      </button>
      <div class="card-main">
        <div class="card-time">${esc(it.time)}</div>
        <h3 class="card-title">${esc(it.title)}</h3>
        <div class="chips">
          <span class="chip acct">${esc(it.account)}</span>
          <span class="chip${it.kind === "gbp" ? " kind-gbp" : ""}">${esc(it.platform)}</span>
        </div>
      </div>
    </div>
    ${it.flag ? `<div class="flag">${esc(it.flag)}</div>` : ""}
    ${it.note ? `<div class="note">${esc(it.note)}</div>` : ""}
    <button class="toggle-blocks" data-toggle="${it.id}">
      <span>${it.blocks.length} copy block${it.blocks.length > 1 ? "s" : ""}</span>
      <span class="arrow">▼</span>
    </button>
    <div class="blocks">${blocks}</div>
  </article>`;
}

function renderDay(){
  const d = DAYS.find(x => x.id === activeDay);
  const list = itemsFor(activeDay);
  $("#main").innerHTML = `
    <div class="day-head">
      <h2>${esc(d.full)}</h2><span class="date">${esc(d.date)}</span>
    </div>
    ${list.length ? list.map(cardHTML).join("")
      : `<p class="empty">Nothing scheduled. Enjoy it.</p>`}`;
}

function render(){ renderTabs(); renderDay(); renderProgress(); }

/* ---------- EVENTS ---------- */
document.addEventListener("click", async e => {
  const tab = e.target.closest("[data-day]");
  if(tab){ activeDay = tab.dataset.day; render(); window.scrollTo({top:0}); return; }

  const chk = e.target.closest("[data-check]");
  if(chk){
    const id = chk.dataset.check;
    state[id] = !state[id];
    const card = chk.closest(".card");
    card.dataset.done = state[id] ? "1" : "0";
    chk.setAttribute("aria-pressed", state[id]);
    renderTabs(); renderProgress();
    save(id, state[id]);
    return;
  }

  const tog = e.target.closest("[data-toggle]");
  if(tog){
    const card = tog.closest(".card");
    card.dataset.open = card.dataset.open === "1" ? "0" : "1";
    return;
  }

  const cp = e.target.closest("[data-copy]");
  if(cp){
    const [id, i] = cp.dataset.copy.split("|");
    const text = document.getElementById("blk-" + id + "-" + i).textContent;
    try{
      await navigator.clipboard.writeText(text);
    }catch(_){
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
    }
    cp.textContent = "Copied"; cp.classList.add("copied");
    setTimeout(() => { cp.textContent = "Copy"; cp.classList.remove("copied"); }, 1400);
  }
});

$("#resetBtn").addEventListener("click", async () => {
  if(!confirm("Clear every check for " + DATA.week + "? This can't be undone.")) return;
  const ids = DATA.items.map(i => i.id);
  ids.forEach(id => state[id] = false);
  render();
  if(persist){
    try{
      await sb.from("ops_checks").delete().like("key", DATA.weekHash + ":%");
      setSync("ok", "Week cleared");
    }catch(err){ console.error(err); setSync("warn", "Reset didn't save"); }
  }
});

/* ---------- BOOT ---------- */
$("#weekLabel").textContent = DATA.week;
render();
initSync();
</script>
</body>
</html>

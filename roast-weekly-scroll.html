<style>
:root{
  --ink:#12130F;
  --paper:#F7F6F1;
  --card:#FFFFFF;
  --line:#DDDCD4;
  --muted:#6E6E64;
  --brass:#B98436;       /* accent — gold/warm earth, from the lounge + watercolor palette */
  --brass-deep:#8A5F1F;
  --alarm:#B03A2E;       /* flags */
  --radius:4px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Archivo',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:80px;
}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brass-deep);outline-offset:2px}

/* ---------- HEADER ---------- */
header{background:var(--ink);color:var(--paper);padding:18px 16px 14px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--brass);margin:0 0 6px}
h1{font-family:'Archivo Black',sans-serif;font-size:26px;line-height:.98;
  letter-spacing:-.02em;margin:0;text-transform:uppercase}
h1 span{display:block;color:var(--brass)}
.meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#9C9C90;margin-top:8px}

/* progress spine */
.progress-wrap{margin-top:14px}
.progress-track{height:6px;background:#2A2C24;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--brass);transition:width .35s ease}
.progress-label{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;color:#9C9C90;margin-top:6px;letter-spacing:.06em}
.progress-label b{color:var(--brass);font-weight:500}

/* ---------- DAY TABS ---------- */
nav{position:sticky;top:0;z-index:20;background:var(--ink);
  border-bottom:1px solid #2A2C24;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:0;padding:0 8px;min-width:max-content}
.tab{background:none;border:0;padding:11px 12px 10px;color:#8A8A7E;
  font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--brass)}
.tab .count{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;
  background:#2A2C24;color:#9C9C90;padding:1px 5px;border-radius:99px}
.tab[aria-selected="true"] .count{background:var(--brass);color:#FFF}
.tab.all-done .count{background:var(--brass-deep);color:#FFF}

/* ---------- DAY BODY ---------- */
main{padding:16px 12px 0;max-width:760px;margin:0 auto}
.day-head{display:flex;align-items:baseline;gap:10px;margin:4px 2px 14px}
.day-head h2{font-family:'Archivo Black',sans-serif;font-size:19px;margin:0;
  text-transform:uppercase;letter-spacing:-.01em}
.day-head .date{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}

/* ---------- CARD ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:10px;overflow:hidden;position:relative}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.card[data-done="1"]{opacity:.5}
.card[data-done="1"]::before{background:var(--brass-deep)}
.card[data-flagged="1"]::before{background:var(--alarm)}

.card-top{display:flex;gap:11px;padding:12px 13px 12px 15px;align-items:flex-start}
.check{flex:0 0 auto;width:26px;height:26px;border:2px solid var(--ink);border-radius:var(--radius);
  background:transparent;display:flex;align-items:center;justify-content:center;padding:0;
  transition:background .12s ease}
.check svg{width:15px;height:15px;stroke:var(--ink);stroke-width:3.2;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .12s ease}
.card[data-done="1"] .check{background:var(--brass);border-color:var(--brass-deep)}
.card[data-done="1"] .check svg{opacity:1;stroke:#FFF}
.card[data-done="1"] .card-title{text-decoration:line-through;text-decoration-thickness:2px}

.card-main{flex:1;min-width:0}
.card-time{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;
  color:var(--muted);text-transform:uppercase}
.card-title{font-size:15.5px;font-weight:700;line-height:1.25;margin:2px 0 5px;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.04em;
  padding:2px 6px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}
.chip.acct{border-color:var(--ink);color:var(--ink);font-weight:500}
.chip.kind-gbp{background:var(--brass);border-color:var(--brass);color:#FFF;font-weight:500}

.note,.flag{font-size:12.5px;line-height:1.4;padding:7px 13px 7px 15px;border-top:1px dashed var(--line)}
.note{color:var(--muted)}
.flag{background:#FDEDEB;color:#8E1C13;font-weight:600}
.flag::before{content:"⚑ ";}

/* ---------- BLOCKS ---------- */
.toggle-blocks{width:100%;background:#F2F1EB;border:0;border-top:1px solid var(--line);
  padding:9px 13px;text-align:left;font-size:12px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.toggle-blocks .arrow{transition:transform .2s ease;font-size:10px}
.card[data-open="1"] .toggle-blocks .arrow{transform:rotate(180deg)}
.blocks{display:none;padding:0 13px 13px 15px}
.card[data-open="1"] .blocks{display:block}
.block{margin-top:11px}
.block-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.block-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
.copy-btn{background:var(--ink);color:var(--paper);border:0;border-radius:var(--radius);
  padding:4px 10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  flex:0 0 auto}
.copy-btn.copied{background:var(--brass);color:#FFF}
pre{margin:0;background:#FAFAF6;border:1px solid var(--line);border-left:2px solid var(--ink);
  border-radius:var(--radius);padding:10px 11px;font-family:'IBM Plex Mono',monospace;
  font-size:12px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;
  max-height:260px;overflow-y:auto}

/* ---------- FOOTER / STATUS ---------- */
.sync{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#9C9C90;
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;
  padding:9px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:30}
.sync .dot{display:inline-block;width:7px;height:7px;border-radius:99px;background:var(--muted);
  margin-right:6px;vertical-align:middle}
.sync.ok .dot{background:var(--brass)}
.sync.warn{color:#F4C542}
.sync.warn .dot{background:#F4C542}
.sync button{background:none;border:1px solid #3A3C33;color:#9C9C90;border-radius:var(--radius);
  padding:4px 9px;font-family:inherit;font-size:10px;letter-spacing:.06em;text-transform:uppercase}

.empty{text-align:center;color:var(--muted);padding:38px 20px;font-size:13.5px}

@media (min-width:700px){
  h1{font-size:34px}
  body{font-size:15.5px}
  .card-title{font-size:16.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const DATA = {"week": "Aug 2–8, 2026", "weekHash": "2026-08-02", "items": [{"id": "sun-ledger", "day": "sun", "time": "Written first", "title": "The Pocono Ledger (blog)", "account": "@alexa.realtor", "platform": "alexa.realtor blog", "kind": "article", "blocks": [{"label": "SEO title", "text": "Pocono Mountains Real Estate Report — Week of Aug 2, 2026: The Fed Held, Rates Rose Anyway"}, {"label": "Meta description", "text": "Monroe County mortgage rates hit an 11-month high of 6.66% this week even as the Fed held. Median price $348,854 (+14.9% YoY); well-priced homes clear in ~38 days. What Pocono buyers and sellers should do now — from licensed PA Realtor Alexa Sanchez."}, {"label": "Slug + internal link", "text": "Slug: /blog/pocono-ledger-2026-08-02-fed-held-rates-rose\n\nLink UP to the Pillar: 'New to the Pocono Mountains? Start with Living in the Pocono Mountains & Lehigh Valley: The Complete 2026 Guide.'"}, {"label": "Article (full)", "text": "THE FED HELD. YOUR MORTGAGE RATE WENT UP ANYWAY.\nThe Pocono Ledger · Week of August 2, 2026\n\nNew to the Pocono Mountains? Start with our complete guide to living here. (Pillar link)\n\nEXECUTIVE SUMMARY\nOn July 29 the Federal Reserve left its benchmark rate unchanged — and the 30-year fixed mortgage still climbed to 6.66%, an 11-month high. That is not a contradiction; it is the whole lesson of the week. Your mortgage tracks the bond market, not the Fed's overnight rate, and this week the bond market sold off hard. Meanwhile Monroe County keeps appreciating (median $348,854, up 14.9% year over year), but the gap between 'priced right, gone in two weeks' and 'sitting for two months' is widening. The move this week is direction-aware, not wait-and-see.\n\nTHE WEEK'S NUMBERS\nRates. 30-year fixed 6.66% (up from 6.58% last week; 6.72% a year ago). 15-year fixed 6.04%. VA 30-year ~6.23% — some lenders quoting high 5s; Veterans United posted 5.99% on 7/31. The Fed held at 3.50%–3.75% on July 29 in a hawkish 9–3 vote, with three regional presidents dissenting because they wanted a hike. Next decision: September 15–16.\nMonroe County. Median sale price $348,854, up 14.9% year over year — roughly four times Pennsylvania's statewide pace of +5.6%. Days on market split by source: well-priced homes clear in about 38 days, while the overpriced tail sits closer to 57. Price reductions fell to 22% of listings (down from 31% a year earlier), with a 98.1% list-to-sale ratio.\n(Accuracy note: the county median and YoY are still Redfin's May 2026 print — the June county figure isn't published yet. Treat appreciation as a rearview number.)\n\nWHAT CHANGED THIS WEEK\nTwo things. First, the rate floor moved up. After weeks in the mid-6s, the 30-year jumped to 6.66% on the back of the Fed's hawkish hold and a Treasury sell-off that pushed the 30-year Treasury yield to its highest level since 2007. The Dow closed 1,100 points lower, and Chair Warsh hinted the September move could be up, not down. Second, the final approval hearing for the Tuccori buyer-commission settlement was pushed to November 2, 2026, from July 28. Nothing changes about how buyer agreements get written today; the litigation cloud just stays open a few more months.\n\nNEIGHBORHOOD / TOWNSHIP SPOTLIGHT — COOLBAUGH TOWNSHIP (TOBYHANNA)\nCoolbaugh Township — anchored by Tobyhanna and the large A Pocono Country Place community — is where two of this week's storylines collide. It carries a heavy share of the county's $400K+ inventory, exactly the price band where higher rates thin the buyer pool fastest. It's also where the distress pipeline shows up first: the July 30 county sheriff sale (run monthly through Bid4Assets) included a Tobyhanna estate property foreclosed against a deceased owner's unknown heirs. That overlap — real equity, a real deadline, no agent yet — is the archetype worth watching here. For sellers in this township: price to the 38-day lane, because the 57-day tail is concentrated right where you are.\n\nOPERATOR OBSERVATION\nHere's what I'm telling buyers this week: the VA advantage is widening, not shrinking. A veteran at ~6.23% with zero down and no PMI holds roughly $15K–$20K more borrowing power than a conventional buyer at 6.66% for the same monthly payment. When rates climb, that gap gets bigger. And to sellers — appreciation is real but it's a rearview mirror. Those +14.9% comps came from this spring. Pricing to them is how a good house becomes a 57-day listing. Price to what buyers can afford this week, at these rates, and you're back in the 38-day lane.\n\nWHAT BUYERS SHOULD DO\nLock, don't float — with a possible September hike and Treasuries spiking, the risk is to the upside. Veterans: run the VA numbers first; at ~6.23% with zero down your buying power in the $250K–$600K band is materially stronger than a conventional buyer's. Get the buydown math — in a 6.6% market, a seller-paid 2-1 buydown on a home that's been sitting can beat waiting for a cut that may not come.\n\nWHAT SELLERS SHOULD DO\nPrice to the 38-day lane, not the 57-day one. Use the appreciation, don't assume it — +14.9% is a spring comp, not a license to overreach. Move before September; every uptick shaves approval amounts off your buyer pool, especially above $400K where Monroe County has the most inventory.\n\nSOURCES\nFreddie Mac PMMS (7/30/26); CNBC/Optimal Blue & Veterans United (7/31/26); Federal Reserve/FOMC (7/29/26); Redfin (May 2026 + live); mwestates Q1 2026 report; HousingWire (Tuccori); ATTOM Midyear Foreclosure Report (7/16/26). Alexa Sanchez, Licensed PA Realtor #RS326383, Smart Way America Realty. Educational only; rates not guaranteed."}], "note": "Source of truth. Everything market-side derives from this — no re-reporting. County median/YoY is still Redfin's May print; June county figure not out yet.", "flag": null}, {"id": "sun-hub", "day": "sun", "time": "Record + upload", "title": "Hub Video EN — the spoken Ledger", "account": "@alexa.realtor", "platform": "YouTube", "kind": "video", "blocks": [{"label": "Script", "text": "HOOK (0:00–0:08)\nThe Fed held rates this week. Your mortgage rate went up anyway. Here's why — and what it means if you're buying or selling in the Poconos.\n\nOPEN (0:08–0:20)\nI'm Alexa Sanchez, licensed Realtor with Smart Way America Realty in Monroe County. This is your Pocono market read for the week of August 2nd.\n\nBODY 1 — THE RATE STORY (0:20–0:55)\nThirty-year fixed just hit 6.66 percent. An eleven-month high. The Fed left its rate alone on July 29th — but it was a hawkish hold. Three officials wanted a hike. The bond market heard that, the 30-year Treasury spiked to its highest since 2007, and mortgage rates follow that bond market. Not the Fed. So the 'rate cut is coming' story? Dead for now. September could go up, not down.\n\nBODY 2 — MONROE COUNTY (0:55–1:30)\nLocally, prices are still climbing. Median sale price 348,854 — up 14.9 percent year over year. About four times the statewide pace. But watch the split: well-priced homes sell in 38 days, overpriced ones sit around 57. Price cuts dropped to 22 percent. The market rewards accurate pricing and punishes wishful pricing, hard.\n\nBODY 3 — YOUR MOVE (1:30–2:05)\nBuyers: lock, don't float. Veterans, run your VA numbers first — at 6.23 percent with zero down you've got 15 to 20 thousand more in buying power than a conventional buyer. Sellers: price to the 38-day lane and move before September, because every rate uptick trims your buyer pool above 400 thousand.\n\nCTA (2:05–2:20)\nFull breakdown's in this week's Pocono Ledger on my site. Questions on your price point — call me, 570-688-8147. I'm Alexa Sanchez. See you next week."}, {"label": "YouTube title", "text": "Pocono Mountains Housing Market Update (Aug 2, 2026): Why Mortgage Rates Rose When the Fed Held"}, {"label": "YouTube description", "text": "Mortgage rates hit an 11-month high of 6.66% this week — even though the Federal Reserve held its benchmark rate. If you're buying or selling in Monroe County or the Pocono Mountains, here's what actually happened and what to do about it.\n\nQ: Why did mortgage rates go up if the Fed didn't raise rates? Because your 30-year mortgage tracks long-term Treasury yields, not the Fed's overnight rate. A hawkish hold plus a bond sell-off sent the 30-year Treasury to its highest level since 2007, and mortgage rates followed.\nQ: What's the median home price in Monroe County right now? $348,854 — up 14.9% year over year, roughly four times Pennsylvania's statewide pace.\nQ: How fast are homes selling in the Poconos? Well-priced homes move in about 38 days; overpriced listings linger closer to 57.\n\nTIMESTAMPS\n0:00 The Fed held, rates rose\n0:20 Why mortgages follow bonds\n0:55 Monroe County numbers\n1:30 What buyers & sellers should do\n2:05 How to reach me\n\nAlexa Sanchez · Licensed Realtor · PA License #RS326383 · Smart Way America Realty\n(570) 688-8147 · Alexa@alexasanchez.net"}, {"label": "Tags", "text": "pocono mountains real estate, monroe county pa homes, pocono housing market 2026, mortgage rates august 2026, pennsylvania real estate, va loan pocono, selling a home in the poconos, alexa sanchez realtor"}, {"label": "Hashtags", "text": "#PoconoRealEstate #MonroeCounty #PoconoMountains #PARealEstate #LifeByAlexa"}, {"label": "Thumbnail direction", "text": "Cartoon headshot, left third. Right two-thirds black. Chunky slightly tilted text.\nNEON GREEN: FED HELD\nRED/WHITE: RATES ROSE\nSmall tag, bottom corner: 6.66%\nNo stock house photo. No graph."}], "note": null, "flag": null}, {"id": "mon-li", "day": "mon", "time": "8:00 AM", "title": "LinkedIn Market Signal", "account": "@alexa.realtor", "platform": "LinkedIn", "kind": "post", "blocks": [{"label": "Post", "text": "The Fed held rates last week. Mortgage rates went up anyway. That's the operator lesson worth internalizing: the 30-year fixed doesn't track the Fed's overnight rate — it tracks the bond market. A hawkish 9–3 hold and a Treasury sell-off pushed the 30-year to 6.66%, an 11-month high, and sent the 'a cut is coming' narrative to the sidelines.\n\nFor Monroe County, the read is a widening spread. Prices are still up 14.9% YoY (median $348,854), but the market has split cleanly: well-priced homes clear in ~38 days, overpriced ones sit near 57. Discipline on price is now worth more than optimism about rates.\n\nIf you're advising buyers, the direction risk points up — September could bring a hike, not a cut. Lock accordingly. Full read in this week's Pocono Ledger.\n\n#PoconoRealEstate #MonroeCounty #PARealEstate #LifeByAlexa"}], "note": null, "flag": null}, {"id": "mon-gbp1", "day": "mon", "time": "9:00 AM", "title": "GBP Market Update", "account": "@alexa.realtor", "platform": "Google Business Profile", "kind": "gbp", "blocks": [{"label": "Post (no hashtags)", "text": "Monroe County Market Update — Week of Aug 2, 2026\n\nThe Federal Reserve held its benchmark rate on July 29, but the 30-year fixed mortgage still climbed to 6.66% — an 11-month high — because mortgage rates track the bond market, not the Fed. Locally, the median sale price sits at $348,854, up 14.9% year over year. Well-priced Pocono homes are still selling in about 38 days; overpriced listings are lingering near 57. Buyers: locking now beats waiting for a cut that may not come. Sellers: price to today's rates, not this spring's comps. Veterans — VA rates near 6.23% give you materially more buying power right now; ask me to run the numbers.\n\nAlexa Sanchez · Local Pocono Mountains Realtor · PA License #RS326383 · Smart Way America Realty\n(570) 688-8147 · Alexa@alexasanchez.net · 528 Seven Bridges Rd, Suite 108, East Stroudsburg, PA 18301"}], "note": "No hashtags. No addresses. No client names.", "flag": null}, {"id": "mon-fb", "day": "mon", "time": "10:00 AM", "title": "Personal FB — English", "account": "Personal", "platform": "Facebook", "kind": "post", "blocks": [{"label": "Post", "text": "Quick one for my Pocono friends thinking about a move: the Fed held rates last week, but mortgage rates still went up to 6.66% — highest in 11 months. If you've been waiting for a 'cut' to rescue your rate, that plan is on hold; the next Fed move might actually be up. Prices here are still strong (median $348,854, +14.9% for the year), and well-priced homes are still flying off in about five weeks. If you're a veteran, your VA rate is meaningfully lower right now — worth a real conversation before you shop. Happy to run your numbers, no pressure. — Alexa, (570) 688-8147"}], "note": null, "flag": null}, {"id": "mon-gbp2", "day": "mon", "time": "11:00 AM", "title": "GBP Local Insight — foreclosure pipeline", "account": "@alexa.realtor", "platform": "Google Business Profile", "kind": "gbp", "blocks": [{"label": "Post (no hashtags)", "text": "Local Insight — Monroe County, Week of Aug 2, 2026\n\nThe foreclosure pipeline is filling. U.S. foreclosure filings hit 227,548 in the first half of 2026, up 21% year over year, and Pennsylvania ranked #4 in the nation for completed foreclosures. The driver is stress in FHA and VA mortgages. For local homeowners, the takeaway is timing: the worst outcome is losing control at a sheriff sale, where equity disappears. The window to act is the 60–90 days before that — while you still hold the deed and can list at market value. If you're behind or worried about a payment, a conversation now beats an auction later. I help Monroe County homeowners understand their options before the clock runs out.\n\nAlexa Sanchez · Licensed Realtor · PA License #RS326383 · Smart Way America Realty\n(570) 688-8147 · Alexa@alexasanchez.net"}], "note": "Second GBP angle, distinct from the Market Update. Highest AEO weight — keep it specific.", "flag": null}, {"id": "mon-carousel", "day": "mon", "time": "Market rollout", "title": "IG Market Carousel", "account": "@alexa.realtor", "platform": "Instagram", "kind": "post", "blocks": [{"label": "Slides", "text": "Slide 1 (cover): 'THE FED HELD.' / red sub: 'RATES ROSE ANYWAY.' — over cartoon headshot\nSlide 2: 30-yr fixed 6.66% — an 11-month high. (neon-green stat on black)\nSlide 3: Why? Your mortgage follows the BOND market, not the Fed. (two-arrow diagram)\nSlide 4: Monroe County median $348,854 · +14.9% YoY. (map pin)\nSlide 5: The split — 38 days if priced right. ~57 days if you overreach.\nSlide 6: Veterans — ~6.23% + zero down = $15–20K more buying power right now.\nSlide 7 (CTA): 'Full read → this week's Pocono Ledger. Call 570-688-8147. Alexa Sanchez, PA #RS326383.'"}, {"label": "Caption", "text": "The Fed held rates. Your mortgage rate climbed anyway. Here's the split every Pocono buyer and seller needs to see this week 👇 Swipe for the numbers. Full breakdown in the Pocono Ledger (link in bio).\n\n#PoconoRealEstate #PoconoMountains #MonroeCounty #STRInvesting #PARealEstate #LifeByAlexa"}], "note": null, "flag": null}, {"id": "tue-cc", "day": "tue", "time": "3:00 PM", "title": "Car Confession EN — waiting for a cut", "account": "@alexa.realtor", "platform": "IG + YouTube Shorts", "kind": "video", "blocks": [{"label": "Script (20 sec)", "text": "Confession: everybody's waiting on a rate cut that ain't coming.\n\nThe Fed held last week and mortgage rates went UP — 6.66 percent. Highest in almost a year.\n\nMeanwhile you're 'waiting for a better time' while Pocono prices climbed 15 percent.\n\nThe better time was last year. The second-best time is before September, when the Fed might actually hike.\n\nStop waiting. Run the numbers.\n\n[Flat delivery. No smile. Hard cut on 'numbers.']"}, {"label": "IG caption", "text": "Waiting for a rate cut? Sit down. 🚗💨 The Fed held and rates went UP to 6.66%. Meanwhile Pocono prices are up ~15% for the year. 'Waiting for the perfect time' is costing you money. Call me — 570-688-8147.\n\n#PoconoRealEstate #MonroeCounty #PoconoMountains #PARealEstate #LifeByAlexa"}, {"label": "Cover text", "text": "RED/WHITE: WAITING FOR A RATE CUT?\nNEON GREEN (at stat): 6.66%"}, {"label": "YT Shorts title", "text": "Stop Waiting for a Mortgage Rate Cut (Pocono Real Estate Reality Check) #shorts"}, {"label": "YT Shorts description", "text": "The Fed held rates and mortgage rates rose to 6.66% anyway. In Monroe County, PA, prices are up ~15% year over year. Waiting for a cut that may not come is costing Pocono buyers real money — here's the blunt truth.\n\n0:00 The confession · 0:07 The numbers · 0:14 The takeaway\n\nAlexa Sanchez · PA License #RS326383 · Smart Way America Realty · (570) 688-8147"}, {"label": "Tags", "text": "mortgage rates 2026, pocono real estate, monroe county pa, should i wait to buy a house, fed rate decision, pocono mountains homes, first time home buyer pa, alexa sanchez realtor"}], "note": "Doubles as this week's Misconception (Output 12): 'The Fed held, so my mortgage rate won't move.' No separate misconception card this week — one shoot carries both.", "flag": null}, {"id": "tue-nd", "day": "tue", "time": "9:00 AM", "title": "Nextdoor — Neighborly Post", "account": "@alexa.realtor", "platform": "Nextdoor", "kind": "post", "blocks": [{"label": "Post", "text": "Neighbors — a small heads-up for anyone feeling the squeeze on housing costs right now. Pennsylvania's Property Tax/Rent Rebate is open, and this year the income limit went up to $48,110, so more households qualify than before. Rebates run up to $1,000 on 2025 property taxes or rent, and the filing deadline was extended to December 31. Only half of Social Security counts toward that income cap, which brings a lot of retirees under the line. Worth a look if it applies to you or a neighbor.\n\n— Alexa Sanchez, Smart Way America Realty · PA License #RS326383"}], "note": "No selling language. No CTA. Identity via signature only.", "flag": null}, {"id": "wed-aldia", "day": "wed", "time": "Record + post", "title": "Pocono al Día — market (Spanish)", "account": "@alexa.realtor", "platform": "IG + YouTube", "kind": "video", "blocks": [{"label": "Guión (cadencia dominicana)", "text": "GANCHO (0:00–0:05)\nÓyeme bien: la Reserva Federal no subió las tasas esta semana… pero tu hipoteca subió de todos modos. Te explico por qué, mi amor.\n\nCUERPO\nMucha gente en los Poconos está esperando que las tasas bajen. Déjame darte la realidad. La tasa fija a 30 años llegó a 6.66 por ciento — lo más alto en once meses. ¿Y por qué subió si la Fed no la tocó? Porque tu hipoteca no sigue a la Fed. Sigue al mercado de bonos. Y esta semana los bonos se dispararon.\n\nAquí en el condado de Monroe los precios siguen subiendo — el precio medio está en 348,854 dólares, casi 15 por ciento más que el año pasado. Pero fíjate en esto: la casa con el precio correcto se vende en 38 días. La casa sobrevalorada se queda 57 días esperando. Tú estás en control de eso — es el precio, no el mercado.\n\nCIERRE\nSi estás comprando, no esperes una rebaja que quizás no llegue — en septiembre podría subir, no bajar. Asegura tu tasa ahora. Soy Alexa Sanchez, Realtor con licencia en Pensilvania. Llámame: 570-688-8147."}, {"label": "YouTube title (ES)", "text": "Las Tasas Hipotecarias Subieron Aunque la Fed No las Tocó — Mercado de los Poconos (Ago 2026)"}, {"label": "YouTube description (ES)", "text": "La tasa fija a 30 años llegó a 6.66% esta semana, la más alta en once meses, aunque la Reserva Federal mantuvo su tasa. Si estás comprando o vendiendo en el condado de Monroe o los Montes Poconos, esto es lo que pasó y qué hacer.\n\nP: ¿Por qué subió mi hipoteca si la Fed no subió las tasas? Porque la hipoteca a 30 años sigue al mercado de bonos, no a la tasa de la Fed.\nP: ¿Cuánto cuesta una casa en el condado de Monroe? El precio medio es de $348,854, casi 15% más que el año pasado.\n\n0:00 La Fed no subió, tu hipoteca sí · 0:30 Por qué · 1:00 Los precios en Monroe · 1:40 Vende al precio correcto · 2:10 Qué hacer\n\nAlexa Sanchez · PA License #RS326383 · Smart Way America Realty · (570) 688-8147 · Alexa@alexasanchez.net"}, {"label": "IG / YouTube caption (ES)", "text": "La Fed no subió las tasas… pero tu hipoteca sí. 📊 6.66% — lo más alto en 11 meses. Y los precios en el condado de Monroe siguen subiendo. Te lo explico clarito.\n\n#BienesRaices #InversionesEnPoconos #MonroeCounty #LifeByAlexa"}, {"label": "Cover text", "text": "NEON GREEN: 6.66%\nRED/WHITE: LA FED NO LA TOCÓ"}], "note": "Under 3 min · one topic · written fresh in Spanish — NOT a translation.", "flag": null}, {"id": "wed-tt", "day": "wed", "time": "Record + post", "title": "Talking Head — your cigar might be Honduran", "account": "@its.myash", "platform": "TikTok", "kind": "video", "blocks": [{"label": "Script", "text": "Your 'Dominican' cigar might be Honduran now. And you didn't even notice. Here's what happened.\n\nFor the first time in modern history, Honduras just passed the Dominican Republic as the number two cigar exporter to the U.S. — 17.2 million sticks to the DR's 15.6 million. But it's not a taste thing. It's a sanctions thing.\n\nThe biggest cigar factory on earth — Tabacalera de García in the DR — got its U.S. exports frozen for two quarters over an OFAC investigation that has nothing to do with cigars. Ran at 40 percent capacity. That's the whole story.\n\nSo don't let anybody tell you 'Dominican cigars are fading.' The DR still shipped over 196 million premium cigars last year. Forty thousand people make their living off that tobacco — 62 percent of them women. One factory hit a speed bump. The terroir didn't go anywhere.\n\nThat's the difference between reading a headline and knowing the industry."}, {"label": "TikTok caption", "text": "Your 'Dominican' cigar might be Honduran right now — and it's a sanctions story, not a quality story. Let me explain. 🇩🇴🚬\n\n#CigarAuthority #DominicanCigars #CigarLife #LifeByAlexa"}, {"label": "Visual", "text": "Shot at Nell's Social, warm interior light, no overhead fluorescents. Seated, cigar or coffee in hand, one take. Caption seeds Wednesday's @its.myash IG post."}], "note": null, "flag": null}, {"id": "wed-ig", "day": "wed", "time": "Post", "title": "Talking Head — IG post", "account": "@its.myash", "platform": "Instagram", "kind": "post", "blocks": [{"label": "IG caption", "text": "That 'Dominican' cigar in your hand? Might be Honduran now — and NOT because tastes changed. Honduras just passed the DR as #2 to the U.S. because the world's biggest factory got frozen out by sanctions for two quarters. The DR still shipped 196M+ sticks last year. Don't confuse a supply-chain speed bump with a decline. 🇩🇴\n\n#CigarAuthority #DominicanCigars #PremiumCigars #NellsSocial #LifeByAlexa"}], "note": "Same video as TikTok.", "flag": null}, {"id": "wed-fb", "day": "wed", "time": "Post", "title": "FB Business — cigar repurpose", "account": "@its.myash", "platform": "Facebook Business", "kind": "post", "blocks": [{"label": "Post", "text": "Here's a fact that surprises most cigar smokers: your 'Dominican' cigar might actually be Honduran right now. Honduras just passed the DR as the #2 exporter to the U.S. — but it's a sanctions story, not a quality story. The world's largest cigar factory, in the DR, had its exports frozen for two quarters. The DR still shipped over 196 million premium cigars last year. Come talk leaf with us at Nell's Social in Bartonsville — where knowing the story is part of the experience. 🇩🇴"}], "note": null, "flag": null}, {"id": "thu-vet", "day": "thu", "time": "11:00 AM", "title": "Veteran Reel (PA) — DVRETX + HB 1257", "account": "@alexa.realtor", "platform": "Instagram", "kind": "video", "blocks": [{"label": "Script (30–60 sec)", "text": "HOOK (0:00–0:04): Pennsylvania veterans — there's a property-tax break worth 100 percent of your bill, and a bill in Harrisburg right now that could open it to thousands more of you.\n\nBODY: Here's the current law. The Disabled Veterans' Real Estate Tax Exemption — DVRETX — wipes out 100 percent of the property tax on your primary residence. County, municipal, and school. Right now it requires a 100 percent permanent-and-total rating, and you had to serve in a war or conflict. That's where House Bill 1257 comes in. It would drop the wartime-service requirement and extend a proportional exemption to veterans rated 50 percent or higher. It passed the House Appropriations Committee 37 to nothing back in March. But it's a constitutional amendment — it's been sitting in the state Senate since March 30 with no vote. If this matters to you, your senator is who to call.\n\nCLOSE: And if you're buying: K-FIT down-payment assistance stacks on top of your VA loan. I'm Alexa Sanchez — this is education, not advice. Call me to see where you land."}, {"label": "IG caption", "text": "PA veterans: DVRETX can eliminate 100% of your property tax — and HB 1257 could open it to veterans rated 50%+. The bill's been stuck in the PA Senate since March. Here's the current rule and what's pending. 🇺🇸\n\nAlexa Sanchez · Licensed Realtor · PA License #RS326383 · Smart Way America Realty · (570) 688-8147. Educational only.\n\n#VeteranHomebuyer #VALoan #VeteranRealEstate #PARealEstate #LifeByAlexa"}, {"label": "Cover text", "text": "NEON GREEN: 100% PROPERTY TAX EXEMPTION\nRED/WHITE: PA VETERANS"}, {"label": "YouTube description", "text": "Pennsylvania's Disabled Veterans' Real Estate Tax Exemption can eliminate 100% of the property tax on a veteran's primary residence. Here's who qualifies today, and how House Bill 1257 could expand it.\n\nQ: What is the PA disabled veteran property tax exemption? DVRETX provides a 100% exemption from county, municipal, and school real estate taxes on a qualifying disabled veteran's primary residence. Under current law it requires a 100% permanent-and-total rating and wartime service.\nQ: What would HB 1257 change? It would remove the wartime-service requirement and extend a proportional exemption to veterans rated 50% or higher, plus protect surviving spouses of veterans killed in action, taken prisoner, or declared MIA. As a constitutional amendment it needs passage in two consecutive sessions; it passed House Appropriations 37–0 in March and has been in the PA Senate since March 30.\nQ: Can I use down-payment assistance with a VA loan? Yes. PHFA's K-FIT (5% of price/value, no dollar cap, forgiven over 10 years) stacks with VA financing.\n\nAlexa Sanchez · Licensed Realtor · PA License #RS326383 · Smart Way America Realty · (570) 688-8147. Educational only; not affiliated with or endorsed by the VA."}], "note": "Educational only — no VA endorsement, no rate guarantee.", "flag": null}, {"id": "thu-yt", "day": "thu", "time": "11:00 AM", "title": "Veteran Upload (PA) — YouTube", "account": "@alexa.realtor", "platform": "YouTube", "kind": "video", "blocks": [{"label": "Script (adapted, longer)", "text": "Same three beats as the Reel, expanded ~30 sec to add: PTRR (up to $1,000 rebate, income limit now $48,110, filing deadline Dec 31, 2026, only half of Social Security counted) and the K-FIT vs. HOMEstead comparison (K-FIT: 5%, no dollar cap, max purchase $659K, forgiven 10%/yr over 10 yrs; HOMEstead: up to $10K, forgiven 20%/yr over 5 yrs, can't combine with other PHFA DPA). Close on 'educational only — I connect you to the right lender and county veteran affairs office.'"}, {"label": "YouTube title", "text": "PA Veterans: The 100% Property Tax Exemption (DVRETX) + What HB 1257 Would Change"}, {"label": "YouTube description", "text": "Pennsylvania's DVRETX can eliminate 100% of the property tax on a disabled veteran's primary residence. Here's who qualifies today, how HB 1257 would expand it, and how PA down-payment programs stack with a VA loan.\n\n0:00 The break most vets don't claim · 0:15 DVRETX today · 0:35 HB 1257 explained · 0:55 Where it's stuck · 1:10 Stacking K-FIT/HOMEstead with VA · 1:40 PTRR rebate\n\nAlexa Sanchez · Licensed Realtor · PA License #RS326383 · Smart Way America Realty · (570) 688-8147. Educational only; not affiliated with or endorsed by the VA. Rates not guaranteed."}, {"label": "Tags", "text": "pa veteran property tax exemption, DVRETX, HB 1257 pennsylvania, VA loan pennsylvania, veteran home buyer, PHFA K-FIT, disabled veteran benefits pa, monroe county veterans"}], "note": null, "flag": null}, {"id": "thu-gbp-en", "day": "thu", "time": "9:00 AM", "title": "GBP Veteran Post — English", "account": "@alexa.realtor", "platform": "Google Business Profile", "kind": "gbp", "blocks": [{"label": "Post (no hashtags)", "text": "For Pennsylvania Veterans — This Week's Housing Note\n\nThe Disabled Veterans' Real Estate Tax Exemption (DVRETX) can eliminate 100% of the property tax — county, municipal, and school — on your primary residence. Today it requires a 100% permanent-and-total rating and wartime service. House Bill 1257, which passed the PA House Appropriations Committee 37–0, would remove the wartime requirement and extend a proportional exemption to veterans rated 50% or higher. It's been awaiting a PA Senate vote since March 30. If you're buying, PHFA's K-FIT down-payment assistance stacks with a VA loan. I help Monroe County veterans navigate all of it. Educational only; not affiliated with the VA.\n\nAlexa Sanchez · PA License #RS326383 · Smart Way America Realty · (570) 688-8147 · Alexa@alexasanchez.net"}], "note": null, "flag": null}, {"id": "thu-gbp-es", "day": "thu", "time": "9:00 AM", "title": "GBP Veteran Post — Spanish", "account": "@alexa.realtor", "platform": "Google Business Profile", "kind": "gbp", "blocks": [{"label": "Post (no hashtags)", "text": "Para los Veteranos de Pennsylvania — Nota de la Semana\n\nLa exención de impuestos para veteranos discapacitados (DVRETX) puede eliminar el 100% del impuesto a la propiedad — del condado, municipal y escolar — en su residencia principal. Hoy requiere una calificación permanente y total del 100% y servicio en tiempo de guerra. El Proyecto de Ley 1257, aprobado 37 a 0 en el comité de la Cámara, eliminaría el requisito de guerra y extendería una exención proporcional a veteranos con calificación del 50% o más. Está esperando voto en el Senado estatal desde el 30 de marzo. Si va a comprar, la ayuda K-FIT de PHFA se combina con un préstamo VA. Solo educativo; sin afiliación con el VA.\n\nAlexa Sanchez · Licencia PA #RS326383 · Smart Way America Realty · (570) 688-8147 · Alexa@alexasanchez.net"}], "note": null, "flag": null}, {"id": "thu-li", "day": "thu", "time": "8:00 AM", "title": "LinkedIn Operator Post", "account": "@alexa.realtor", "platform": "LinkedIn", "kind": "post", "blocks": [{"label": "Post", "text": "The cigar industry just handed me a case study in narrative control. Honduras passed the Dominican Republic as the #2 exporter to the U.S. this quarter — and the lazy headline is 'DR is declining.' The real story: the world's largest cigar factory got frozen out by unrelated sanctions and ran at 40% capacity for two quarters. The terroir, the craft, and the 40,000 jobs behind it didn't move an inch.\n\nAs someone building a boutique brand rooted in Dominican heritage, that distinction is everything. A volume number can't tell you why the DR still shipped 196 million premium cigars last year. As an operator, my job isn't to win the volume race — it's to own the story the numbers can't tell. That's true for a cigar brand. It's true for a FAST network. It's true for a real estate practice. Position on the story, not the spreadsheet.\n\n#OperatorLife #DominicanEntrepreneur #LifeByAlexa"}], "note": "Operator voice lives here while alexasanchez.com is paused.", "flag": null}, {"id": "thu-nd", "day": "thu", "time": "Repost", "title": "Nextdoor — Landmark repost", "account": "@alexa.realtor", "platform": "Nextdoor", "kind": "post", "blocks": [{"label": "Post", "text": "If you've got out-of-town family visiting this month, Big Pocono State Park is an easy win. It's the summit of Camelback in Tannersville — a 1.4-mile paved drive loops the top, so no real hike, and on a clear day you can see all the way to the Catskills, about 100 miles out. The park closes for the season in December, so August is prime time. Fire tower's been up there since 1921. Worth the evening trip.\n\n— Alexa Sanchez, Smart Way America Realty"}], "note": "No selling language. No CTA. Same landmark as Friday's Spotlight.", "flag": null}, {"id": "thu-fb", "day": "thu", "time": "Repost", "title": "FB Business — market repurpose", "account": "@alexa.realtor", "platform": "Facebook Business", "kind": "post", "blocks": [{"label": "Post", "text": "This week's Pocono market read in one line: the Fed held but mortgage rates still rose to 6.66% (11-month high), while Monroe County's median holds at $348,854, +14.9% YoY. It's a pricing test — well-priced homes sell in ~38 days, overpriced ones sit near 57. Full breakdown on the blog (The Pocono Ledger). Questions? (570) 688-8147."}], "note": null, "flag": null}, {"id": "thu-cigar", "day": "thu", "time": "Post", "title": "Cigar/Lounge Video — the CAFTA-DR test", "account": "@its.myash", "platform": "IG + TikTok", "kind": "video", "blocks": [{"label": "Script", "text": "Quick test to prove you actually know cigars. Somebody hands you a 'Dominican' cigar. How do you know it's really Dominican?\n\nThe answer is a trade rule most smokers never heard of — CAFTA-DR. For a cigar to get duty-free treatment as Dominican, the wrapper and the filler have to be wholly grown in the DR or a partner country. Ecuadorian wrapper? Cameroon filler? Doesn't count.\n\nSo next time someone brags about their 'DR cigar,' ask where the leaf was grown. That's the difference between a country of assembly and a country of origin.\n\nAnd when we build our own boutique blend — that's a story we get to tell honestly."}, {"label": "Caption (IG + TikTok)", "text": "How to tell if a 'Dominican cigar' is actually Dominican 🇩🇴 It comes down to one trade rule almost nobody knows. Come test your palate at Nell's Social in Bartonsville.\n\n#CigarAuthority #DominicanCigars #NellsSocial #PremiumCigars #LifeByAlexa"}, {"label": "Visual", "text": "Hands-and-cigar B-roll over voiceover, warm lamp light. IG + TikTok only — does NOT go to YouTube."}], "note": "IG + TikTok only — does NOT go to YouTube.", "flag": null}, {"id": "fri-landmark", "day": "fri", "time": "Post", "title": "Landmark Spotlight — Big Pocono State Park", "account": "@alexa.realtor", "platform": "Instagram", "kind": "post", "blocks": [{"label": "Photo direction", "text": "Big Pocono State Park, summit of Camelback Mountain (Jackson & Pocono Townships). Late afternoon / golden hour on a clear, haze-free August day. Frame: wide landscape from the summit overlook looking out toward the Catskills, with the 1921 Big Pocono Fire Tower in the left or right third as a recognizable anchor. Real photo only — no watercolor, no overlay. Vertical crop for IG/Shorts."}, {"label": "IG caption", "text": "This is the view that sells the Poconos in one photo. 🏔️ Big Pocono State Park sits on the summit of Camelback Mountain — 2,133 feet, the highest publicly accessible point in Monroe County. On a clear August day you can see the Catskills, about 100 miles out, across three states. And you don't hike for it: a 1.4-mile paved, ADA-accessible drive circles the top. Residents drive up on a random Tuesday after work, no lift ticket required. This is what living here actually looks like.\n\n#PoconoMountains #MonroeCounty #PoconoLiving #BigPoconoStatePark #LifeByAlexa"}], "note": "Cross-posts: GBP Saturday (sat-gbp) + Nextdoor Thursday (thu-nd) — same photo, no reshoot.", "flag": null}, {"id": "fri-yt-landmark", "day": "fri", "time": "Post", "title": "Landmark — YouTube post/Short", "account": "@alexa.realtor", "platform": "YouTube", "kind": "post", "blocks": [{"label": "Community post copy", "text": "Big Pocono State Park — Camelback Mountain summit, Tannersville. 2,133 ft, the highest publicly accessible point in Monroe County — 1,306 acres, a fire tower standing since 1921, and a 1.4-mile paved ADA drive around the top. On a clear day the view reaches the Catskills, ~100 miles away. This is the everyday-access lifestyle that draws buyers relocating from New York and New Jersey. — Alexa Sanchez, PA License #RS326383, Smart Way America Realty, (570) 688-8147"}, {"label": "If uploaded as a Short — title", "text": "The Best View in the Poconos You Can DRIVE To — Big Pocono State Park #shorts"}, {"label": "If uploaded as a Short — description", "text": "Big Pocono State Park sits on Camelback Mountain's 2,133-ft summit in Monroe County, PA — a tri-state view reaching the Catskills ~100 miles out, via a 1.4-mile paved drive. No hike required.\n\n0:00 The view · 0:10 Why it matters for living here\n\nAlexa Sanchez · PA License #RS326383 · Smart Way America Realty · (570) 688-8147 · Alexa@alexasanchez.net"}, {"label": "Tags", "text": "big pocono state park, camelback mountain, pocono mountains, monroe county pa, things to do poconos, pocono living, tannersville pa, alexa sanchez realtor"}], "note": null, "flag": null}, {"id": "fri-dren-reel", "day": "fri", "time": "Post", "title": "DR English — IG Reel", "account": "@alexa.realtor", "platform": "Instagram", "kind": "video", "blocks": [{"label": "Script (under 60 sec)", "text": "On-screen (0:00–0:02): 'Veterans: your VA loan does NOT work here.' (cut to Cap Cana visual)\n\nYou served. You earned that VA benefit. It does not cross this border. VA loans are U.S. soil only — period. So if you're buying a condo in Cap Cana or Punta Cana, you've got four real options: pay cash, use developer financing, get a Dominican bank mortgage, or tap the equity on your U.S. home. Most Americans use cash or developer financing — 10 to 30 percent down, no U.S. credit check. Know which one is yours before you talk to a sales rep. That's how you don't waste three weeks chasing a dead end."}, {"label": "Caption", "text": "Veterans — your VA loan stops at the U.S. border. It will NOT finance your Cap Cana condo. Here are the 4 things that actually will. 🇩🇴 Save this before you talk to any DR developer.\n\n#DominicanRepublicRealEstate #PuntaCana #CapCana #DRInvestment #InternationalRealEstate #LifeByAlexa"}, {"label": "Cover text", "text": "RED/WHITE: YOUR VA LOAN DOESN'T WORK HERE"}], "note": "Franchise: no written parent, no other derivatives. Feeds YouTube and stops.", "flag": "Financing figures move — verify current developer/DR-bank terms before recording. Don't put a single DR bank rate on screen; say 'get it in writing.'"}, {"id": "fri-dren-yt", "day": "fri", "time": "Post", "title": "DR English — YouTube (longer cut)", "account": "@alexa.realtor", "platform": "YouTube", "kind": "video", "blocks": [{"label": "Script (longer, deeper mechanics)", "text": "HOOK: If you're an American planning to buy in the Dominican Republic, and you think your VA loan is coming with you — stop. It isn't. Here's the law, and here's what actually finances a DR purchase.\n\nTHE LAW: VA loans are authorized under Title 38, U.S. Code, Chapter 37. The guaranty only attaches to a primary residence on U.S. soil — the 50 states plus Guam, Puerto Rico, the U.S. Virgin Islands, American Samoa, and the Northern Marianas. The DR is not U.S. territory, so no lender can originate a VA-backed loan there. This isn't paperwork you route around. It's structural.\n\nTHE FOUR PATHS (most to least common):\n1. Cash. Still the most common structure for U.S. buyers in Cap Cana and Punta Cana. Cleanest close.\n2. Developer financing. Typically 10 to 30 percent down, balance financed by the developer over 2 to 5 years. No U.S. credit check, DR-based contract. Easiest entry point.\n3. Dominican bank mortgage. Banco Popular, Scotiabank DR, BanReservas, and Banco BHD lend to non-residents. Expect 30 to 50 percent down and USD rates reported in the 8 to 12 percent range — higher in pesos. You'll typically need to show $2,500 to $4,000 a month in income. One caution: Scotiabank publishes a much lower headline rate, but aggregators report foreigners actually closing higher. Don't trust a headline number — get a written rate sheet.\n4. U.S. home equity or cash-out refi. The closest an American gets to 'using U.S. financing,' because the collateral stays stateside.\n\nCLOSE: Pick your path before you sit with a developer. Verify current developer and bank terms in writing at the time of purchase — these numbers move. And note: CONFOTUR is a tax incentive, not a mortgage program. I'm Alexa Sanchez."}, {"label": "YouTube title", "text": "Why Your VA Loan Won't Work in the Dominican Republic (And What Actually Will)"}, {"label": "YouTube description", "text": "Planning to buy in Cap Cana, Punta Cana, or anywhere in the Dominican Republic? If you're a U.S. veteran counting on your VA loan, this explains — with the actual law — why it won't apply, and walks the four financing paths Americans really use.\n\nQ: Can I use a VA loan to buy property in the Dominican Republic? No. Under 38 U.S.C. Chapter 37, the VA guaranty only attaches to a primary residence on U.S. soil (the 50 states and five U.S. territories). The DR doesn't qualify.\nQ: How do Americans finance Dominican real estate? Most to least common: cash, developer financing (10–30% down, no U.S. credit check), a Dominican bank mortgage (30–50% down, ~8–12% USD), or tapping U.S. home equity.\nQ: Do Dominican banks lend to foreigners? Yes — Banco Popular, Scotiabank DR, BanReservas, and Banco BHD, typically requiring $2,500–$4,000/month documented income. Always get the rate in writing.\n\n0:00 The hook · 0:25 The law (38 U.S.C. Ch. 37) · 1:00 Cash · 1:20 Developer financing · 1:55 DR bank mortgages · 2:40 U.S. home equity · 3:10 CONFOTUR is not a loan\n\nAlexa Sanchez · Licensed Realtor · PA License #RS326383 · Smart Way America Realty · (570) 688-8147. Educational only; verify all financing terms in writing."}, {"label": "Tags", "text": "dominican republic real estate, cap cana condos, punta cana investment, VA loan overseas, financing property in dominican republic, buying property in DR as an american, developer financing dominican republic, scotiabank dominican republic"}], "note": null, "flag": null}, {"id": "fri-li", "day": "fri", "time": "8:00 AM", "title": "LinkedIn Veteran Post", "account": "@alexa.realtor", "platform": "LinkedIn", "kind": "post", "blocks": [{"label": "Post", "text": "'Can I use my VA loan to buy a retirement place in the Dominican Republic?'\n\nIt's one of the most common questions I get from veteran buyers — and the answer is no, for a reason worth understanding. The VA guaranty is authorized under Title 38, U.S. Code, Chapter 37, and it only attaches to a primary residence on U.S. soil — the 50 states and five U.S. territories. The Dominican Republic isn't one of them, so no lender can originate a VA-backed loan there. This isn't a paperwork hurdle to route around; it's structural.\n\nThe practical takeaway: a veteran buying in the DR needs a different financing plan from day one — cash, developer financing, a Dominican bank, or tapping U.S. home equity. Knowing that before you talk to a developer saves weeks of chasing a dead end.\n\nMeanwhile, stateside, your VA benefit is stronger than ever — VA rates near 6.23% with zero down give you materially more buying power than a conventional buyer right now. Use the benefit where it works.\n\nAlexa Sanchez · Licensed Realtor · PA License #RS326383 · Smart Way America Realty · (570) 688-8147. Educational only; not affiliated with or endorsed by the VA.\n\n#VeteranHomebuyer #VALoan #VeteranRealEstate #LifeByAlexa"}], "note": null, "flag": null}, {"id": "fri-smoke", "day": "fri", "time": "6:00 PM", "title": "Weekend Smoke Reel", "account": "@its.myash", "platform": "Instagram", "kind": "video", "blocks": [{"label": "Script (~30 sec)", "text": "Friday. The week is done and the lounge is open. Here's the read on where cigar culture is actually going — and it's good news for us.\n\nThe lounges winning right now aren't just seats and humidors. They're doing pairing nights, terroir talks, rolling demos. Younger smokers want the education, not just the ashtray.\n\nThat's exactly what Nell's Social is built for. So this weekend — come learn something, not just light something. Pour something dark, grab a stick, and let's talk leaf. 25 Route 611, Bartonsville."}, {"label": "Caption", "text": "Weekend Smoke 🥃🚬 The lounges winning right now sell education, not just seating. That's the whole idea behind Nell's Social. Come learn something this weekend — 25 Route 611, Bartonsville.\n\n#CigarLife #NellsSocial #CigarAuthority #OperatorLife #LifeByAlexa"}, {"label": "Cover text", "text": "NEON GREEN: WEEKEND SMOKE (chunky, tilted)"}], "note": null, "flag": null}, {"id": "fri-fb", "day": "fri", "time": "7:00 PM", "title": "Personal FB — Spanish", "account": "Personal", "platform": "Facebook", "kind": "post", "blocks": [{"label": "Post", "text": "Un dato para mis amistades: si eres veterano y sueñas con comprar en la República Dominicana, tu préstamo VA no cruza la frontera — es solo para propiedad en suelo estadounidense. Pero hay cuatro maneras reales de financiar: efectivo, financiamiento del desarrollador, un banco dominicano, o usar el equity de tu casa aquí. Antes de hablar con un vendedor allá, hay que saber cuál es la tuya. Cualquier pregunta, aquí estoy. — Alexa"}], "note": "Fresh Spanish — not a translation of the EN veteran post.", "flag": null}, {"id": "sat-gbp", "day": "sat", "time": "10:00 AM", "title": "GBP Community/Lifestyle — Big Pocono", "account": "@alexa.realtor", "platform": "Google Business Profile", "kind": "gbp", "blocks": [{"label": "Post (no hashtags)", "text": "Weekend in the Pocono Mountains — a Tri-State View You Can Drive To\n\nOne of the best things about living here: Big Pocono State Park sits on the 2,133-foot summit of Camelback Mountain in Monroe County — the highest publicly accessible point in the county, with a fire tower standing since 1921 and a 1.4-mile paved drive around the top. On a clear August day the view reaches the Catskills, roughly 100 miles away. This is the everyday lifestyle that keeps drawing families here from New York and New Jersey.\n\nCurious what living in the Poconos actually looks like? Let's talk.\n\nAlexa Sanchez · Local Pocono Mountains Realtor · PA License #RS326383 · Smart Way America Realty · (570) 688-8147 · Alexa@alexasanchez.net"}, {"label": "Photo", "text": "Same Big Pocono summit photo as Friday's Landmark — plain real photo, no overlay card."}], "note": null, "flag": null}, {"id": "sat-ig", "day": "sat", "time": "10:00 AM", "title": "Spanish IG Post — market", "account": "@alexa.realtor", "platform": "Instagram", "kind": "post", "blocks": [{"label": "Caption", "text": "La Fed no subió las tasas esta semana… pero tu hipoteca sí subió — 6.66%, lo más alto en 11 meses. ¿La razón? Tu hipoteca sigue al mercado de bonos, no a la Fed. Mientras tanto, los precios en el condado de Monroe siguen fuertes: precio medio $348,854, casi 15% más que el año pasado. Si estás esperando una rebaja para comprar, ojo — en septiembre podría subir. 📊\n\n#BienesRaices #InversionesEnPoconos #MonroeCounty #PARealEstate #LifeByAlexa"}], "note": null, "flag": null}, {"id": "gal-lifestyle", "day": "gallery", "time": "Standing", "title": "Lifestyle Card — watercolor", "account": "Website", "platform": "Local Life & Global Vibes", "kind": "gallery", "blocks": [{"label": "Watercolor prompt", "text": "soft realistic Watercolor illustration of a Latina woman with medium skin tone, voluminous curly dark brown hair, gold watch, gold jewelry. Warm earthy tones — cream, tan, soft brown, muted greens. Soft natural lighting. Soft smooth watercolor washes, clean paper texture, fluid brushstrokes, delicate linework, luminous and airy. Editorial lifestyle illustration style. no text, no logos. Scene this week: standing at a mountain summit overlook at golden hour, one hand shading her eyes, gazing out over layered blue ridgelines, a light cardigan over her shoulders, relaxed and content."}, {"label": "Headline (overlay)", "text": "THE VIEW IS THE WHOLE POINT"}, {"label": "Body — English", "text": "In the Pocono Mountains, a three-state view isn't a special occasion — it's a Tuesday. Big Pocono State Park sits on the 2,133-foot summit of Camelback, the highest publicly accessible point in Monroe County, and you can drive right to the top. This is the everyday version of 'getting away from it all,' and it's exactly what pulls families here from New York and New Jersey. Living here means the scenery is built into your commute home."}, {"label": "Body — Spanish", "text": "En los Montes Poconos, una vista de tres estados no es una ocasión especial — es un martes cualquiera. Vivir aquí significa que el paisaje es parte de tu día."}, {"label": "CTA", "text": "Full guide coming soon — 'Living in the Pocono Mountains & Lehigh Valley: The Complete 2026 Guide' (Placeholder → Pillar)"}, {"label": "Alt text", "text": "Watercolor illustration of a Latina woman standing at a Pocono Mountains summit overlook at golden hour, looking out over blue ridgelines."}, {"label": "Tracker line", "text": "2026-08-08 | Lifestyle | 'The View Is the Whole Point' | summit overlook golden hour | CTA: Placeholder (Pillar) | watercolor"}], "note": "CTA is a placeholder until the Pillar is built. That guide is still the resolution target for every Lifestyle-card CTA.", "flag": null}, {"id": "gal-landmark", "day": "gallery", "time": "Standing", "title": "Landmark Card — Big Pocono (real photo)", "account": "Website", "platform": "Local Life & Global Vibes", "kind": "gallery", "blocks": [{"label": "Photo direction", "text": "Big Pocono State Park summit — the tri-state overlook with the 1921 fire tower in frame. Golden hour, clear day. Real photo only, never illustrated. Use a different frame from the Friday IG post so a visitor who saw the Reel still gets something new. Canva manual crop, 4:5."}, {"label": "Short caption", "text": "Big Pocono State Park · Camelback Mountain summit, Tannersville. 2,133 ft — the highest publicly accessible point in Monroe County. Tri-state views, a 1.4-mile paved drive, no hike required. Open through December."}, {"label": "Alt text", "text": "Real photograph of the tri-state view from the summit of Big Pocono State Park on Camelback Mountain, Monroe County PA, with the historic fire tower."}, {"label": "Tracker line", "text": "2026-08-08 | Landmark | Big Pocono State Park summit | real photo, fire tower in frame | CTA: n/a"}], "note": "Listing card: SKIP this week — no new active inventory. (Wed GBP Listing Feature also skipped for the same reason.)", "flag": null}, {"id": "mo-dr-spanish", "day": "monthly", "time": "Record + post", "title": "DR Spanish Video — CONFOTUR", "account": "@alexa.realtor", "platform": "IG + YouTube", "kind": "video", "blocks": [{"label": "Guión (cadencia dominicana · <3 min · un tema)", "text": "GANCHO (0:00–0:06)\nÓyeme bien, mi gente. Si tú tienes familia comprando en Punta Cana o Cap Cana y creen que TODA propiedad nueva viene sin impuestos… te van a costar un billete. Déjame explicarte CONFOTUR de verdad.\n\nCUERPO\nCONFOTUR es la Ley 158-01. Cuando aplica, es una maravilla: te exime del 3 por ciento del impuesto de transferencia, y hasta 15 años sin pagar el 1 por ciento del IPI, el impuesto anual a la propiedad. Suena bello, ¿verdad?\n\nPero aquí está la trampa que nadie te dice: CONFOTUR NO es automático. Es una certificación proyecto por proyecto. No es 'toda construcción nueva.' Es 'este proyecto específico fue aprobado.' Entonces cuando el vendedor te diga 'esto tiene CONFOTUR,' tú le dices: enséñame la certificación por escrito. No de palabra.\n\nY ojo con el umbral — para 2026, la exención del IPI llega hasta unos 170 mil dólares. Las zonas con más proyectos aprobados son Punta Cana, Cap Cana, Samaná y partes de Puerto Plata.\n\nCIERRE\nLos números reales: en un ejemplo con 42 mil dólares de renta, CONFOTUR bajó los impuestos casi un 68 por ciento. Eso es dinero de verdad — pero solo si el proyecto está certificado. Pide el papel. Soy Alexa Sanchez. Llámame: 570-688-8147."}, {"label": "YouTube title (ES)", "text": "CONFOTUR en República Dominicana: La Verdad que los Vendedores No Te Dicen (2026)"}, {"label": "YouTube description (ES)", "text": "CONFOTUR (Ley 158-01) puede eximirte del impuesto de transferencia del 3% y hasta 15 años del IPI en propiedades turísticas dominicanas. Pero hay una condición clave que causa errores costosos.\n\nP: ¿Toda construcción nueva en la RD tiene CONFOTUR? No. CONFOTUR es una certificación proyecto por proyecto, no automática. Pide la certificación por escrito.\nP: ¿Qué exime CONFOTUR? El 3% del impuesto de transferencia y hasta 15 años del impuesto anual IPI del 1%. El umbral de exención del IPI para 2026 es de unos $170,000 USD.\n\n0:00 El error de $ que cometen · 0:30 Qué exime CONFOTUR · 1:10 Por qué NO es automático · 1:50 Las zonas · 2:20 El ahorro real\n\nAlexa Sanchez · PA License #RS326383 · Smart Way America Realty · (570) 688-8147. Solo educativo; verifica toda certificación por escrito."}, {"label": "IG caption (ES)", "text": "¿Tu vendedor te dijo que tu condo en Punta Cana 'tiene CONFOTUR'? Pídele el papel. 📄 No toda construcción nueva califica — es proyecto por proyecto. Te explico cómo no perder miles. 🇩🇴\n\n#BienesRaices #RepublicaDominicana #PuntaCana #CapCana #LifeByAlexa"}, {"label": "Cover text", "text": "RED/WHITE: CONFOTUR NO ES AUTOMÁTICO\nNEON GREEN: 68% MENOS"}], "note": "First-week-of-month monthly lane. Perplexity 03M was skipped — this is built from the 05 DR half (Latino-audience CONFOTUR angle), distinct from the DR English foreign-buyer angle. Output 15 (monthly content queue) skipped this cycle.", "flag": null}, {"id": "mo-dr-veteran", "day": "monthly", "time": "Record + post", "title": "DR Veteran Reel — FMP / FTIN", "account": "@alexa.realtor", "platform": "IG + YouTube", "kind": "video", "blocks": [{"label": "Script", "text": "HOOK (0:00–0:05): Veterans living in the Dominican Republic — there's a July 2026 deadline item that could delay your medical reimbursements. Handle it now.\n\nBODY: The VA's Foreign Medical Program just moved to a new claims system that supports direct deposit. To keep your reimbursements coming without delay, you need a Foreign Tax Identification Number — an FTIN — and you have to submit it to the FMP team if you don't already have one. Two things to know. One: right now only U.S. bank accounts support electronic FMP payments — VA is working on international accounts, but it's not live yet. Two: FMP only covers your VA-rated, service-connected disabilities — not general health conditions, and not spouses or dependents.\n\nAnd if you're putting down roots there — Law 171-07 lets you claim residency as a pensioner on $1,500 a month in qualifying pension income, and military retirement or VA disability pay generally counts. Confirm your specific documentation with DR immigration counsel.\n\nCLOSE: This is education, not advice — but the FTIN piece is time-sensitive. Don't let it lapse. Alexa Sanchez, licensed PA Realtor."}, {"label": "YouTube title", "text": "Veterans in the Dominican Republic: New FMP Rule + FTIN You Need (July 2026)"}, {"label": "YouTube description", "text": "The VA's Foreign Medical Program moved to a new claims system in July 2026. Veterans living abroad may need a Foreign Tax Identification Number (FTIN) to avoid reimbursement delays. Here's what changed and what to check.\n\nQ: What is the new FMP requirement? FMP moved to a new claims system supporting direct deposit; veterans must obtain and submit an FTIN if they don't already have one to avoid claim delays. Only U.S. bank accounts currently support electronic FMP payments.\nQ: Can veterans get DR residency on VA disability pay? Under Law 171-07, the pensioner track requires $1,500/month in qualifying pension income, and military retirement/VA disability pay generally counts — confirm documentation with DR immigration counsel.\n\n0:00 The deadline item · 0:20 The FTIN requirement · 0:45 U.S. bank accounts only · 1:00 What FMP covers · 1:20 Law 171-07 residency\n\nAlexa Sanchez · Licensed Realtor · PA License #RS326383 · Smart Way America Realty · (570) 688-8147. Educational only; not affiliated with or endorsed by the VA. Confirm all requirements with the VA and DR counsel."}, {"label": "IG caption", "text": "Veterans in the DR: a July 2026 change to the VA Foreign Medical Program could delay your reimbursements. You may need an FTIN — here's the fix. 🇺🇸🇩🇴\n\n#VeteranHomebuyer #VeteranRealEstate #DominicanRepublic #VALoan #LifeByAlexa"}, {"label": "Cover text", "text": "RED/WHITE: VETERANS IN THE DR\nNEON GREEN: NEW FMP RULE"}], "note": "Include PA License #RS326383, Smart Way America Realty, phone per §35.305. Educational only; no VA endorsement.", "flag": "FMP FTIN is time-sensitive — a live compliance item, not background. Pulled forward from the monthly bank so DR-based veteran clients don't miss reimbursements."}]};

const state = {};           // itemId -> bool
let sb = null;
let persist = false;

const $ = s => document.querySelector(s);
const key = id => DATA.weekHash + ":" + id;
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- SYNC ---------- */
function setSync(cls, text){
  const el = $("#sync");
  el.className = "sync " + cls;
  $("#syncText").textContent = text;
}

async function initSync(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY){
    setSync("warn", "Not synced — add Supabase keys to save across devices");
    return;
  }
  try{
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const {data, error} = await sb.from("ops_checks")
      .select("key,done").like("key", DATA.weekHash + ":%");
    if(error) throw error;
    (data || []).forEach(r => { state[r.key.split(":").slice(1).join(":")] = !!r.done; });
    persist = true;
    setSync("ok", "Synced · " + DATA.weekHash);
    render();
  }catch(err){
    console.error(err);
    setSync("warn", "Sync failed — checks won't save. Check keys and RLS policy.");
  }
}

async function save(id, done){
  if(!persist) return;
  try{
    const {error} = await sb.from("ops_checks")
      .upsert({key:key(id), done, updated_at:new Date().toISOString()}, {onConflict:"key"});
    if(error) throw error;
    setSync("ok", "Saved " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}));
  }catch(err){
    console.error(err);
    setSync("warn", "Didn't save — check connection");
  }
}

/* ---------- RENDER ---------- */
let activeDay = DAYS[new Date().getDay()] ? DAYS[new Date().getDay()].id : "sun";
if(!DAYS.some(d => d.id === activeDay)) activeDay = "sun";

function itemsFor(day){ return DATA.items.filter(i => i.day === day); }
function doneCount(day){ return itemsFor(day).filter(i => state[i.id]).length; }

function renderTabs(){
  $("#tabs").innerHTML = DAYS.map(d => {
    const list = itemsFor(d.id), done = doneCount(d.id);
    const all = list.length > 0 && done === list.length;
    return `<button class="tab${all ? " all-done" : ""}" role="tab" data-day="${d.id}"
      aria-selected="${d.id === activeDay}">${d.label}
      <span class="count">${done}/${list.length}</span></button>`;
  }).join("");
}

function renderProgress(){
  const total = DATA.items.length;
  const done = DATA.items.filter(i => state[i.id]).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  $("#progressFill").style.width = pct + "%";
  $("#progressText").textContent = done + " of " + total + " posted";
  $("#progressPct").textContent = pct + "%";
}

function cardHTML(it){
  const done = state[it.id] ? "1" : "0";
  const blocks = it.blocks.map((b, i) => `
    <div class="block">
      <div class="block-head">
        <span class="block-label">${esc(b.label)}</span>
        <button class="copy-btn" data-copy="${it.id}|${i}">Copy</button>
      </div>
      <pre id="blk-${it.id}-${i}">${esc(b.text)}</pre>
    </div>`).join("");
  return `
  <article class="card" data-id="${it.id}" data-done="${done}" data-open="0"
           data-flagged="${it.flag ? 1 : 0}">
    <div class="card-top">
      <button class="check" data-check="${it.id}" aria-pressed="${done === "1"}"
        aria-label="Mark ${esc(it.title)} posted">
        <svg viewBox="0 0 24 24"><polyline points="4 12.5 9.5 18 20 6.5"/></svg>
      </button>
      <div class="card-main">
        <div class="card-time">${esc(it.time)}</div>
        <h3 class="card-title">${esc(it.title)}</h3>
        <div class="chips">
          <span class="chip acct">${esc(it.account)}</span>
          <span class="chip${it.kind === "gbp" ? " kind-gbp" : ""}">${esc(it.platform)}</span>
        </div>
      </div>
    </div>
    ${it.flag ? `<div class="flag">${esc(it.flag)}</div>` : ""}
    ${it.note ? `<div class="note">${esc(it.note)}</div>` : ""}
    <button class="toggle-blocks" data-toggle="${it.id}">
      <span>${it.blocks.length} copy block${it.blocks.length > 1 ? "s" : ""}</span>
      <span class="arrow">▼</span>
    </button>
    <div class="blocks">${blocks}</div>
  </article>`;
}

function renderDay(){
  const d = DAYS.find(x => x.id === activeDay);
  const list = itemsFor(activeDay);
  $("#main").innerHTML = `
    <div class="day-head">
      <h2>${esc(d.full)}</h2><span class="date">${esc(d.date)}</span>
    </div>
    ${list.length ? list.map(cardHTML).join("")
      : `<p class="empty">Nothing scheduled. Enjoy it.</p>`}`;
}

function render(){ renderTabs(); renderDay(); renderProgress(); }

/* ---------- EVENTS ---------- */
document.addEventListener("click", async e => {
  const tab = e.target.closest("[data-day]");
  if(tab){ activeDay = tab.dataset.day; render(); window.scrollTo({top:0}); return; }

  const chk = e.target.closest("[data-check]");
  if(chk){
    const id = chk.dataset.check;
    state[id] = !state[id];
    const card = chk.closest(".card");
    card.dataset.done = state[id] ? "1" : "0";
    chk.setAttribute("aria-pressed", state[id]);
    renderTabs(); renderProgress();
    save(id, state[id]);
    return;
  }

  const tog = e.target.closest("[data-toggle]");
  if(tog){
    const card = tog.closest(".card");
    card.dataset.open = card.dataset.open === "1" ? "0" : "1";
    return;
  }

  const cp = e.target.closest("[data-copy]");
  if(cp){
    const [id, i] = cp.dataset.copy.split("|");
    const text = document.getElementById("blk-" + id + "-" + i).textContent;
    try{
      await navigator.clipboard.writeText(text);
    }catch(_){
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
    }
    cp.textContent = "Copied"; cp.classList.add("copied");
    setTimeout(() => { cp.textContent = "Copy"; cp.classList.remove("copied"); }, 1400);
  }
});

$("#resetBtn").addEventListener("click", async () => {
  if(!confirm("Clear every check for " + DATA.week + "? This can't be undone.")) return;
  const ids = DATA.items.map(i => i.id);
  ids.forEach(id => state[id] = false);
  render();
  if(persist){
    try{
      await sb.from("ops_checks").delete().like("key", DATA.weekHash + ":%");
      setSync("ok", "Week cleared");
    }catch(err){ console.error(err); setSync("warn", "Reset didn't save"); }
  }
});

/* ---------- BOOT ---------- */
$("#weekLabel").textContent = DATA.week;
render();
initSync();
</script>
</body>
</html>

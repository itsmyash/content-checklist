# Pings the Content Tracker database every 3 days so Supabase's free plan
# never pauses it for inactivity (it pauses after ~7 days without use).
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the checklist table
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://gzqgeehcvmgstznkyfnw.supabase.co/rest/v1/checklist_state?select=key&limit=1" \
            -H "apikey: sb_publishable_LU8vcdqazISUz4ntCs2-9A_BOY7oAsb" \
            -H "Authorization: Bearer sb_publishable_LU8vcdqazISUz4ntCs2-9A_BOY7oAsb")
          echo "Supabase responded with HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Database did not respond. It may be paused. Restore it at https://supabase.com/dashboard/project/gzqgeehcvmgstznkyfnw"
            exit 1
          fi
